              <div class="ref-reward-date">${r.granted_at?.slice(0,10) || ""}</div>
            </div>`).join("")
        : `<div class="ref-empty">🎁 Пока пусто — награды появятся здесь</div>`;

      return `
        <div style="margin-top:16px">
          <!-- Hero -->
          <div class="ref-hero">
            <div class="ref-hero-inner">
              <div class="ref-hero-label">👥 Приглашай друзей — получай Premium</div>
              <div class="ref-level-row">
                <div class="ref-level-badge">${esc(lvl.emoji || "🥉")}</div>
                <div>
                  <div class="ref-level-name">${esc(lvl.name)}</div>
                  <div class="ref-level-sub">твой уровень партнёра</div>
                </div>
              </div>
              ${nextLv ? `
              <div class="ref-prog-wrap">
                <div class="ref-prog-track"><div class="ref-prog-fill" style="width:${progPct}%"></div></div>
                <div class="ref-prog-label">${esc(progLabel)}</div>
              </div>` : `<div class="ref-prog-label" style="color:rgba(255,255,255,0.52);margin-bottom:12px">💎 Ты на вершине — уровень Diamond!</div>`}
              <div class="ref-link-wrap">
                <div class="ref-link-text" id="refLinkText">${esc(d.ref_link)}</div>
                <button class="ref-copy-btn" id="refCopyBtn">📋 Копировать</button>
              </div>
              <button class="ref-share-btn" id="refShareBtn">🚀 Поделиться с другом</button>
            </div>
          </div>

          <!-- Stats -->
          <div class="ref-stats-row">
            <div class="ref-stat-card"><div class="ref-stat-val">${d.total_invited}</div><div class="ref-stat-lbl">Приглашено</div></div>
            <div class="ref-stat-card"><div class="ref-stat-val" style="color:#4ade80">${d.active_count}</div><div class="ref-stat-lbl">Активных 🟢</div></div>
            <div class="ref-stat-card"><div class="ref-stat-val" style="color:rgba(255,255,255,0.38)">${d.pending_count}</div><div class="ref-stat-lbl">Ждут ⏳</div></div>
          </div>

          ${(d.referrer_reward_days || d.referee_reward_days) ? `
          <div style="background:rgba(109,40,217,0.12);border-radius:16px;padding:12px 14px;margin-bottom:4px;font-size:12.5px;color:var(--text);line-height:1.6;box-shadow:0 0 0 0.5px rgba(139,92,246,0.22),inset 0 1px 0 rgba(255,255,255,0.08)">
            ${d.referrer_reward_days ? `⭐ <b>Ты</b> получаешь +${d.referrer_reward_days} дн. Premium за каждого активного друга<br>` : ""}
            ${d.referee_reward_days  ? `🎁 <b>Твой друг</b> тоже получает +${d.referee_reward_days} дн. Premium — сразу при старте` : ""}
          </div>` : ""}

          <div class="ref-section-title">🏅 Бонусы за друзей</div>
          <div class="ref-milestone-list">${milestonesHtml}</div>

          <div class="ref-section-title">👥 Последние приглашённые</div>
          <div class="ref-recent-list">${recentHtml}</div>

          <div class="ref-section-title">🎁 Что ты уже получил</div>
          <div class="ref-reward-list">${rewardHtml}</div>
        </div>
      `;
    }

    // Robust copy — works in Telegram WebView where navigator.clipboard is
    // blocked (no secure-context focus). Falls back to execCommand('copy').
    function copyTextRobust(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).catch(() => _execCommandCopy(text));
      }
      _execCommandCopy(text);
    }
    function _execCommandCopy(text) {
      try {
        const el = document.createElement("textarea");
        el.value = text;
        el.style.cssText = "position:fixed;top:-9999px;left:-9999px;opacity:0";
        document.body.appendChild(el);
        el.focus();
        el.select();
        el.setSelectionRange(0, el.value.length);
        document.execCommand("copy");
        document.body.removeChild(el);
      } catch (_) {}
    }

    // ── AI Analysis modal ─────────────────────────────────────────────────────
    let _aiCurrentChatId   = null;
    let _aiCurrentChatName = "";

    function openAiAnalysisForChat() {
      toastMessage("🤖 Нажмите «Анализ» рядом с нужным контактом");
    }

    // Update all .ai-remaining-hint elements in the DOM (called after each
    // successful analysis when we learn the user's remaining daily count).
    function _updateAiRemainingHint() {
      const rem = window._aiAnalysesRemaining;
      const lim = window._aiAnalysesLimit ?? 10;
      if (rem == null) return;
      document.querySelectorAll(".ai-remaining-hint").forEach(el => {
        if (rem > 0) {
          el.style.color = "";
          el.textContent = `Осталось\u00a0${rem}\u202f/\u202f${lim} анализов сегодня`;
        } else {
          el.style.color = "#ff3b30";
          el.textContent = "🚫 Лимит на сегодня исчерпан. Попробуй завтра.";
        }
      });
    }

    function openAiAnalysisModal(chatId, name) {
      _aiCurrentChatId   = chatId;
      _aiCurrentChatName = name;
      let overlay = document.getElementById("aiModalOverlay");
      if (!overlay) {
        overlay = document.createElement("div");
        overlay.id = "aiModalOverlay";
        overlay.className = "ai-modal-overlay";
        document.body.appendChild(overlay);
      }
      overlay.style.display = "flex";
      overlay.innerHTML = `
        <div class="ai-modal-header">
          <button class="ai-modal-back" onclick="closeAiModal()">‹</button>
          <div>
            <div class="ai-modal-title">🤖 AI Анализ отношений</div>
            <div class="ai-modal-sub">${esc(name)}</div>
          </div>
        </div>
        <div class="ai-modal-body" id="aiModalBody">
          <div class="ai-loading-wrap">
            <div class="ai-loading-spinner"></div>
            <div style="font-size:14px;font-weight:600;color:var(--hint)">Анализируем переписку…</div>
            <div style="font-size:12px;color:var(--hint);text-align:center;max-width:240px;line-height:1.5">Наш AI читает историю чата и строит отчёт. Занимает ~15 секунд</div>
          </div>
        </div>`;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
      _runAiAnalysis(chatId, name);
    }

    function closeAiModal() {
      const overlay = document.getElementById("aiModalOverlay");
      if (overlay) overlay.style.display = "none";
    }

    async function _runAiAnalysis(chatId, name) {
      const body = document.getElementById("aiModalBody");
      if (!body) return;
      try {
        const res = await fetch("/app/api/ai/relationship_analysis", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ initData: currentInitData, chatId, contactName: name }),
        });
        if (!res.ok) {
          const err = await res.json().catch(()=>({}));
          if (err.detail === "vip_required") {
            body.innerHTML = `<div class="ai-loading-wrap">
              <div style="font-size:36px">💎</div>
              <div style="font-size:15px;font-weight:700;text-align:center">AI Анализ — VIP функция</div>
              <div style="font-size:13px;color:var(--hint);text-align:center;max-width:260px;line-height:1.55">Для доступа к AI анализу отношений нужна VIP подписка</div>
              <button onclick="closeAiModal();shopSubTab='subscription';switchMainTab('shop');setTimeout(()=>{document.querySelector('.sub-tier-tab[data-tier=vip]')?.click();},400)"
                style="margin-top:8px;border:none;border-radius:14px;padding:13px 24px;font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#c47800,#9c4cc4);color:#fff">
                💎 Перейти на VIP
              </button>
            </div>`;
            return;
          }
          const MSGS = {
            no_messages:      "📭 В этом чате пока нет сообщений для анализа",
            no_connection:    "❌ Бизнес-аккаунт не подключён",
            ai_not_configured:"⚙️ AI сервис временно недоступен",
            analysis_failed:  "❌ Ошибка анализа. Попробуй позже.",
            gemini_timeout:   "⏱ Анализ занял слишком долго. Попробуй ещё раз.",
            gemini_quota:     "⏳ AI перегружен — слишком много запросов. Попробуй через минуту.",
            gemini_rate_limit:"🚫 Лимит анализов на сегодня исчерпан. Попробуй завтра.",
          };
          // Strip internal prefix "analysis_failed: gemini_quota" → "gemini_quota"
          const rawDetail = (err.detail || "").replace(/^analysis_failed:\s*/, "");
          const errText = MSGS[rawDetail] || MSGS[err.detail] || "❌ Ошибка анализа. Попробуй позже.";
          body.innerHTML = `<div class="ai-loading-wrap">
            <div style="font-size:36px">${rawDetail === "gemini_rate_limit" ? "🚫" : "😔"}</div>
            <div style="font-size:13px;font-weight:600;color:var(--hint);text-align:center;word-break:break-word;max-width:280px">${errText}</div>
          </div>`;
          return;
        }
        const data = await res.json();
        // Persist remaining count so the hint near the Analyse button stays fresh.
        if (data.analyses_remaining != null) {
          window._aiAnalysesRemaining = data.analyses_remaining;
          window._aiAnalysesLimit     = data.analyses_limit ?? 10;
          _updateAiRemainingHint();
        }
        body.innerHTML = renderAiReport(data, name);
        // Append remaining-count footer inside the modal body.
        if (data.analyses_remaining != null) {
          const footer = document.createElement("div");
          footer.style.cssText = "text-align:center;font-size:11px;color:var(--hint);padding:8px 0 14px;";
          const rem = data.analyses_remaining, lim = data.analyses_limit ?? 10;
          footer.textContent = rem > 0
            ? `Осталось ${rem}\u202f/\u202f${lim} анализов сегодня`
            : "Лимит анализов на сегодня исчерпан. Попробуй завтра.";
          body.appendChild(footer);
        }
        _drawEmotionChart(data.ai?.emotions);
        _drawInterestArc(Math.round((data.ai?.interest?.probability) || 0),
          (() => { const p = Math.round((data.ai?.interest?.probability)||0); return p>=60?"#34c759":p>=35?"#ff9500":"#ff3b30"; })());
      } catch (e) {
        body.innerHTML = `<div class="ai-loading-wrap">
          <div style="font-size:36px">😔</div>
          <div style="font-size:14px;font-weight:600;color:var(--hint)">Ошибка соединения</div>
        </div>`;
      }
    }

    function _ratioBar(aNum, bNum, aLabel, bLabel, aColor, bColor) {
      const tot  = (aNum + bNum) || 1;
      const aPct = Math.round(aNum / tot * 100);
      const bPct = 100 - aPct;
      return `<div class="ai-ratio-wrap">
        <div class="ai-ratio-bar">
          <div class="ai-ratio-a" style="width:${aPct}%;background:${aColor}">${aPct > 14 ? aPct + "%" : ""}</div>
          <div class="ai-ratio-b" style="width:${bPct}%;background:${bColor}">${bPct > 14 ? bPct + "%" : ""}</div>
        </div>
        <div class="ai-ratio-labels"><span style="color:${aColor}">● ${aLabel}</span><span style="color:${bColor}">● ${bLabel}</span></div>
      </div>`;
    }

    function renderAiReport(data, name) {
      const ai    = data.ai    || {};
      const stats = data.stats || {};
      const esc2  = s => String(s || "").replace(/</g,"&lt;").replace(/>/g,"&gt;");

      // ── 1. Score ─────────────────────────────────────────────────────────
      const gs         = ai.general_score || {};
      const score      = Math.min(10, Math.max(1, gs.score || 0));
      const scoreColor = score >= 7 ? "#34c759" : score >= 5 ? "#ff9500" : "#ff3b30";
      const scoreR = 48, scoreCx = 70, scoreCy = 58;
      const scoreLen = Math.PI * scoreR;
      const scoreFill = (score / 10) * scoreLen;

      // ── 2. Balance ───────────────────────────────────────────────────────
      const bal = ai.balance || {};
      const um  = stats.user_messages    || 0;
      const cm  = stats.contact_messages || 0;
      const uw  = stats.user_words       || 0;
      const cw  = stats.contact_words    || 0;
      const ui  = stats.initiates_user   || 0;
      const ci  = stats.initiates_contact|| 0;

      // ── 3. Interest ──────────────────────────────────────────────────────
      const int_     = ai.interest || {};
      const intPct   = Math.round(int_.probability || 0);
      const intColor = intPct >= 60 ? "#34c759" : intPct >= 35 ? "#ff9500" : "#ff3b30";
      const indicators = (int_.indicators || []).slice(0, 8);

      // ── 4/5. Style / Personality ─────────────────────────────────────────
      const style = ai.style       || {};
      const pers  = ai.personality || {};

      // ── 8/9. Flags ───────────────────────────────────────────────────────
      const redFlags   = (ai.red_flags   || []).slice(0, 8);
      const greenFlags = (ai.green_flags || []).slice(0, 8);

      // ── 10. Stats ────────────────────────────────────────────────────────
      const media = stats.media || {};
      const mediaItems = [
        ["📷","Фото",    media.photo      || 0],
        ["🎥","Видео",   media.video      || 0],
        ["🎙","Голос",   media.voice      || 0],
        ["⭕","Кружки",  media.video_note || 0],
        ["😊","Стикеры", media.sticker   || 0],
        ["📎","Файлы",   media.document  || 0],
      ].filter(([,,n]) => n > 0);

      const flagsHtml = (arr, ico, color) => arr.length
        ? arr.map(f=>`<div class="ai-flag-row"><span class="ai-flag-ico">${ico}</span><span style="color:${color}">${esc2(f)}</span></div>`).join("")
        : `<div style="color:var(--hint);font-size:13px;padding:6px 0">Не обнаружено</div>`;

      const tagCloud = (tags, cls="") => (tags||[]).map(t=>`<span class="ai-tag ${cls}">${esc2(t)}</span>`).join("");

      const indicatorHtml = indicators.map(ind => {
        const lvl = (ind.level||"medium").toLowerCase();
        const bc  = lvl==="high"?"#34c759":lvl==="low"?"#ff3b30":"#ff9500";
        const bp  = lvl==="high"?85:lvl==="low"?25:55;
        return `<div class="ai-indicator-row">
          <div class="ai-indicator-top">
            <span class="ai-indicator-name">${esc2(ind.name)}</span>
            <div class="ai-indicator-bar-track"><div class="ai-indicator-bar-fill" style="width:${bp}%;background:${bc}"></div></div>
          </div>
          ${ind.value ? `<div class="ai-indicator-val">${esc2(ind.value)}</div>` : ""}
        </div>`;
      }).join("");

      return `
        <!-- 1. Score gauge -->
        <div class="ai-sec">
          <div class="ai-sec-head"><span class="ai-sec-ico">${_si("ico-brain",20)}</span><span class="ai-sec-label">Общая оценка общения</span></div>
          <div class="ai-sec-body">
            <div class="ai-score-gauge-wrap">
              <svg width="140" height="72" viewBox="0 0 140 72" overflow="visible" style="display:block">
                <defs>
                  <linearGradient id="sgGrad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#5856d6"/>
                    <stop offset="100%" stop-color="${scoreColor}"/>
                  </linearGradient>
                </defs>
                <path d="M ${scoreCx-scoreR} ${scoreCy} A ${scoreR} ${scoreR} 0 0 1 ${scoreCx+scoreR} ${scoreCy}"
                  fill="none" stroke="rgba(120,120,128,.15)" stroke-width="9" stroke-linecap="round"/>
                <path d="M ${scoreCx-scoreR} ${scoreCy} A ${scoreR} ${scoreR} 0 0 1 ${scoreCx+scoreR} ${scoreCy}"
                  fill="none" stroke="url(#sgGrad)" stroke-width="9" stroke-linecap="round"
                  stroke-dasharray="${scoreFill.toFixed(1)} ${scoreLen.toFixed(1)}"/>
              </svg>
              <div class="ai-score-gauge-num" style="color:${scoreColor}">${score.toFixed(1)}</div>
              <div class="ai-score-gauge-sub">из 10</div>
            </div>
            <div style="text-align:center;font-size:15px;font-weight:800;margin-top:4px">${esc2(gs.label||"")}</div>
            <div style="font-size:12.5px;color:var(--hint);margin-top:6px;line-height:1.6">${esc2(gs.description||"")}</div>
          </div>
        </div>

        <!-- 2. Balance с диаграммами -->
        <div class="ai-sec">
          <div class="ai-sec-head"><span class="ai-sec-ico">${_si("ico-scale",20)}</span><span class="ai-sec-label">Баланс отношений</span></div>
          <div class="ai-sec-body">
            <div class="ai-ratio-section-lbl">Сообщений</div>
            ${_ratioBar(um, cm, "Вы "+um, esc2(name)+" "+cm, "#5856d6", "#34c759")}
            <div class="ai-ratio-section-lbl">Слов</div>
            ${_ratioBar(uw, cw, "Вы "+(uw).toLocaleString(), esc2(name)+" "+(cw).toLocaleString(), "#5856d6", "#34c759")}
            <div class="ai-ratio-section-lbl">Начинали разговор</div>
            ${_ratioBar(ui, ci, "Вы "+ui, esc2(name)+" "+ci, "#5856d6", "#34c759")}
            <div class="ai-balance-grid" style="margin-top:14px">
              <div class="ai-balance-card"><div class="ai-balance-val">${esc2(bal.avg_response_time_user)||"—"}</div><div class="ai-balance-lbl">Ответ — Вы</div></div>
              <div class="ai-balance-card"><div class="ai-balance-val">${esc2(bal.avg_response_time_contact)||"—"}</div><div class="ai-balance-lbl">Ответ — ${esc2(name)}</div></div>
              <div class="ai-balance-card"><div class="ai-balance-val">${esc2(bal.ends_conversation)||"—"}</div><div class="ai-balance-lbl">Чаще заканчивает</div></div>
              <div class="ai-balance-card"><div class="ai-balance-val">${esc2(bal.ignores_more)||"—"}</div><div class="ai-balance-lbl">Чаще игнорирует</div></div>
            </div>
          </div>
        </div>

        <!-- 3. Interest с кольцом -->
        <div class="ai-sec">
          <div class="ai-sec-head"><span class="ai-sec-ico">${_si("ico-heart",20)}</span><span class="ai-sec-label">Заинтересованность ${esc2(name)}</span></div>
          <div class="ai-sec-body">
            <div class="ai-interest-wrap">
              <canvas id="aiIntCanvas" width="84" height="84" style="flex-shrink:0"></canvas>
              <div>
                <div class="ai-interest-ring-label" style="color:${intColor}">${intPct}%</div>
                <div class="ai-interest-ring-sub">вероятность интереса</div>
              </div>
            </div>
            ${indicatorHtml}
          </div>
        </div>

        <!-- 4. Style -->
        <div class="ai-sec">
          <div class="ai-sec-head"><span class="ai-sec-ico">${_si("ico-msg",20)}</span><span class="ai-sec-label">Стиль общения</span></div>
          <div class="ai-sec-body">
            <div class="ai-tag-lbl">Вы</div>
            <div class="ai-tags">${tagCloud(style.user_tags)||'<span style="color:var(--hint);font-size:12px">нет данных</span>'}</div>
            <div class="ai-tag-lbl" style="margin-top:10px">${esc2(name)}</div>
            <div class="ai-tags">${tagCloud(style.contact_tags,"contact")||'<span style="color:var(--hint);font-size:12px">нет данных</span>'}</div>
          </div>
        </div>

        <!-- 5. Personality -->
        <div class="ai-sec">
          <div class="ai-sec-head"><span class="ai-sec-ico">${_si("ico-layers",20)}</span><span class="ai-sec-label">Особенности личности</span></div>
          <div class="ai-sec-body">
            <div class="ai-tag-lbl">Вы</div>
            <div class="ai-tags">${tagCloud(pers.user_traits)||'<span style="color:var(--hint);font-size:12px">нет данных</span>'}</div>
            <div class="ai-tag-lbl" style="margin-top:10px">${esc2(name)}</div>
            <div class="ai-tags">${tagCloud(pers.contact_traits,"contact")||'<span style="color:var(--hint);font-size:12px">нет данных</span>'}</div>
          </div>
        </div>

        <!-- 6. Dynamics -->
        <div class="ai-sec">
          <div class="ai-sec-head"><span class="ai-sec-ico">${_si("ico-trending",20)}</span><span class="ai-sec-label">Динамика отношений</span></div>
          <div class="ai-sec-body">
            ${(()=>{const dyn=ai.dynamics||{};
              const ico = dyn.trend==="growing"?"📈":dyn.trend==="declining"?"📉":"➡️";
              const clr = dyn.trend==="growing"?"#34c759":dyn.trend==="declining"?"#ff3b30":"#ff9500";
              return `<div style="display:flex;align-items:center;gap:12px">
                <div style="font-size:34px">${ico}</div>

    function _drawEmotionChart(emo) {
      const canvas = document.getElementById("aiEmoPie");
      const legend = document.getElementById("aiEmoPieLegend");
      if (!canvas || !emo) return;
      const slices = [
        { label: "Позитив",      value: emo.positive   || 0, color: "#34c759" },
        { label: "Нейтральность",value: emo.neutral     || 0, color: "#8e8e93" },
        { label: "Поддержка",    value: emo.support     || 0, color: "#5856d6" },
        { label: "Раздражение",  value: emo.irritation  || 0, color: "#ff9500" },
        { label: "Грусть",       value: emo.sadness     || 0, color: "#ff3b30" },
      ].filter(s => s.value > 0);
      const total   = slices.reduce((a, s) => a + s.value, 0) || 1;
      const ctx     = canvas.getContext("2d");
      const cx = 65, cy = 65, r = 56, inner = 36, gap = 0.03;
      let angle = -Math.PI / 2;

      slices.forEach(sl => {
        const sweep = (sl.value / total) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, angle + gap, angle + sweep - gap);
        ctx.closePath();
        ctx.fillStyle = sl.color;
        ctx.fill();
        angle += sweep;
      });

      // Donut hole — use destination-out for true transparency
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(cx, cy, inner, 0, Math.PI * 2);
      ctx.fillStyle = "#000";
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";

      // Dominant emotion label in center
      const dominant = slices.reduce((a, b) => b.value > a.value ? b : a, slices[0]);
      if (dominant) {
        const pct = Math.round(dominant.value / total * 100);
        ctx.textAlign    = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle    = dominant.color;
        ctx.font         = "bold 14px system-ui, -apple-system, sans-serif";
        ctx.fillText(pct + "%", cx, cy - 7);
        ctx.fillStyle = "rgba(142,142,147,0.9)";
        ctx.font      = "10px system-ui, -apple-system, sans-serif";
        const short = dominant.label.length > 10 ? dominant.label.slice(0, 9) + "…" : dominant.label;
        ctx.fillText(short, cx, cy + 8);
      }

      if (legend) {
        legend.innerHTML = slices.map(sl => {
          const pct = Math.round(sl.value / total * 100);
          return `<div class="ai-pie-legend-row">
            <div class="ai-pie-dot" style="background:${sl.color}"></div>
            <span style="flex:1">${sl.label}</span>
            <span style="font-weight:700;color:${sl.color}">${pct}%</span>
          </div>`;
        }).join("");
      }
    }

    function _drawInterestArc(pct, color) {
      const canvas = document.getElementById("aiIntCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const cx = 42, cy = 42, r = 34, lw = 8;
      // Arc from -135° to 135° (270° sweep)
      const startA = Math.PI * 0.75;
      const sweepA = Math.PI * 1.5;

      // Track
      ctx.beginPath();
      ctx.arc(cx, cy, r, startA, startA + sweepA);
      ctx.strokeStyle = "rgba(120,120,128,.15)";
      ctx.lineWidth   = lw;
      ctx.lineCap     = "round";
      ctx.stroke();

      // Fill
      const fillEnd = startA + (pct / 100) * sweepA;
      ctx.beginPath();
      ctx.arc(cx, cy, r, startA, fillEnd);
      ctx.strokeStyle = color;
      ctx.lineWidth   = lw;
      ctx.lineCap     = "round";
      ctx.stroke();
    }

    async function renderInteractTab(forceRefresh) {
      const el = document.getElementById("interactContent");
      if (!el) return;

      const CACHE_TTL = 45_000; // 45 seconds
      const now = Date.now();
      const cacheHit = !forceRefresh && _interactCache.ts && (now - _interactCache.ts < CACHE_TTL)
                       && _interactCache.relData && _interactCache.petData;

      if (cacheHit) {
        // Render immediately from cache — no skeleton, no network round-trip
        _renderInteractContent(el, _interactCache.relData, _interactCache.petData);
        return;
      }

      // Skeleton loader while fetching — stop age ticker during load
      if (_interactAgeTicker) { clearInterval(_interactAgeTicker); _interactAgeTicker = null; }
      el.innerHTML = `<div class="interact-skeleton">
        <div class="interact-skel-card"></div>
        <div class="interact-skel-card" style="height:130px"></div>
      </div>`;

      const initData = tg ? tg.initData : currentInitData;
      if (!initData) {
        el.innerHTML = `<div class="error"><span class="big-emoji">⚠️</span>Нет данных.<br>Попробуй обновить страницу.</div>`;
        return;
      }

      try {
        const opts = {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData }),
        };
        const [relRes, petRes] = await Promise.all([
          fetch("/app/api/relationships/list", opts),
          fetch("/app/api/pet/list", opts),
        ]);

        const relData  = relRes.ok  ? await relRes.json()  : { relationships: [] };
        const petLocal = petRes.ok  ? await petRes.json()  : { pets: [], available_chats: [], feed_cost: 20 };

        // Store in cache
        _interactCache = { ts: Date.now(), relData, petData: petLocal };

        _renderInteractContent(el, relData, petLocal);

      } catch (err) {
        console.error("[renderInteractTab]", err);
        el.innerHTML = `<div class="error"><span class="big-emoji">⚠️</span>Не удалось загрузить.<br>Попробуй обновить.</div>`;
      }
    }

            <span>🔄</span> Обновить

          <div class="interact-section-title">💗 Отношения</div>

            ? renderRelationshipCards(relationships)

            <div class="interact-section-title">🐾 Питомцы</div>

        pane.innerHTML = _renderInteractLbHTML(interactLbCache.relLb, interactLbCache.petLb, interactLbCache.relMe, interactLbCache.petMe);

        const opts = { method:"POST", headers:{"Content-Type":"application/json"},
                       body: JSON.stringify({initData: currentInitData}) };

          fetch("/app/api/relationships/leaderboard", opts),
          fetch("/app/api/pet/leaderboard", opts),
        ]);

        const petData = petRes.ok ? await petRes.json() : {};

        const petLb = petData.leaderboard ?? [];

    function _interactAgeLabel(ts) {
      if (!ts) return "";
      const sec = Math.floor((Date.now() - ts) / 1000);
      if (sec < 10) return "только что";
      if (sec < 60) return `${sec} сек. назад`;
      const min = Math.floor(sec / 60);
      return `${min} мин. назад`;
    }

    function _startInteractAgeTicker() {
      if (currentTab !== "interact") return;
      if (_interactAgeTicker) clearInterval(_interactAgeTicker);
      // Set immediately, then update every 5 s
      const update = () => {
        if (currentTab !== "interact") { clearInterval(_interactAgeTicker); _interactAgeTicker = null; return; }
        const lbl = document.getElementById("interactCacheAge");
        if (!lbl) { clearInterval(_interactAgeTicker); _interactAgeTicker = null; return; }
        lbl.textContent = _interactCache.ts ? `Обновлено ${_interactAgeLabel(_interactCache.ts)}` : "";
      };
      update();
      _interactAgeTicker = setInterval(update, 5000);
    }

    function _shopAgeLabel(ts) {
      if (!ts) return "";
      const sec = Math.floor((Date.now() - ts) / 1000);
      if (sec < 10) return "только что";
      if (sec < 60) return `${sec} с назад`;
      const min = Math.floor(sec / 60);
      return `${min} мин. назад`;

    function _startShopAgeTicker() {
      if (_shopCacheAgeTicker) clearInterval(_shopCacheAgeTicker);
      // Don't start if the user is no longer on the shop tab
      if (currentTab !== "shop") return;
      const update = () => {
        // Stop if the user has navigated away since the ticker was started
        if (currentTab !== "shop") { clearInterval(_shopCacheAgeTicker); _shopCacheAgeTicker = null; return; }

        const initials = (r.partner_name || "??")
          .replace(/[^А-ЯA-ZЁё]/gi, "")
          .slice(0, 2).toUpperCase()
          || (r.partner_name || "??").slice(0, 2).toUpperCase();

        const isPending    = r.status === "pending";
        const isInitiator  = r.is_initiator;
        const isFriendship = r.category === "friendship";

        // Category-aware headers and labels
        const CERT_HEADER = isFriendship
          ? { friends: "ЛУЧШИЕ ДРУЗЬЯ", dating: "ЛУЧШИЕ ДРУЗЬЯ", married: "ЛУЧШИЕ ДРУЗЬЯ" }
          : { friends: "ДРУЗЬЯ", dating: "ВЛЮБЛЁННАЯ ПАРА", married: "СВИДЕТЕЛЬСТВО О БРАКЕ" };
        const TIER_LABEL = isFriendship
          ? { friends: "Друзья", dating: "Друзья", married: "Друзья" }
          : { friends: "Друзья", dating: "Влюблённые", married: "Женаты 💍" };

        const headerText = isPending
          ? (isFriendship ? "ЗАПРОС ДРУЖБЫ 👫" : "ЗАПРОС В ПАРУ 💕")

                      <div style="font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${q.title}</div>
                      <div style="height:3px;border-radius:2px;background:rgba(128,128,128,0.2);margin-top:2px;overflow:hidden">
                        <div style="height:100%;border-radius:2px;background:linear-gradient(90deg,#ff5e87,#ff9f0a);width:${pct}%"></div>

                <div class="cert-stat-val">${r.total_gifts || 0}</div>

              <div class="cert-stat-cell">
                <div class="cert-stat-val">${r.total_postcards || 0}</div>

            </div>
            <div class="cert-stats-footer2">
              <div class="cert-stat-cell">

              </div>
              <div class="cert-stat-cell">
                <div class="cert-stat-val">${r.xp || 0}</div>
                <div class="cert-stat-lbl">❤️ XP</div>
              </div>
              <div class="cert-stat-cell">
                <div class="cert-stat-val">${r.streak_days || 0}</div>
                <div class="cert-stat-lbl">🔥 Стрик</div>
              </div>
              <div class="cert-stat-cell">
                <div class="cert-stat-val">${r.streak_best || 0}</div>
                <div class="cert-stat-lbl">🏅 Рекорд</div>

            </div>
            <div id="pair-stats-${r.partner_id}"></div>
            <div class="cert-quick-actions">
              <button class="cert-quick-btn gift" ${r.gift_ready ? "" : "disabled"}

              <button class="cert-quick-btn more" ${r.postcard_ready ? "" : "disabled"}

              <button class="cert-quick-btn more"

        const openDataAttr = !isPending

        const _friendshipCls = isFriendship ? " cert-card--friendship" : "";
        const _midIcon = isFriendship ? "🤝" : "💗";
        const _lvColor = isFriendship ? "#b87c1a" : "#c0557a";

          <div class="cert-card${_friendshipCls}" ${openDataAttr}>

                ${lastStats?.username ? `<div class="cert-avatar-user">@${_esc(lastStats.username)}</div>` : ""}
              </div>
              <div class="cert-heart-mid">
                <div class="cert-heart-icon">${_midIcon}</div>

            </div>
            ${!isPending ? `
            <div class="cert-tier-badge-wrap">

    // ── Gift picker / couple quests / pair stats ─────────────────────────────

    function openGiftPicker(partnerId) {
      closeGiftPicker();
      const rel = lastRelationships[partnerId];
      const tierRank = { friends: 0, dating: 1, married: 2 };
      const myRank = tierRank[rel?.rel_type] ?? 0;
      const gifts = relGiftTypes.length ? relGiftTypes : [
        { id: "rose", emoji: "🌹", label: "Роза", cost: 50, to_partner: 40, xp: 100, min_tier: "friends" },
      ];
      const rows = gifts.map(g => {
        const locked = (tierRank[g.min_tier] ?? 0) > myRank;
        const lockNote = locked
          ? `<div style="font-size:10px;color:var(--hint)">🔒 нужен уровень «${g.min_tier === "dating" ? "Отношения" : "Брак"}»</div>` : "";
        return `
          <button style="display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:none;border-radius:14px;
            background:var(--card-bg,rgba(128,128,128,0.08));margin-bottom:8px;cursor:pointer;text-align:left;color:inherit;${locked ? "opacity:0.45" : ""}"
            ${locked ? "disabled" : `onclick="sendRelGift(${partnerId},'${g.id}')"`}>
            <span style="font-size:28px">${g.emoji}</span>
            <span style="flex:1;min-width:0">
              <div style="font-weight:700;font-size:14px">${g.label}</div>
              <div style="font-size:11px;color:var(--hint)">партнёру +${g.to_partner} 🪙 · +${g.xp} XP</div>
              ${lockNote}
            </span>
            <span style="font-weight:800;font-size:14px;flex-shrink:0">${g.cost} 🪙</span>
          </button>`;
      }).join("");
      const ov = document.createElement("div");
      ov.id = "gift-picker-overlay";
      ov.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.45);display:flex;align-items:flex-end;justify-content:center";
      ov.onclick = e => { if (e.target === ov) closeGiftPicker(); };
      ov.innerHTML = `
        <div style="width:100%;max-width:480px;background:var(--bg,#fff);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:70vh;overflow-y:auto">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <div style="font-size:16px;font-weight:800">🎁 Выбери подарок</div>
            <button style="border:none;background:none;font-size:20px;cursor:pointer;color:var(--hint)" onclick="closeGiftPicker()">✕</button>
          </div>
          ${rows}
        </div>`;
      document.body.appendChild(ov);
    }

    function closeGiftPicker() {
      document.getElementById("gift-picker-overlay")?.remove();
    }

    function sendRelGift(partnerId, giftId) {
      closeGiftPicker();
      _interactRelAction("/app/api/relationships/gift", partnerId, { giftId }, d => {
        let msg = `${d.gift?.emoji || "🎁"} Подарок отправлен! +${d.xp_gained || 0} XP обоим.`;
        if (d.streak_advanced) msg += ` 🔥 Стрик: ${d.streak_days} дн!`;
        if (d.milestone_coins) msg += ` 🏆 Бонус стрика: +${d.milestone_coins} 🪙 каждому!`;
        toastMessage(msg);

        // Update streak label on the card in real time
        const streakEl = document.getElementById(`rel-streak-${partnerId}`);
        if (streakEl && d.streak_days != null) {
          const rel = lastRelationships[partnerId] || {};
          const best = Math.max(d.streak_days, rel.streak_best || 0);
          const bonusPct = rel.streak_bonus_pct || 0;
          if (d.streak_days > 0) {
            streakEl.style.opacity = "";
            streakEl.textContent = `🔥 Стрик пары: ${d.streak_days} дн · Рекорд: ${best} дн${bonusPct ? ` · +${bonusPct}% XP` : ""}`;
          }
          // Update cached relationship data
          if (lastRelationships[partnerId]) {
            lastRelationships[partnerId].streak_days = d.streak_days;
            if (best > (lastRelationships[partnerId].streak_best || 0)) {
              lastRelationships[partnerId].streak_best = best;
            }
            lastRelationships[partnerId].gift_ready = false;
          }
          // Disable the gift button on the card
          const cardEl = document.querySelector(`[data-rel-open-id="${partnerId}"]`);
          if (cardEl) {
            const giftBtn = cardEl.querySelector(".cert-quick-btn.gift");
            if (giftBtn) giftBtn.disabled = true;
          }
        }
      });
    }

    async function sendPostcard(partnerId) {
      const btn = document.getElementById(`postcard-btn-${partnerId}`);
      if (btn) btn.disabled = true;
      const initData = tg ? tg.initData : currentInitData;
      try {
        const res = await fetch("/app/api/relationships/postcard", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData, partnerId }),
        });
        const d = await res.json();
        if (!res.ok) {
          if (res.status === 429) {
            toastMessage("💌 Открытка уже отправлена сегодня. Попробуй завтра!");
          } else {
            toastMessage(`Ошибка: ${d.detail || "не удалось отправить открытку"}`);
          }
          if (btn) btn.disabled = false;
          return;
        }
        toastMessage("💌 Открытка отправлена партнёру!");
        // Update cached relationship — disable postcard for 24h
        if (lastRelationships[partnerId]) {
          lastRelationships[partnerId].postcard_ready = false;
        }
      } catch (e) {
        toastMessage("Ошибка сети. Попробуй ещё раз.");
        if (btn) btn.disabled = false;
      }
    }

    function claimCoupleQuest(partnerId, questId) {
      _interactRelAction("/app/api/relationships/quest-claim", partnerId, { questId }, d => {
        toastMessage(`🎯 Квест выполнен! +${d.reward_coins} 🪙 каждому и +${d.reward_xp} XP.`);
      });
    }

    async function togglePairStats(partnerId) {
      const box = document.getElementById(`pair-stats-${partnerId}`);
      if (!box) return;
      if (box.innerHTML) { box.innerHTML = ""; return; }
      box.innerHTML = `<div style="font-size:12px;color:var(--hint);padding:8px 0">Считаем совместимость…</div>`;
      const initData = tg ? tg.initData : currentInitData;
      try {
        const res = await fetch("/app/api/relationships/pair-stats", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData, partnerId }),
        });
        const d = await res.json();
        if (!res.ok) { box.innerHTML = ""; toastMessage(`Ошибка: ${d.detail}`); return; }
        box.innerHTML = `
          <div style="margin-top:10px;padding:12px;border-radius:14px;background:rgba(255,94,135,0.08);text-align:left">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
              <span style="font-size:26px">💞</span>
              <div>
                <div style="font-size:20px;font-weight:800">${d.compatibility}%</div>
                <div style="font-size:11px;color:var(--hint)">совместимость</div>
              </div>
            </div>
            <div style="height:6px;border-radius:3px;background:rgba(128,128,128,0.2);overflow:hidden;margin-bottom:10px">
              <div style="height:100%;background:linear-gradient(90deg,#ff5e87,#a259ff);width:${d.compatibility}%"></div>
            </div>
            <div style="display:flex;gap:12px;font-size:12px;color:var(--hint);flex-wrap:wrap">
              <span>✉️ Отправлено: <b>${d.messages_sent}</b></span>
              <span>📩 Получено: <b>${d.messages_received}</b></span>
              <span>⚖️ Баланс: <b>${d.balance_pct}%</b></span>
              <span>🎁 Подарков: <b>${d.total_gifts}</b></span>
            </div>
          </div>`;
      } catch { box.innerHTML = ""; toastMessage("Ошибка, попробуй снова"); }

    function renderPetMiniCards(pets) {
      const alive = (pets || []).filter(p => p.is_alive);
      if (!alive.length) return "";

      return alive.map(p => {
        const hunger = p.hunger || 0;

          body: JSON.stringify({ initData: tg ? tg.initData : currentInitData, petId, foodType }),

    function _gvColor(name) {
      const COLORS = ["#6d28d9","#7c3aed","#db2777","#d97706","#059669","#2563eb","#dc2626","#9333ea"];
      let h = 0; for (const c of (name||"")) h = (h*31 + c.charCodeAt(0)) & 0xffff;
      return COLORS[h % COLORS.length];
    }
    function _gvInitials(name) {
      return (name||"??").replace(/[^А-ЯA-ZЁё]/gi,"").slice(0,2).toUpperCase()
          || (name||"??").slice(0,2).toUpperCase();
    }
    function _gvRefWord(n) {
      return n===1 ? "реферал" : n<5 ? "реферала" : "рефералов";
    }

    function _startGiveawayCountdown(deadline) {
      if (_giveawayTimer) { clearInterval(_giveawayTimer); _giveawayTimer = null; }
      function tick() {
        const el = document.getElementById("giveawayCountdown");
        if (!el) { clearInterval(_giveawayTimer); _giveawayTimer = null; return; }
        const diff = new Date(deadline).getTime() - Date.now();
        if (diff <= 0) {
          el.innerHTML = `<div class="giveaway-cd-finished">🏆 Розыгрыш завершён!</div>`;
          clearInterval(_giveawayTimer); _giveawayTimer = null; return;
        }
        const dv = Math.floor(diff / 86400000);
        const hv = Math.floor((diff % 86400000) / 3600000);
        const mv = Math.floor((diff % 3600000) / 60000);
        const sv = Math.floor((diff % 60000) / 1000);
        el.innerHTML = `<div class="giveaway-cd-wrap">
          <div class="giveaway-cd-cell"><div class="giveaway-cd-val">${dv}</div><div class="giveaway-cd-lbl">дней</div></div>
          <div class="giveaway-cd-cell"><div class="giveaway-cd-val">${String(hv).padStart(2,"0")}</div><div class="giveaway-cd-lbl">часов</div></div>
          <div class="giveaway-cd-cell"><div class="giveaway-cd-val">${String(mv).padStart(2,"0")}</div><div class="giveaway-cd-lbl">минут</div></div>
          <div class="giveaway-cd-cell"><div class="giveaway-cd-val">${String(sv).padStart(2,"0")}</div><div class="giveaway-cd-lbl">секунд</div></div>
        </div>`;
      }
      tick();
      _giveawayTimer = setInterval(tick, 1000);
    }

    function _startLockedCountdown(opensAt) {
      // Clear any existing giveaway timer before taking ownership.
      if (_giveawayTimer) { clearInterval(_giveawayTimer); _giveawayTimer = null; }

      function _cdHtml(diff) {
        const d = Math.max(0, Math.floor(diff / 86400000));
        const h = Math.max(0, Math.floor((diff % 86400000) / 3600000));
        const m = Math.max(0, Math.floor((diff % 3600000) / 60000));
        const s = Math.max(0, Math.floor((diff % 60000) / 1000));
        return `<div class="giveaway-cd-wrap">
          <div class="giveaway-cd-cell"><div class="giveaway-cd-val">${d}</div><div class="giveaway-cd-lbl">дней</div></div>
          <div class="giveaway-cd-cell"><div class="giveaway-cd-val">${String(h).padStart(2,"0")}</div><div class="giveaway-cd-lbl">часов</div></div>
          <div class="giveaway-cd-cell"><div class="giveaway-cd-val">${String(m).padStart(2,"0")}</div><div class="giveaway-cd-lbl">минут</div></div>
          <div class="giveaway-cd-cell"><div class="giveaway-cd-val">${String(s).padStart(2,"0")}</div><div class="giveaway-cd-lbl">секунд</div></div>
        </div>`;
      }

      // Self-scheduling step: one setTimeout handle in _giveawayTimer at a time.
      // When diff > 0  → update display, reschedule in 1 s.
      // When diff ≤ 0  → show zeros, wait 3 s, poll server once, then stop.
      //   loadGiveaway() calls renderGiveawayTab() which either:
      //     • replaces DOM with unlocked view (lockedCountdown gone → chain stops)
      //     • re-renders locked+opensAt → _startLockedCountdown restarts a fresh chain
      //     • re-renders locked without opensAt → static text, no timer
      async function step() {
        _giveawayTimer = null; // we're executing; handle is consumed
        const el = document.getElementById("lockedCountdown");
        if (!el) return; // DOM replaced — stop

        const diff = new Date(opensAt).getTime() - Date.now();
        if (diff <= 0) {
          el.innerHTML = _cdHtml(0);
          // Retry fetching up to 3 times (5 s apart) until the server flips
          // is_visible_to_all = true. This bridges the gap between the client
          // countdown reaching zero and the server actually unlocking the contest.
          const MAX_RETRIES = 3;
          const RETRY_DELAY = 5000;
          for (let attempt = 0; attempt < MAX_RETRIES; attempt++) {
            // Wait before each attempt (first wait is shorter to feel responsive).
            const delay = attempt === 0 ? 3000 : RETRY_DELAY;
            await new Promise(resolve => { _giveawayTimer = setTimeout(resolve, delay); });
            _giveawayTimer = null;
            if (!document.getElementById("lockedCountdown")) return; // DOM replaced while waiting
            giveawayData = null;
            await loadGiveaway(); // re-renders; if unlocked the countdown element is gone
            if (!document.getElementById("lockedCountdown")) return; // unlocked — chain ends
            // Still locked — continue to next retry
          }
          // All retries exhausted and still locked — leave the locked screen as-is.
          return;
        }

        el.innerHTML = _cdHtml(diff);
        _giveawayTimer = setTimeout(step, 1000); // reschedule; exactly one handle stored
      }

      // Kick off immediately (setTimeout 0 keeps the call async so the caller
      // always finishes before the first step runs, avoiding re-entrancy).
      _giveawayTimer = setTimeout(step, 0);
    }

    async function _silentRefreshGiveawayLeaderboard() {
      // Only refresh when the contest sub-tab is still visible
      if (giveawaySubTab !== "contest" || !currentInitData) return;
      try {
        const res = await fetch("/app/api/giveaway", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({initData: currentInitData}),
        });
        if (!res.ok) return;
        const fresh = await res.json();
        if (!fresh || fresh.locked) return;
        giveawayData = fresh;
        // Update only the leaderboard portions in-place (no full re-render)

    function _updateGiveawayLeaderboardInPlace() {
      if (!giveawayData || giveawayData.locked) return;
      const d = giveawayData;
      const topByRank = {};
      for (const r of (d.top || [])) topByRank[r.rank] = r;

      // Re-render podium
      const podiumEl = document.getElementById("giveawayPodium");
      if (podiumEl) {
        function _podiumSlotFresh(rank) {
          const u       = topByRank[rank];
          const isEmpty = !u;
          const avatarBg = isEmpty ? "" : `style="background:${_gvColor(u.display_name)}"`;
          const avatarTxt = isEmpty ? "?" : _gvInitials(u.display_name);
          const avatarPhoto = (!isEmpty && u.telegram_id) ? _avatarImg(`/app/api/avatar/${u.telegram_id}`) : '';
          const crownHtml = rank === 1 ? `<span class="giveaway-ps-crown">👑</span>` : "";
          const name  = isEmpty ? "Свободно"        : _esc(u.display_name);
          const count = isEmpty ? "Пригласи друзей" : `${u.referral_count} ${_gvRefWord(u.referral_count)}`;
          const baseNum = rank === 1 ? "1" : rank === 2 ? "2" : "3";
          return `<div class="giveaway-ps-slot rank-${rank}${isEmpty?" empty":""}">
            <div class="giveaway-ps-avatar" ${avatarBg}>${crownHtml}${avatarTxt}${avatarPhoto}</div>
            <div class="giveaway-ps-name">${name}</div>
            <div class="giveaway-ps-count">${count}</div>
            <div class="giveaway-ps-base">${baseNum}</div>
          </div>`;
        }
        podiumEl.innerHTML = _podiumSlotFresh(2) + _podiumSlotFresh(1) + _podiumSlotFresh(3);
      }

      // Re-render my-rank card
      const meEl = document.getElementById("giveawayMeCard");
      if (meEl) {
        const me = d.me || {};
        let meInner = "";
        if (me.referral_count > 0 && me.rank) {
          const inTop3 = me.rank <= 3;
          if (inTop3) {
            const lbl = me.rank===1 ? "🥇 Ты лидер!" : me.rank===2 ? "🥈 2-е место" : "🥉 3-е место";
            meInner = `<div class="giveaway-me-card">
              <div class="giveaway-me-rank-bubble">${me.rank}</div>
              <div class="giveaway-me-body">
                <div class="giveaway-me-title">${lbl} Ты в призах!</div>
                <div class="giveaway-me-hint">${me.referral_count} ${_gvRefWord(me.referral_count)} · держи позицию</div>
              </div>
            </div>`;
          } else {
            const gap = me.next_threshold != null ? (me.next_threshold - me.referral_count + 1) : null;
            const gapText = gap != null
              ? `Ещё ${gap} ${_gvRefWord(gap)} до места выше`
              : `${me.total_participants ? me.total_participants + " участников" : ""}`;
            const t3 = topByRank[3]?.referral_count ?? topByRank[2]?.referral_count ?? topByRank[1]?.referral_count ?? 0;
            const pct = t3 ? Math.min(100, Math.round(me.referral_count / t3 * 100)) : 0;
            meInner = `<div class="giveaway-me-card">
              <div class="giveaway-me-rank-bubble">${me.rank}</div>
              <div class="giveaway-me-body">
                <div class="giveaway-me-title">${me.rank}-е место</div>
                <div class="giveaway-me-hint">${gapText}</div>
                ${t3 ? `<div class="giveaway-me-prog-wrap">
                  <div class="giveaway-me-prog-track"><div class="giveaway-me-prog-fill" style="width:${pct}%"></div></div>
                  <div class="giveaway-me-prog-label"><span>${me.referral_count} рефер.</span><span>${t3} до топ-3</span></div>
                </div>` : ""}
              </div>
            </div>`;
          }
        } else if (me.referral_count === 0) {
          meInner = `<div class="giveaway-me-card">
            <div class="giveaway-me-rank-bubble" style="font-size:20px">🚀</div>
            <div class="giveaway-me-body">
              <div class="giveaway-me-title">Вы ещё не участвуете</div>
              <div class="giveaway-me-hint">Пригласите первого друга и попадите в таблицу</div>
            </div>
          </div>`;
        }
        meEl.innerHTML = meInner;
      }
    }

    async function _manualRefreshLeaderboard() {

    async function loadGiveaway() {
      const el = document.getElementById("giveawayContent");
      el.innerHTML = `<div class="empty skeleton" style="padding:40px 0;text-align:center"><span class="big-emoji">🎁</span><br>Загружаем…</div>`;
      try {
        const opts = { method: "POST", headers: {"Content-Type":"application/json"},
                       body: JSON.stringify({initData: currentInitData}) };
        const [gRes, rRes] = await Promise.all([
          fetch("/app/api/giveaway", opts),
          referralLoaded ? Promise.resolve(null) : fetch("/app/api/referral/info", opts),
        ]);
        if (!gRes.ok) throw new Error("api");
        giveawayData = await gRes.json();
        if (rRes && rRes.ok) {
          referralData = await rRes.json();
          referralLoaded = true;
        }
        renderGiveawayTab();
      } catch (err) {
        console.error("[giveaway] load error:", err);
        el.innerHTML = `<div class="error" style="padding:40px 16px;text-align:center"><span class="big-emoji">⚠️</span>Ошибка загрузки<br><span style="font-size:11px;opacity:0.55">${String(err)}</span></div>`;
      }
    }

    function renderGiveawayTab() {
      const el = document.getElementById("giveawayContent");
      if (!giveawayData) return;

      // ── Referrals sub-tab ──────────────────────────────────────────────
      if (giveawaySubTab === "referrals") {
        const refHtml = referralLoaded
          ? (renderReferralSection() || `<div class="empty" style="padding:32px 16px;text-align:center"><span class="big-emoji">🔗</span><br>Реферальная программа недоступна.</div>`)
          : `<div class="empty skeleton" style="padding:40px 0;text-align:center"><span class="big-emoji">🔗</span><br>Загружаем…</div>`;
        el.innerHTML = _giveawayTabBar() + refHtml;
        if (referralLoaded) attachReferralDonateHandlers();
        return;
      }

      // ── Locked state ───────────────────────────────────────────────────
      if (giveawayData.locked) {
        const opensAt = giveawayData.opens_at;
        el.innerHTML = _giveawayTabBar() + `
          <div class="giveaway-wrap">
            <div class="giveaway-locked-hero">
              <div class="giveaway-locked-body">
                <div class="giveaway-locked-badge">
                  <span class="giveaway-locked-badge-dot"></span>Скоро
                </div>
                <span class="giveaway-locked-icon">⏳</span>
                <div class="giveaway-locked-title">Розыгрыш</div>
                ${opensAt
                  ? `<div class="giveaway-locked-sub">Конкурс откроется через:</div>
                     <div id="lockedCountdown" class="giveaway-countdown"></div>`
                  : `<div class="giveaway-locked-sub">Конкурс ещё не открыт.<br>Следи за новостями!</div>`
                }
              </div>
            </div>
          </div>`;
        // Always start the countdown/polling loop when opens_at is known.
        // The loop handles clock skew by showing zeros and polling the server
        // until it confirms the giveaway is open.
        if (opensAt) _startLockedCountdown(opensAt);
        return;
      }

      const d = giveawayData;
      const prizes    = [d.prize_1,       d.prize_2,       d.prize_3];
      const prizeImgs = [d.prize_1_image, d.prize_2_image, d.prize_3_image];
      const MEDALS    = ["🥇","🥈","🥉"];
      const PCLS      = ["p1","p2","p3"];
      const PLACES    = ["1-е место","2-е место","3-е место"];
      const desc = d.description || "Пригласи больше друзей — топ-3 получат призы!";

      // Build rank→user lookup from API top array
      const topByRank = {};
      for (const r of (d.top || [])) topByRank[r.rank] = r;

      // ── Prize showcase ─────────────────────────────────────────────────
      const anyPrizeConfigured = prizes.some(Boolean) || prizeImgs.some(Boolean);

      function _prizeCard(rank) {
        const i   = rank - 1;
        const txt = prizes[i];
        const img = prizeImgs[i];
        const configured = !!(txt || img);
        let mediaHtml = "";
        if (img && img.endsWith(".tgs")) {
          mediaHtml = `<div id="gvPrizeLottie_${rank}" class="giveaway-prize-lottie"></div>`;
        } else if (img) {
          mediaHtml = `<img src="${_esc(img)}" class="giveaway-prize-img" alt="" onerror="this.style.display='none'">`;
        } else {
          mediaHtml = `<span class="giveaway-prize-empty">${txt ? "🎁" : "🔜"}</span>`;
        }
        return `<div class="giveaway-prize-card ${PCLS[i]}${configured ? "" : " prize-tba"}">
          <span class="giveaway-prize-medal">${MEDALS[i]}</span>
          ${mediaHtml}
          <div class="giveaway-prize-name">${txt ? _esc(txt) : "TBA"}</div>
          <div class="giveaway-prize-place">${PLACES[i]}</div>
        </div>`;
      }
      const prizesHtml = anyPrizeConfigured ? `<div class="giveaway-prizes">
        ${_prizeCard(1)}${_prizeCard(2)}${_prizeCard(3)}
      </div>` : "";

      // ── Visual podium (order: 2nd | 1st | 3rd) ────────────────────────
      function _podiumSlot(rank) {
        const u       = topByRank[rank];
        const isEmpty = !u;
        const avatarBg = isEmpty ? "" : `style="background:${_gvColor(u.display_name)}"`;
        const avatarTxt = isEmpty ? "?" : _gvInitials(u.display_name);
        const avatarPhoto = (!isEmpty && u.telegram_id) ? _avatarImg(`/app/api/avatar/${u.telegram_id}`) : '';
        const crownHtml = rank === 1 ? `<span class="giveaway-ps-crown">👑</span>` : "";
        const name  = isEmpty ? "Свободно"         : _esc(u.display_name);
        const count = isEmpty ? "Пригласи друзей"  : `${u.referral_count} ${_gvRefWord(u.referral_count)}`;
        const baseNum = rank === 1 ? "1" : rank === 2 ? "2" : "3";
        return `<div class="giveaway-ps-slot rank-${rank}${isEmpty?" empty":""}">
          <div class="giveaway-ps-avatar" ${avatarBg}>${crownHtml}${avatarTxt}${avatarPhoto}</div>
          <div class="giveaway-ps-name">${name}</div>
          <div class="giveaway-ps-count">${count}</div>
          <div class="giveaway-ps-base">${baseNum}</div>
        </div>`;
      }
      const podiumHtml = `<div id="giveawayPodium" class="giveaway-podium-stage">
        ${_podiumSlot(2)}${_podiumSlot(1)}${_podiumSlot(3)}
      </div>`;

      // ── My rank card ───────────────────────────────────────────────────
      let meHtml = "";
      const me = d.me || {};
      if (me.referral_count > 0 && me.rank) {
        const inTop3 = me.rank <= 3;
        if (inTop3) {
          const lbl = me.rank===1 ? "🥇 Ты лидер!" : me.rank===2 ? "🥈 2-е место" : "🥉 3-е место";
          meHtml = `<div class="giveaway-me-card">
            <div class="giveaway-me-rank-bubble">${me.rank}</div>
            <div class="giveaway-me-body">
              <div class="giveaway-me-title">${lbl} Ты в призах!</div>
              <div class="giveaway-me-hint">${me.referral_count} ${_gvRefWord(me.referral_count)} · держи позицию</div>
            </div>
          </div>`;
        } else {
          // Gap to person directly above
          const gap = me.next_threshold != null ? (me.next_threshold - me.referral_count + 1) : null;
          const gapText = gap != null
            ? `Ещё ${gap} ${_gvRefWord(gap)} до места выше`
            : `${me.total_participants ? me.total_participants + " участников" : ""}`;
          // Progress toward 3rd-place threshold
          const t3 = topByRank[3]?.referral_count ?? topByRank[2]?.referral_count ?? topByRank[1]?.referral_count ?? 0;
          const pct = t3 ? Math.min(100, Math.round(me.referral_count / t3 * 100)) : 0;
          meHtml = `<div class="giveaway-me-card">
            <div class="giveaway-me-rank-bubble">${me.rank}</div>
            <div class="giveaway-me-body">
              <div class="giveaway-me-title">${me.rank}-е место</div>
              <div class="giveaway-me-hint">${gapText}</div>
              ${t3 ? `<div class="giveaway-me-prog-wrap">
                <div class="giveaway-me-prog-track"><div class="giveaway-me-prog-fill" style="width:${pct}%"></div></div>
                <div class="giveaway-me-prog-label"><span>${me.referral_count} рефер.</span><span>${t3} до топ-3</span></div>
              </div>` : ""}
            </div>
          </div>`;
        }
      } else if (me.referral_count === 0) {
        // Zero referrals — minimal nudge card
        meHtml = `<div class="giveaway-me-card">
          <div class="giveaway-me-rank-bubble" style="font-size:20px">🚀</div>
          <div class="giveaway-me-body">
            <div class="giveaway-me-title">Вы ещё не участвуете</div>
            <div class="giveaway-me-hint">Пригласите первого друга и попадите в таблицу</div>
          </div>
        </div>`;
      }

      // Stats chips: total participants + user's own count
      const totalP = d.me?.total_participants;
      const myRef  = d.me?.referral_count ?? 0;
      const statsHtml = totalP ? `
        <div class="giveaway-stats-row">
          <div class="giveaway-stat-chip">
            <div class="giveaway-stat-val">${totalP}</div>
            <div class="giveaway-stat-lbl">Участников</div>
          </div>
          ${myRef > 0 ? `<div class="giveaway-stat-chip">
            <div class="giveaway-stat-val">${myRef}</div>
            <div class="giveaway-stat-lbl">Твоих рефералов</div>
          </div>` : ""}
        </div>` : "";

      el.innerHTML = _giveawayTabBar() + `
        <div class="giveaway-wrap">
          <div class="giveaway-hero">
            <div class="giveaway-hero-body">
              <div class="giveaway-hero-badge"><span class="giveaway-hero-badge-dot"></span>Конкурс активен</div>
              <span class="giveaway-hero-icon">🎁</span>
              <div class="giveaway-hero-title">Розыгрыш</div>
              <div class="giveaway-hero-sub">${_esc(desc)}</div>
            </div>
            <div id="giveawayCountdown" class="giveaway-countdown">
              ${d.deadline ? "" : '<div class="giveaway-cd-finished">🎊 Розыгрыш идёт!</div>'}
            </div>
          </div>
          ${prizesHtml}
          ${statsHtml}
          <div class="giveaway-divider">🏆 Таблица лидеров<button id="lbRefreshBtn" class="lb-refresh-btn" onclick="_manualRefreshLeaderboard()" title="Обновить"><span class="lb-refresh-icon">↻</span> Обновить</button></div>
          <div id="lbCacheAge" class="lb-cache-age"></div>
          ${podiumHtml}
          <div id="giveawayMeCard">${meHtml}</div>
          <button class="giveaway-invite-btn" onclick="switchGiveawaySubTab('referrals')">🎉 Пригласить друзей →</button>
        </div>`;

      if (d.deadline) _startGiveawayCountdown(d.deadline);

      // Start live leaderboard auto-refresh every 60 s
      _startGiveawayLeaderboardRefresh();
      // Stamp initial fetch time and start the age ticker
      _lbFetchTs = Date.now();
      _startLbAgeTicker();

      // Load TGS/Lottie prize animations
      _destroyGvLottie();
      prizeImgs.forEach((url, i) => {
        if (url && url.endsWith(".tgs")) _loadLottieTgs(`gvPrizeLottie_${i+1}`, url);
      });
    }

    // ── TGS / Lottie helpers ─────────────────────────────────────────────────
    const _gvLottieInstances = {};

    function _destroyGvLottie() {
      for (const inst of Object.values(_gvLottieInstances)) {
        try { inst.destroy(); } catch {}
      }
      for (const k of Object.keys(_gvLottieInstances)) delete _gvLottieInstances[k];
    }

    async function _loadLottieTgs(containerId, tgsUrl) {
      const el = document.getElementById(containerId);
      if (!el) return;
      try {
        const res = await fetch(tgsUrl);
        if (!res.ok) throw new Error("fetch");
        const ds = new DecompressionStream("gzip");
        const reader = res.body.pipeThrough(ds).getReader();
        const chunks = [];
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
        }
        const buf = new Uint8Array(chunks.reduce((s, c) => s + c.length, 0));
        let off = 0;
        for (const c of chunks) { buf.set(c, off); off += c.length; }
        const animData = JSON.parse(new TextDecoder().decode(buf));
        const inst = lottie.loadAnimation({
          container: el, renderer: "svg", loop: true, autoplay: true, animationData: animData,
        });
        _gvLottieInstances[containerId] = inst;
      } catch (e) {
        console.error("[gvLottie]", e);
        if (el) el.innerHTML = `<span style="font-size:36px;display:flex;align-items:center;justify-content:center;height:100%">🎁</span>`;
      }
    }

    async function _doPetActionInteract(petId, action, btn) {
      const origHtml = btn?.innerHTML;
      if (btn) { btn.disabled = true; btn.textContent = "⏳"; }
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
      try {
        const res = await fetch(`/app/api/pet/${action}`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData: tg ? tg.initData : currentInitData, petId }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          const MSGS = { play_cooldown: "Питомец устал 😴", cuddle_cooldown: "Слишком часто — подожди 🌸", pet_is_dead: "Питомец умер 💀" };
          toastMessage(MSGS[err.detail] || "Ошибка. Попробуй ещё раз.");
          if (btn) { btn.disabled = false; btn.innerHTML = origHtml; }
          return;
        }
        const data = await res.json();
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        const LABELS = { play: "🎮 Поиграли!", cuddle: "🤗 Обнялись!" };
        toastMessage(`${LABELS[action] || "✅ Готово!"}${data.xp_gained ? " +" + data.xp_gained + " XP" : ""}`);
        _interactCache.ts = 0; // invalidate interact cache
        _petCache.ts = 0;      // invalidate pet cache
        await renderInteractTab();
      } catch {
        toastMessage("Ошибка, попробуй снова");
        if (btn) { btn.disabled = false; btn.innerHTML = origHtml; }
      }
    }

    // ══ Settings Modal ════════════════════════════════════════════════════════
    let _settingsData = null;

    function openSettingsModal() {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
      const overlay = document.getElementById("settingsModalOverlay");
      if (!overlay) return;
      overlay.classList.add("open");
      _loadSettings();
    }

    function closeSettingsModal() {
      const overlay = document.getElementById("settingsModalOverlay");
      if (overlay) overlay.classList.remove("open");
    }

    async function _loadSettings() {
      const initData = tg ? tg.initData : currentInitData;
      const body = document.getElementById("settingsModalBody");
      if (!body) return;
      body.innerHTML = `<div class="empty" style="padding:40px 0"><span class="big-emoji">⚙️</span>Загрузка…</div>`;
      try {
        const r = await fetch("/app/api/settings?" + new URLSearchParams({ initData }));
        if (!r.ok) throw new Error(r.status);
        _settingsData = await r.json();
        _renderSettings(body);
      } catch(e) {
        body.innerHTML = `<div class="empty">Ошибка загрузки настроек</div>`;
      }
    }

    function _renderSettings(body) {
      const d = _settingsData;
      const contacts = lastStats?.top_interlocutors || [];

      // Build muted chats chips (names from top_interlocutors where possible)
      const mutedIds = d.muted_streaks || [];
      const mutedChips = mutedIds.map(cid => {
        const c = contacts.find(x => x.chat_id === cid);
        const name = c ? c.display_name : `#${cid}`;
        return `<div class="settings-chip-row" data-muted-id="${cid}">
          <span class="settings-chip-name">${esc(name)}</span>
          <button class="settings-chip-remove" onclick="unmuteChatStreak(${cid})">Включить</button>
        </div>`;
      }).join("");

      // Build exclusion chips
      const exIds = d.chat_exclusions || [];
      const exChips = exIds.map(cid => {
        const c = contacts.find(x => x.chat_id === cid);
        const name = c ? c.display_name : `#${cid}`;
        return `<div class="settings-chip-row" data-ex-id="${cid}">
          <span class="settings-chip-name">${esc(name)}</span>
          <button class="settings-chip-remove" onclick="removeExcludedChat(${cid})">Убрать</button>
        </div>`;
      }).join("");

      // Chat picker — contacts not yet excluded
      const available = contacts.filter(c => !exIds.includes(c.chat_id));
      const pickerOpts = available.map(c =>
        `<option value="${c.chat_id}">${esc(c.display_name)}</option>`
      ).join("");

      body.innerHTML = `
        <!-- ── Уведомления ── -->
        <div class="settings-section-hdr">Уведомления</div>
        <div class="settings-row">
          <div class="settings-row-left">
            <span class="settings-row-label">Стрик-уведомления</span>
            <span class="settings-row-desc">Бот пишет, когда стрик с собеседником продолжается</span>
          </div>
          <label class="s-toggle">
            <input type="checkbox" id="stg-streak-reminders" ${d.streak_reminders_enabled ? "checked" : ""}
              onchange="saveSetting('streak_reminders_enabled', this.checked)">
            <span class="s-toggle-track"></span>
          </label>
        </div>
        ${mutedIds.length ? `
        <div class="settings-section-hdr" style="margin-top:10px">Замьюченные стрики</div>
        <div class="settings-chip-list" id="mutedChipList">${mutedChips}</div>
        ` : ""}

        <!-- ── Медиа ── -->
        <div class="settings-section-hdr">Медиа</div>
        <div class="settings-row">
          <div class="settings-row-left">
            <span class="settings-row-label">Видео от собеседника без бота</span>
            <span class="settings-row-desc">Скачивать Reels/TikTok/Shorts, если у собеседника бот не подключён — только ты можешь это сделать</span>
          </div>
          <label class="s-toggle">
            <input type="checkbox" id="stg-dl-solo" ${d.dl_contact_videos ? "checked" : ""}
              onchange="saveSetting('dl_contact_videos', this.checked)">
            <span class="s-toggle-track"></span>
          </label>
        </div>
        <div class="settings-row">
          <div class="settings-row-left">
            <span class="settings-row-label">Видео от собеседника с ботом</span>
            <span class="settings-row-desc">Скачивать, если у собеседника тоже подключён бот. По умолчанию выключено — его бот сделает это сам</span>
          </div>
          <label class="s-toggle">
            <input type="checkbox" id="stg-dl-mutual" ${d.dl_contact_videos_mutual ? "checked" : ""}
              onchange="saveSetting('dl_contact_videos_mutual', this.checked)">
            <span class="s-toggle-track"></span>
          </label>
        </div>

        <!-- ── Сбор сообщений ── -->
        <div class="settings-section-hdr">Сбор сообщений</div>
        <div class="settings-row" style="flex-direction:column; align-items:flex-start; gap:0">
          <div class="settings-row-left">
            <span class="settings-row-label">Исключения</span>
            <span class="settings-row-desc">Сообщения из этих чатов не попадут в Топ, стрики и аналитику. Остальные собираются как обычно.</span>
          </div>
        </div>
        <div id="exclusionSection">
          <div class="settings-chip-list" id="exChipList">${exChips || '<div class="settings-empty-hint">Нет исключений — все чаты собираются</div>'}</div>
          ${available.length ? `
          <button class="settings-chat-select-btn" id="exPickerBtn" onclick="toggleExPicker()">
            <span>+ Добавить исключение</span><span class="s-chevron">▾</span>
          </button>
          <div class="ex-picker-panel" id="exPickerPanel">
            <div class="ex-picker-inner">
              <div class="ex-picker-search">
                <span style="color:var(--hint);font-size:14px">🔍</span>
                <input id="exPickerSearch" placeholder="Найти собеседника…" oninput="filterExPicker(this.value)">
              </div>
              <div class="ex-picker-list" id="exPickerList">
                ${available.map(c => `
                  <div class="ex-picker-item" data-chat-id="${c.chat_id}"
                       data-name="${esc(c.display_name).toLowerCase()}"
                       onclick="pickExcludedChat(${c.chat_id})">
                    <div class="ex-picker-avatar" style="background:${colorFor(c.display_name)}">${initials(c.display_name)}${_avatarImg(c.avatar_url)}</div>
                    <div style="flex:1;min-width:0">
                      <div class="ex-picker-name">${esc(c.display_name)}</div>
                      ${c.username ? `<div class="ex-picker-sub">@${esc(c.username)}</div>` : ""}
                    </div>
                    <span class="ex-picker-add">+</span>
                  </div>`).join("")}
              </div>
            </div>
          </div>
          ` : '<div class="settings-empty-hint">Все собеседники уже добавлены в исключения</div>'}</div>
      `;
    }

    async function saveSetting(key, value) {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      const initData = tg ? tg.initData : currentInitData;
      try {
        const r = await fetch("/app/api/settings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData, key, value }),
        });
        if (!r.ok) throw new Error(r.status);
        const data = await r.json();
        if (_settingsData) _settingsData[key] = data[key];
        toastMessage("Сохранено");
      } catch(e) {
        toastMessage("Ошибка сохранения");
      }
    }

    async function unmuteChatStreak(chatId) {
      const initData = tg ? tg.initData : currentInitData;
      try {
        await fetch("/app/api/contact/streak-mute", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData, chatId, muted: false }),
        });
        if (_settingsData) {
          _settingsData.muted_streaks = (_settingsData.muted_streaks || []).filter(x => x !== chatId);
        }
        const row = document.querySelector(`[data-muted-id="${chatId}"]`);
        if (row) row.remove();
        toastMessage("Уведомления включены");
      } catch(e) { toastMessage("Ошибка"); }
    }

    function toggleExPicker() {
      const panel = document.getElementById("exPickerPanel");
      const btn   = document.getElementById("exPickerBtn");
      const input = document.getElementById("exPickerSearch");
      if (!panel) return;
      const opening = !panel.classList.contains("open");
      panel.classList.toggle("open", opening);
      btn?.classList.toggle("open", opening);
      if (opening && input) { input.value = ""; filterExPicker(""); }
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }

    function filterExPicker(query) {
      const q = query.toLowerCase().trim();
      document.querySelectorAll("#exPickerList .ex-picker-item").forEach(el => {
        const name = (el.dataset.name || "").toLowerCase();
        el.style.display = (!q || name.includes(q)) ? "" : "none";
      });
    }

    async function pickExcludedChat(chatId) {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
      const exl = [...(_settingsData?.chat_exclusions || []), chatId];
      await saveSetting("chat_whitelist", exl);
      if (_settingsData) {
        _settingsData.chat_exclusions = exl;
        const body = document.getElementById("settingsModalBody");
        if (body) _renderSettings(body);
      }
    }

    async function removeExcludedChat(chatId) {
      const exl = (_settingsData?.chat_exclusions || []).filter(x => x !== chatId);
      await saveSetting("chat_whitelist", exl);
      if (_settingsData) {
        _settingsData.chat_exclusions = exl;
        const body = document.getElementById("settingsModalBody");
        if (body) _renderSettings(body);
      }
    }

    document.getElementById("openSettingsBtn")?.addEventListener("click", openSettingsModal);

  </script>

  <!-- ══ Settings Modal HTML ══════════════════════════════════════════════ -->
  <div class="settings-modal-overlay" id="settingsModalOverlay"
       onclick="if(event.target===this) closeSettingsModal()">
    <div class="settings-modal">
      <div class="settings-modal-handle"></div>
      <div class="settings-modal-header">
        <span class="settings-modal-title">⚙️ Настройки</span>
        <button class="settings-modal-close" onclick="closeSettingsModal()">×</button>
      </div>
      <div class="settings-modal-body" id="settingsModalBody"></div>
    </div>
  </div>

</body>
