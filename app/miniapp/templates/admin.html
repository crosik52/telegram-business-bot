    async function openChatsSheet(user) {
      currentSheetUser = user;
      const overlay  = document.getElementById("sheetOverlay");
      const sheet    = document.getElementById("chatsSheet");
      const title    = document.getElementById("sheetTitle");
      const subtitle = document.getElementById("sheetSubtitle");
      const body     = document.getElementById("sheetBody");

      title.textContent    = displayName(user);
      subtitle.textContent = "Загружаем чаты…";
      body.innerHTML = "";
      overlay.classList.add("show");
      sheet.classList.add("show");

      try {
        const res = await fetch("/app/api/admin/user_stats", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData, ownerTelegramId: user.owner_telegram_id})
        });
        if (!res.ok) throw new Error();
        const data = await res.json();
        subtitle.textContent = `${data.total_chats} чатов · ${data.total_messages} сообщений`;

        let allChats = data.chats;
        const renderChatList = (filter) => {
          const filtered = filter
            ? allChats.filter(c => (c.chat_name||"").toLowerCase().includes(filter) || String(c.chat_id).includes(filter))
            : allChats;
          const listHtml = filtered.length
            ? filtered.map(renderChat).join("")
            : `<div class="empty"><span class="big-emoji">🔎</span>Чатов не найдено.</div>`;
          document.getElementById("chatListBody").innerHTML = listHtml;
          document.querySelectorAll(".chat-card").forEach(card => {
            card.addEventListener("click", () => openChatMessages(user, Number(card.dataset.chatId), card.dataset.chatName));
          });
        };

        body.innerHTML = `
          <div class="search-box" style="margin-bottom:10px">
            <span>🔍</span>
            <input id="chatFilterInput" type="text" placeholder="Фильтр по чату…" />
          </div>
          <div id="chatListBody"></div>`;
        renderChatList("");
        let _chatFilterTimer;
        document.getElementById("chatFilterInput").addEventListener("input", e => {
          clearTimeout(_chatFilterTimer);
          _chatFilterTimer = setTimeout(() => renderChatList(e.target.value.trim().toLowerCase()), 250);
        });
      } catch {
        subtitle.textContent = "Ошибка";
        body.innerHTML = `<div class="error"><span class="big-emoji">⚠️</span>Не удалось загрузить чаты.</div>`;
      }
    }

    function renderMessage(m) {
      const sender = esc(
        [m.sender_first_name, m.sender_last_name].filter(Boolean).join(" ")
        || (m.sender_username ? "@" + m.sender_username : "ID " + m.sender_telegram_id)
      );
      const rawText = m.text || m.caption || (m.media_type && m.media_type !== "text" ? `[${m.media_type}]` : "(без текста)");
      const flags = [
        m.is_edited  ? `<span class="m-flag edited">✏️ ред. ${esc(m.edit_count)}</span>` : "",
        m.is_deleted ? `<span class="m-flag deleted">🗑 удалено</span>` : "",
      ].join("");
      return `
        <div class="message-item">
          <div class="message-top">
            <span>${sender}</span>
            <span class="message-time">${esc(fmtDate(m.sent_at))}</span>
          </div>
          <div class="message-text">${esc(rawText)}</div>
          ${flags ? `<div class="message-flags">${flags}</div>` : ""}
        </div>
      `;

    async function openChatMessages(user, chatId, chatName, page, textQuery) {
      currentChatId = chatId;
      messagesPage  = page || 1;
      const tq = textQuery || "";
      const title    = document.getElementById("sheetTitle");
      const subtitle = document.getElementById("sheetSubtitle");
      const body     = document.getElementById("sheetBody");

      title.textContent    = chatName;
      subtitle.textContent = "Загружаем…";
      body.innerHTML = `<a class="back-link" id="backToChats">← Чаты</a>`;

      try {
        const res = await fetch("/app/api/admin/messages", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData, ownerTelegramId: user.owner_telegram_id, chatId, page: messagesPage, textQuery: tq || null})
        });
        if (!res.ok) throw new Error();
        const data = await res.json();
        subtitle.textContent = `${data.total} сообщений`;
        const totalPages = Math.max(1, Math.ceil(data.total / data.page_size));
        const listHtml = data.messages.length
          ? data.messages.map(renderMessage).join("")
          : `<div class="empty"><span class="big-emoji">💬</span>Сообщений нет.</div>`;
        const searchBox = `
          <div class="search-box" style="margin:8px 0 12px">
            <span>🔍</span>
            <input id="chatMsgSearch" type="text" placeholder="Поиск в чате…" value="${esc(tq)}" />
          </div>`;
        body.innerHTML = `<a class="back-link" id="backToChats">← Чаты</a>${searchBox}${listHtml}` + renderPager(data.page, totalPages, "messages");
        document.getElementById("backToChats").addEventListener("click", () => openChatsSheet(user));
        document.querySelectorAll("[data-pager='messages']").forEach(btn => {
          btn.addEventListener("click", () => openChatMessages(user, chatId, chatName, Number(btn.dataset.page), tq));
        });
        let _msgSearchTimer;
        const msgSearchInput = document.getElementById("chatMsgSearch");
        if (msgSearchInput) {
          msgSearchInput.addEventListener("input", () => {
            clearTimeout(_msgSearchTimer);
            _msgSearchTimer = setTimeout(() => openChatMessages(user, chatId, chatName, 1, msgSearchInput.value.trim()), 400);
          });
        }
      } catch {
        subtitle.textContent = "Ошибка";
        body.innerHTML = `<a class="back-link" id="backToChats">← Чаты</a><div class="error"><span class="big-emoji">⚠️</span>Не удалось загрузить сообщения.</div>`;
        document.getElementById("backToChats").addEventListener("click", () => openChatsSheet(user));
      }
    }

        </div>`;
      let _timer;

    async function runGlobalMsgSearch(query) {
      const resultsDiv = document.getElementById("globalMsgSearchResults");
      if (!resultsDiv) return;
      if (query.length < 2) {
        resultsDiv.innerHTML = `<div class="empty"><span class="big-emoji">💬</span>Введите минимум 2 символа.</div>`;
        return;
      }
      resultsDiv.innerHTML = `<div class="empty"><span class="big-emoji">⏳</span>Ищем…</div>`;
      try {
        const res = await fetch("/app/api/admin/search_chats", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData, query})
        });
        if (!res.ok) throw new Error();
        const data = await res.json();
        if (!data.results.length) {
          resultsDiv.innerHTML = `<div class="empty"><span class="big-emoji">🔎</span>Ничего не найдено по запросу «${esc(query)}».</div>`;
          return;
        }
        resultsDiv.innerHTML =
          `<div class="section-title">${data.results.length} чатов с совпадениями</div>` +
          `<div class="list">${data.results.map(r => renderSearchChatResult(r, query)).join("")}</div>`;
        document.querySelectorAll(".search-chat-result").forEach(card => {
          card.addEventListener("click", () => {
            const ownerTgId  = Number(card.dataset.ownerTelegramId);
            const chatId     = Number(card.dataset.chatId);
            const chatName   = card.dataset.chatName;
            const q          = card.dataset.query;
            const user = overview.users.find(u => u.owner_telegram_id === ownerTgId)
                      || {owner_telegram_id: ownerTgId};
            openChatsSheet(user);
            setTimeout(() => openChatMessages(user, chatId, chatName, 1, q), 600);
          });
        });
      } catch {
        resultsDiv.innerHTML = `<div class="error"><span class="big-emoji">⚠️</span>Ошибка поиска. Попробуйте ещё раз.</div>`;
      }
    }

      const snippet = r.latest_text || r.latest_caption || "";
      const ownerLabel = r.owner_username ? `@${r.owner_username}` : `ID ${r.owner_telegram_id}`;
      return `
        <div class="user-card search-chat-result" style="cursor:pointer"
             data-owner-telegram-id="${r.owner_telegram_id}"
             data-chat-id="${r.chat_id}"
             data-chat-name="${esc(name)}"

    /* ── Toggle settings ── */
    async function onToggle(btn) {
      const card = btn.closest(".user-card");
      const ownerTelegramId = Number(card.dataset.owner);
      const action = btn.dataset.action;
      const value  = btn.dataset.value === "true";

      if (action === "block" && value) {
        const confirmed = await confirmAction("Заблокировать пользователя?\nОн перестанет получать уведомления и не будет виден в статистике.");
        if (!confirmed) return;
      }

      card.querySelectorAll(".action-btn").forEach(b => b.disabled = true);
      const body = { initData, ownerTelegramId };
      if (action === "notifications") body.notificationsEnabled = value;
      if (action === "block") body.isBlocked = value;

      try {
        const res = await fetch("/app/api/admin/settings", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error();
        const user = overview.users.find(u => u.owner_telegram_id === ownerTelegramId);
        if (user) {
          if (action === "notifications") user.notifications_enabled = value;
          if (action === "block") user.is_blocked = value;
        }
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        showToast(
          action === "block"
            ? (value ? "🚫 Пользователь заблокирован" : "✅ Пользователь разблокирован")
            : (value ? "🔔 Уведомления включены" : "🔕 Уведомления отключены")
        );
        render();
      } catch {
        card.querySelectorAll(".action-btn").forEach(b => b.disabled = false);
        if (tg) tg.showAlert("Не удалось сохранить. Попробуй ещё раз.");
      }
    }

    async function downloadInfographic(btn) {
      const orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = "⏳ Генерация…";
      try {
        const resp = await fetch("/app/api/admin/infographic", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ init_data: initData }),
        });
        if (!resp.ok) throw new Error(await resp.text());
        const blob = await resp.blob();
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href     = url;
        const ts   = new Date().toISOString().slice(0, 16).replace("T", "_").replace(":", "-");
        a.download = `bot_stats_${ts}.png`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
        showToast("📊 Инфографика загружена!");
      } catch (e) {
        showToast("❌ Не удалось сгенерировать: " + e.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = orig;
      }
    }

      const statusBadge = `<span style="${STATUS_STYLE[st]};font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;vertical-align:middle">${STATUS_LABEL[st] || st}</span>`;

      // secondary line: @username if different from display name, then ID
      const subLine = [
        s.username && s.full_name ? `@${esc(s.username)}` : null,
        `ID ${s.user_telegram_id}`,
        s.stars_paid > 0 ? `${s.stars_paid}⭐` : null,
      ].filter(Boolean).join(" · ");

      const expLine = st === "active"
        ? `Ещё ${s.days_left} дн. · до ${s.expires_at.slice(0,10)}`
        : `Истекла ${s.expires_at.slice(0,10)}`;

      const actionBtn = st === "active"
        ? `<button class="sub-revoke-btn" data-user-id="${s.user_telegram_id}" data-name="${esc(name)}">✗ Отозвать</button>`
        : `<button class="sub-grant-btn" style="padding:6px 11px;font-size:12px" data-grant-id="${s.user_telegram_id}" data-name="${esc(name)}" data-sub-type="${s.sub_type||'premium'}">↩ Вернуть</button>`;

      return `
        <div class="sub-subscriber-card">
          <div class="sub-sub-avatar" style="background:${avatarBg}">${esc(avatarLetter)}</div>
          <div class="sub-sub-info">
            <div class="sub-sub-name">${esc(name)} ${tierBadge} ${grantBadge} ${statusBadge}</div>
            <div class="sub-sub-id">${subLine}</div>
            <div class="sub-sub-meta">${expLine}</div>
          </div>
          ${actionBtn}
        </div>`;
    }

    // ── Collect current benefits from DOM ────────────────────────────────────
    function collectBenefits() {
      const rows = document.querySelectorAll(".dyn-benefit-row");
      const result = {};
      rows.forEach(row => {
        const key = row.dataset.key;
        if (!key) return;
        const meta = BENEFIT_META[key] || {};
        const inputEl = row.querySelector(".ben-val");
        if (!inputEl) return;
        if (inputEl.type === "checkbox") {
          result[key] = inputEl.checked;
        } else {
          const raw = inputEl.value;
          result[key] = parseFloat(raw);
          if (isNaN(result[key])) result[key] = parseInt(raw) || 0;
        }
      });
      return result;
    }

    // ── Refresh quick-add chips after add/delete ──────────────────────────────
    function refreshQuickAdd() {
      const existing = [...document.querySelectorAll(".dyn-benefit-row")].map(r => r.dataset.key);
      const unset = Object.keys(BENEFIT_META).filter(k => !existing.includes(k));
      const wrap = document.querySelector(".quickadd-wrap");
      if (!wrap) return;
      if (!unset.length) { wrap.style.display = "none"; return; }
      wrap.style.display = "";
      wrap.querySelector(".quickadd-chips").innerHTML = unset.map(k =>
        `<button class="quickadd-chip" data-key="${k}">${BENEFIT_META[k].label}</button>`
      ).join("");
      wrap.querySelectorAll(".quickadd-chip").forEach(chip => {
        chip.addEventListener("click", () => addBenefitRow(chip.dataset.key, BENEFIT_META[chip.dataset.key]?.type === "bool" ? false : 0));
      });
    }

    function addBenefitRow(key, defaultVal) {
      const container = document.getElementById("dynBenefits");
      // Remove "no benefits" placeholder if present
      const ph = container.querySelector("div[style*='text-align:center']");
      if (ph) ph.remove();
      // Check if key already exists
      if (container.querySelector(`.dyn-benefit-row[data-key="${key}"]`)) {
        showToast(`⚠️ "${key}" уже добавлен`);
        return;
      }
      const tmp = document.createElement("div");
      tmp.innerHTML = renderBenefitRow(key, defaultVal);
      const row = tmp.firstElementChild;
      row.querySelector(".dyn-del-btn").addEventListener("click", () => {
        row.remove();
        refreshQuickAdd();
      });
      container.appendChild(row);
      refreshQuickAdd();
    }

    // ── Subscriber list state ─────────────────────────────────────────────────
    let _subStatusFilter = "";
    let _subPage = 1;
    let _subTotalPages = 1;

    function attachSubscriptionTabHandlers() {
      // Delete existing benefit rows
      document.querySelectorAll(".dyn-benefit-row .dyn-del-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.currentTarget.closest(".dyn-benefit-row").remove();
          refreshQuickAdd();
        });
      });

      // Quick-add chips
      document.querySelectorAll(".quickadd-chip").forEach(chip => {
        chip.addEventListener("click", () => {
          const key = chip.dataset.key;
          const meta = BENEFIT_META[key] || {};
          addBenefitRow(key, meta.type === "bool" ? false : 0);
        });
      });

      // Show/hide custom add form
      document.getElementById("showCustomBenBtn")?.addEventListener("click", () => {
        const form = document.getElementById("customBenForm");
        form.style.display = form.style.display === "none" ? "" : "none";
      });

      // Add custom benefit
      document.getElementById("addCustomBenBtn")?.addEventListener("click", () => {
        const keyEl = document.getElementById("customBenKey");
        const valEl = document.getElementById("customBenVal");
        const key = keyEl.value.trim().replace(/\s+/g, "_");
        if (!key) { showToast("⚠️ Введи ключ"); return; }
        let val = valEl.value.trim();
        if (val === "true")  val = true;
        else if (val === "false") val = false;
        else { const n = parseFloat(val); val = isNaN(n) ? val : n; }
        addBenefitRow(key, val);
        keyEl.value = ""; valEl.value = "";
        document.getElementById("customBenForm").style.display = "none";
      });

      // Save config
      document.getElementById("subSaveBtn")?.addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        btn.textContent = "Сохраняем…";
        try {
          const res = await fetch("/app/api/admin/subscription/update", {
            method: "POST", headers: {"Content-Type":"application/json"},
            body: JSON.stringify({
              initData,
              isEnabled:    document.getElementById("subEnabled").checked,
              priceStars:   parseInt(document.getElementById("subPrice").value),
              durationDays: parseInt(document.getElementById("subDuration").value),
              title:        document.getElementById("subTitle").value.trim(),
              description:  document.getElementById("subDesc").value.trim(),
              benefits:     collectBenefits(),
            }),
          });
          if (!res.ok) throw new Error();
          subConfig = await res.json();
          showToast("✅ Настройки подписки сохранены");
        } catch {
          showToast("❌ Ошибка при сохранении");
        } finally {
          btn.disabled = false;
          btn.textContent = "💾 Сохранить настройки подписки";
        }
      });

      // Grant subscription (form)
      document.getElementById("subGrantBtn")?.addEventListener("click", async (e) => {
        const btn     = e.currentTarget;
        const userId  = parseInt(document.getElementById("grantUserId").value);
        const days    = parseInt(document.getElementById("grantDays").value) || 30;
        const subType = document.getElementById("grantSubType")?.value || "premium";
        if (!userId) { showToast("⚠️ Введи Telegram ID"); return; }
        btn.disabled = true;
        try {
          const res = await fetch("/app/api/admin/subscription/grant", {
            method: "POST", headers: {"Content-Type":"application/json"},
            body: JSON.stringify({initData, ownerTelegramId: userId, durationDays: days, subType}),
          });
          if (!res.ok) throw new Error();
          const tier = subType === "vip" ? "💎 VIP" : "⭐ Premium";
          showToast(`✅ ${tier} выдан пользователю ${userId} на ${days} дн.`);
          document.getElementById("grantUserId").value = "";
          _subPage = 1;
          await reloadSubscriberList();
        } catch {
          showToast("❌ Ошибка при выдаче подписки");
          btn.disabled = false;
        }
      });

      // Status filter chips
      document.querySelectorAll(".sub-filter-chip").forEach(chip => {
        chip.addEventListener("click", () => {
          document.querySelectorAll(".sub-filter-chip").forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          _subStatusFilter = chip.dataset.sf;
          _subPage = 1;
          reloadSubscriberList();
        });
      });

      // Pagination
      document.getElementById("subPrevBtn")?.addEventListener("click", () => {
        if (_subPage > 1) { _subPage--; reloadSubscriberList(); }
      });
      document.getElementById("subNextBtn")?.addEventListener("click", () => {
        if (_subPage < _subTotalPages) { _subPage++; reloadSubscriberList(); }
      });

      // Attach action buttons in the initial render
      _attachSubListActions();
    }

    // ── Attach revoke/grant buttons in the subscriber list ────────────────────
    function _attachSubListActions() {
      // Revoke buttons (active → cancel)
      document.querySelectorAll(".sub-revoke-btn").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const b      = e.currentTarget;
          const userId = parseInt(b.dataset.userId);
          const name   = b.dataset.name || String(userId);
          const ok     = await confirmAction(`Отозвать подписку у ${name}?`);
          if (!ok) return;
          b.disabled = true;
          try {
            const res = await fetch("/app/api/admin/subscription/revoke", {
              method: "POST", headers: {"Content-Type":"application/json"},
              body: JSON.stringify({initData, ownerTelegramId: userId}),
            });
            if (!res.ok) throw new Error();
            showToast(`✅ Подписка отозвана у ${name}`);
            await reloadSubscriberList();
          } catch {
            showToast("❌ Ошибка при отзыве");
            b.disabled = false;
          }
        });
      });

      // Restore buttons (cancelled → grant again)
      document.querySelectorAll("[data-grant-id]").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const b       = e.currentTarget;
          const userId  = parseInt(b.dataset.grantId);
          const name    = b.dataset.name || String(userId);
          const subType = b.dataset.subType || document.getElementById("grantSubType")?.value || "premium";
          const days    = parseInt(document.getElementById("grantDays")?.value) || (subConfig?.duration_days || 30);
          const tier    = subType === "vip" ? "💎 VIP" : "⭐ Premium";
          const ok      = await confirmAction(`Вернуть ${tier} для ${name} на ${days} дн.?`);
          if (!ok) return;
          b.disabled = true;
          try {
            const res = await fetch("/app/api/admin/subscription/grant", {
              method: "POST", headers: {"Content-Type":"application/json"},
              body: JSON.stringify({initData, ownerTelegramId: userId, durationDays: days, subType}),
            });
            if (!res.ok) throw new Error();
            showToast(`✅ ${tier} возвращён ${name}`);
            await reloadSubscriberList();
          } catch {
            showToast("❌ Ошибка");
            b.disabled = false;
          }
        });
      });
    }

    async function reloadSubscriberList() {
      const listEl = document.getElementById("subSubscriberList");
      if (listEl) listEl.innerHTML = `<div style="text-align:center;color:var(--hint);padding:14px 0">Загружаем…</div>`;
      try {
        const res = await fetch("/app/api/admin/subscription/subscribers", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData, page: _subPage, statusFilter: _subStatusFilter || null}),
        });
        const data = res.ok ? await res.json() : {total: 0, page: 1, page_size: 25, subscribers: []};

        // Update count label
        const lbl = document.getElementById("subTotalLabel");
        if (lbl) lbl.textContent = `(${data.total})`;

        // Pagination state
        const pageSize = data.page_size || 25;
        _subTotalPages = Math.max(1, Math.ceil(data.total / pageSize));
        const pager    = document.getElementById("subPager");
        const prevBtn  = document.getElementById("subPrevBtn");
        const nextBtn  = document.getElementById("subNextBtn");
        const pageLbl  = document.getElementById("subPageLabel");
        if (pager) pager.style.display = _subTotalPages > 1 ? "flex" : "none";
        if (prevBtn)  prevBtn.disabled  = _subPage <= 1;
        if (nextBtn)  nextBtn.disabled  = _subPage >= _subTotalPages;
        if (pageLbl)  pageLbl.textContent = `${_subPage} / ${_subTotalPages}`;

        if (listEl) {
          listEl.innerHTML = data.subscribers.length === 0
            ? `<div style="text-align:center;color:var(--hint);padding:20px 0">Нет подписок</div>`
            : data.subscribers.map(s => renderSubscriberCard(s)).join("");
          _attachSubListActions();
        }
      } catch {
        if (listEl) listEl.innerHTML = `<div style="text-align:center;color:var(--danger);padding:14px 0">Ошибка загрузки</div>`;
      }
    }

        : `<div style="color:var(--hint);font-size:13px;padding:10px 0">Нет данных</div>`;

      // ── Milestone editor ──────────────────────────────────────────
      const msHtml = (cfg.milestones || []).map((m, i) => `
        <div class="dyn-benefit-row" data-ms-idx="${i}" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px">

          <select class="ms-type" style="flex:1;min-width:100px;border:1.5px solid rgba(120,120,128,0.2);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--bg);color:var(--text)">
            <option value="premium_days" ${m.type==="premium_days"?"selected":""}>⭐ Дни Premium</option>
            <option value="badge"        ${m.type==="badge"?"selected":""}>🏅 Значок</option>
          </select>
          <input type="text" class="ms-value" value="${esc(String(m.value))}" style="width:70px;border:1.5px solid rgba(120,120,128,0.2);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--bg);color:var(--text)" placeholder="Значение"/>
          <input type="text" class="ms-label" value="${esc(m.label)}" style="flex:2;min-width:120px;border:1.5px solid rgba(120,120,128,0.2);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--bg);color:var(--text)" placeholder="Описание"/>
          <button class="dyn-del-btn" onclick="this.closest('[data-ms-idx]').remove()" title="Удалить">✕</button>
        </div>`).join("");

      content.innerHTML = `
        <!-- Stats overview -->
        <div class="cards">
          <div class="card" style="background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff">
            <span class="c-icon">🔗</span><div class="c-val">${d.total}</div><div class="c-lbl" style="color:rgba(255,255,255,0.75)">Всего</div>
          </div>
          <div class="card">
            <span class="c-icon">✅</span><div class="c-val" style="color:var(--green)">${d.active}</div><div class="c-lbl">Активных</div>
          </div>
          <div class="card">
            <span class="c-icon">⏳</span><div class="c-val" style="color:var(--hint)">${d.pending}</div><div class="c-lbl">Ожидают</div>
          </div>
          <div class="card">
            <span class="c-icon">🚨</span><div class="c-val" style="color:var(--danger)">${d.fraud}</div><div class="c-lbl">Фрод</div>
          </div>
        </div>

        <!-- Sparkline -->
        <div class="card" style="margin-bottom:12px">
          <div style="font-size:13px;font-weight:700;margin-bottom:10px">📅 Рефералы за 7 дней · конверсия ${d.activation_rate}%</div>
          <div style="display:flex;align-items:flex-end;gap:4px;height:48px">${sparkBars}</div>
        </div>

        <!-- Top referrers -->
        <div class="card" style="margin-bottom:12px">
          <div style="font-size:13px;font-weight:700;margin-bottom:10px">🏆 Топ рефоводов</div>
          ${topHtml}
        </div>

        <!-- Manual grant -->
        <div class="card" style="margin-bottom:12px">
          <div style="font-size:13px;font-weight:700;margin-bottom:10px">🎁 Начислить бонус вручную</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <input id="ref-grant-uid"   type="number" placeholder="Telegram ID пользователя" style="border:1.5px solid rgba(120,120,128,0.2);border-radius:10px;padding:8px 12px;font-size:13px;background:var(--bg);color:var(--text);width:100%"/>
            <div style="display:flex;gap:8px">
              <select id="ref-grant-type" style="flex:1;border:1.5px solid rgba(120,120,128,0.2);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--bg);color:var(--text)">
                <option value="premium_days">⭐ Дни Premium</option>
                <option value="badge">🏅 Значок</option>
              </select>
              <input id="ref-grant-val" type="text" placeholder="Значение (дни или slug)" style="flex:1;border:1.5px solid rgba(120,120,128,0.2);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--bg);color:var(--text)"/>
            </div>
            <input id="ref-grant-label" type="text" placeholder="Комментарий (необязательно)" style="border:1.5px solid rgba(120,120,128,0.2);border-radius:10px;padding:8px 12px;font-size:13px;background:var(--bg);color:var(--text);width:100%"/>
            <button id="ref-grant-btn" class="action-btn" style="background:var(--green);color:#fff;font-size:13px;padding:9px;border-radius:10px;width:100%;font-weight:700">🎁 Начислить</button>
          </div>
        </div>

        <!-- Referral list -->
        <div class="card" style="margin-bottom:12px">
          <div style="font-size:13px;font-weight:700;margin-bottom:10px">📋 Список рефералов</div>
          <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
            <select id="ref-list-status" style="flex:1;min-width:100px;border:1.5px solid rgba(120,120,128,0.2);border-radius:10px;padding:7px 10px;font-size:12px;background:var(--bg);color:var(--text)">
              <option value="">Все статусы</option>
              <option value="active">Активные</option>
              <option value="pending">Ожидают</option>
              <option value="fraud">Фрод</option>
            </select>
            <input id="ref-list-search" type="number" placeholder="Telegram ID" style="flex:1;min-width:100px;border:1.5px solid rgba(120,120,128,0.2);border-radius:10px;padding:7px 10px;font-size:12px;background:var(--bg);color:var(--text)"/>
            <button id="ref-list-search-btn" class="action-btn" style="font-size:12px;padding:7px 14px">🔍 Найти</button>
          </div>
          <div id="ref-list-container" style="min-height:40px">
            <div style="color:var(--hint);font-size:13px;text-align:center">Нажмите «Найти» для загрузки</div>
          </div>
          <div id="ref-list-pagination" style="display:flex;gap:8px;margin-top:10px;justify-content:center"></div>
        </div>

        <!-- Config card -->
        <div class="card" style="margin-bottom:12px" id="ref-cfg-card">
          <div style="font-size:13px;font-weight:700;margin-bottom:12px">⚙️ Настройки программы</div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <span style="font-size:13px;font-weight:600">Программа включена</span>
            <input type="checkbox" id="ref-cfg-enabled" ${cfg.is_enabled ? "checked" : ""} style="width:20px;height:20px"/>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
            <div>
              <div style="font-size:11px;color:var(--hint);margin-bottom:4px">⭐ Пригласивший получает (дней)</div>
              <input type="number" id="ref-cfg-ref-days" value="${cfg.referrer_reward_days}" min="0" style="width:100%;border:1.5px solid rgba(120,120,128,0.2);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--bg);color:var(--text)"/>
            </div>
            <div>
              <div style="font-size:11px;color:var(--hint);margin-bottom:4px">🎁 Новый пользователь получает (дней)</div>
              <input type="number" id="ref-cfg-new-days" value="${cfg.referee_reward_days}" min="0" style="width:100%;border:1.5px solid rgba(120,120,128,0.2);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--bg);color:var(--text)"/>
            </div>
            <div>
              <div style="font-size:11px;color:var(--hint);margin-bottom:4px">🛡 Мин. возраст аккаунта (дней)</div>
              <input type="number" id="ref-cfg-min-age" value="${cfg.min_account_age_days}" min="0" style="width:100%;border:1.5px solid rgba(120,120,128,0.2);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--bg);color:var(--text)"/>
            </div>
            <div>
              <div style="font-size:11px;color:var(--hint);margin-bottom:4px">🚫 Макс. рефералов в день</div>
              <input type="number" id="ref-cfg-max-day" value="${cfg.max_referrals_per_day}" min="1" style="width:100%;border:1.5px solid rgba(120,120,128,0.2);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--bg);color:var(--text)"/>
            </div>
          </div>

          <div style="font-size:12px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Этапы наград</div>
          <div id="ref-ms-list">${msHtml}</div>
          <button id="ref-ms-add" style="width:100%;border:1.5px dashed rgba(120,120,128,0.3);border-radius:10px;padding:8px;font-size:12px;color:var(--hint);background:none;margin:6px 0 12px;touch-action:manipulation">+ Добавить этап</button>

          <button id="ref-cfg-save" class="action-btn" style="width:100%;background:var(--link);color:#fff;font-size:13px;padding:11px;border-radius:12px;font-weight:700">💾 Сохранить настройки</button>
        </div>
      `;

      // ── Attach handlers ───────────────────────────────────────────
      attachReferralAdminHandlers();
    }

    function attachReferralAdminHandlers() {
      // Manual grant
      document.getElementById("ref-grant-btn")?.addEventListener("click", async () => {
        const uid   = parseInt(document.getElementById("ref-grant-uid").value);
        const type  = document.getElementById("ref-grant-type").value;
        const val   = document.getElementById("ref-grant-val").value.trim();
        const label = document.getElementById("ref-grant-label").value.trim();
        if (!uid || !val) { showToast("❌ Заполните ID и значение"); return; }
        try {
          const res = await fetch("/app/api/admin/referral/grant", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ initData, userTelegramId: uid, rewardType: type, rewardValue: val, label }),
          });
          if (!res.ok) throw new Error();
          showToast("✅ Бонус начислен");
        } catch { showToast("❌ Ошибка начисления"); }
      });

      // List search
      async function loadRefList(page = 1) {
        const status   = document.getElementById("ref-list-status").value;
        const searchId = parseInt(document.getElementById("ref-list-search").value) || null;
        const container = document.getElementById("ref-list-container");
        container.innerHTML = `<div style="color:var(--hint);text-align:center;font-size:12px">Загрузка…</div>`;
        try {
          const res = await fetch("/app/api/admin/referral/list", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ initData, page, status: status || null, searchId }),
          });
          if (!res.ok) throw new Error();
          const data = await res.json();
          if (!data.referrals.length) {
            container.innerHTML = `<div style="color:var(--hint);text-align:center;font-size:13px;padding:10px 0">Ничего не найдено</div>`;
          } else {
            const STATUS_LABELS = { active: "✅ Активен", pending: "⏳ Ожидает", fraud: "🚨 Фрод" };
            const STATUS_COLORS = { active: "var(--green)", pending: "var(--hint)", fraud: "var(--danger)" };
            container.innerHTML = data.referrals.map(r => `
              <div class="sub-sub-row" style="gap:10px;flex-wrap:wrap;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(120,120,128,0.1)">
                <div style="flex:1;min-width:0">
                  <div style="font-size:12px;font-weight:700">
                    🔗 <span style="opacity:0.55">${esc(String(r.referrer_telegram_id))}</span>
                    → 
                    ${r.referred_first_name ? esc(r.referred_first_name) : ""}${r.referred_username ? ` <span style="color:var(--hint)">@${esc(r.referred_username)}</span>` : ""}
                    <span style="font-size:10px;color:var(--hint);font-weight:400">#${esc(String(r.referred_telegram_id))}</span>
                  </div>
                  <div style="font-size:11px;color:${STATUS_COLORS[r.status] || "var(--hint)"}">
                    ${STATUS_LABELS[r.status] || r.status}
                    ${r.fraud_reason ? ` · ${esc(r.fraud_reason)}` : ""}
                  </div>
                  <div style="font-size:10px;color:var(--hint)">${r.created_at.slice(0,10)}${r.activated_at ? ` · активирован ${r.activated_at.slice(0,10)}` : ""}</div>
                </div>
                <div style="display:flex;gap:6px;flex-shrink:0;align-items:center">
                  ${r.status !== "active"  ? `<button class="action-btn ref-adj-btn" data-id="${r.id}" data-status="active"  style="font-size:11px;padding:5px 8px">✅</button>` : ""}
                  ${r.status !== "pending" ? `<button class="action-btn ref-adj-btn" data-id="${r.id}" data-status="pending" style="font-size:11px;padding:5px 8px;background:rgba(120,120,128,0.12);color:var(--hint)">⏳</button>` : ""}
                  ${r.status !== "fraud"   ? `<button class="action-btn ref-adj-btn" data-id="${r.id}" data-status="fraud"   style="font-size:11px;padding:5px 8px;background:rgba(255,59,48,0.12);color:var(--danger)">🚨</button>` : ""}
                </div>
              </div>`).join("");
            // Pagination
            const pages = Math.ceil(data.total / data.page_size);
            const pag   = document.getElementById("ref-list-pagination");
            pag.innerHTML = pages > 1
              ? Array.from({ length: Math.min(pages, 10) }, (_, i) => i + 1).map(p =>
                  `<button class="tab-chip${p === page ? " active" : ""}" data-ref-page="${p}" style="padding:4px 10px;font-size:11px">${p}</button>`
                ).join("")
              : "";
            pag.querySelectorAll("[data-ref-page]").forEach(btn =>
              btn.addEventListener("click", () => loadRefList(parseInt(btn.dataset.refPage)))
            );
          }
          // Status-adjust buttons
          container.querySelectorAll(".ref-adj-btn").forEach(btn =>
            btn.addEventListener("click", async () => {
              const id     = parseInt(btn.dataset.id);
              const status = btn.dataset.status;
              const reason = status === "fraud" ? (prompt("Причина фрода (необязательно):") || "") : "";
              try {
                const r2 = await fetch("/app/api/admin/referral/adjust", {
                  method: "POST", headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ initData, referralId: id, status, reason }),
                });
                if (!r2.ok) throw new Error();
                showToast("✅ Статус изменён");
                loadRefList(page);
              } catch { showToast("❌ Ошибка"); }
            })
          );
        } catch { container.innerHTML = `<div style="color:var(--hint);text-align:center">Ошибка загрузки</div>`; }
      }

      document.getElementById("ref-list-search-btn")?.addEventListener("click", () => loadRefList(1));

      // Top-referrer manual grant shortcut
      window.adminRefGrant = function(uid) {
        document.getElementById("ref-grant-uid").value = uid;
        document.getElementById("ref-grant-uid").scrollIntoView({ behavior: "smooth", block: "center" });
      };

      // Milestone add
      document.getElementById("ref-ms-add")?.addEventListener("click", () => {
        const list = document.getElementById("ref-ms-list");
        const idx  = list.querySelectorAll("[data-ms-idx]").length;
        const div  = document.createElement("div");
        div.className = "dyn-benefit-row";
        div.dataset.msIdx = idx;
        div.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px";
        div.innerHTML = `
          <input type="number" class="ms-count" value="1" min="1" style="width:60px;border:1.5px solid rgba(120,120,128,0.2);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--bg);color:var(--text)" placeholder="#"/>
          <select class="ms-type" style="flex:1;min-width:100px;border:1.5px solid rgba(120,120,128,0.2);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--bg);color:var(--text)">
            <option value="premium_days">⭐ Дни Premium</option>
            <option value="badge">🏅 Значок</option>
          </select>
          <input type="text" class="ms-value" value="" style="width:70px;border:1.5px solid rgba(120,120,128,0.2);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--bg);color:var(--text)" placeholder="Значение"/>
          <input type="text" class="ms-label" value="" style="flex:2;min-width:120px;border:1.5px solid rgba(120,120,128,0.2);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--bg);color:var(--text)" placeholder="Описание"/>
          <button class="dyn-del-btn" onclick="this.closest('[data-ms-idx]').remove()" title="Удалить">✕</button>
        `;
        list.appendChild(div);
      });

      // Save config
      document.getElementById("ref-cfg-save")?.addEventListener("click", async btn => {
        const saveBtn = document.getElementById("ref-cfg-save");
        saveBtn.disabled = true; saveBtn.textContent = "Сохраняем…";
        try {
          // Collect milestones from DOM
          const milestones = [...document.querySelectorAll("#ref-ms-list [data-ms-idx]")].map(row => ({
            count: parseInt(row.querySelector(".ms-count").value) || 1,
            type:  row.querySelector(".ms-type").value,
            value: row.querySelector(".ms-type").value === "premium_days"
              ? parseInt(row.querySelector(".ms-value").value) || 0
              : row.querySelector(".ms-value").value.trim(),
            label: row.querySelector(".ms-label").value.trim(),
          }));
          const body = {
            initData,
            isEnabled:           document.getElementById("ref-cfg-enabled").checked,
            referrerRewardDays:  parseInt(document.getElementById("ref-cfg-ref-days").value) || 0,
            refereeRewardDays:   parseInt(document.getElementById("ref-cfg-new-days").value) || 0,
            minAccountAgeDays:   parseInt(document.getElementById("ref-cfg-min-age").value)  || 0,
            maxReferralsPerDay:  parseInt(document.getElementById("ref-cfg-max-day").value)  || 50,
            milestones,
          };
          const res = await fetch("/app/api/admin/referral/config/update", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!res.ok) throw new Error();
          referralAdminConfig = await res.json();
          showToast("✅ Настройки реферальной программы сохранены");
        } catch { showToast("❌ Ошибка при сохранении"); }
        finally { saveBtn.disabled = false; saveBtn.textContent = "💾 Сохранить настройки"; }
      });
    }

    /* ── DB stats tab ─────────────────────────────────────────────────────── */
    async function loadDbTab() {
      const content  = document.getElementById("content");
      const subtitle = document.getElementById("subtitle");
      subtitle.textContent = "База данных — размеры и чистка";
      content.innerHTML = `<div class="empty skeleton"><span class="big-emoji">🗄️</span>Загружаем статистику…</div>`;
      const fetchOpts = { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({initData}) };
      try {
        const res  = await fetch("/app/api/admin/db/stats", fetchOpts);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        if (currentTab !== "db") return;

        const maxBytes = Math.max(...(data.tables || []).map(t => t.bytes || 0), 1);
        const tableRows = (data.tables || []).map(t => {
          const pct = Math.round((t.bytes || 0) / maxBytes * 100);
          const barColor = t.table_name === "messages" ? "var(--danger)" : "var(--link)";
          return `
            <div style="margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">
                <span style="font-weight:700;font-size:13px">${esc(t.table_name)}</span>
                <span style="font-size:12px;color:var(--hint)">${esc(t.total_size)}</span>
              </div>
              <div style="background:rgba(120,120,128,.12);border-radius:4px;height:6px">
                <div style="width:${pct}%;height:6px;border-radius:4px;background:${barColor};transition:width .4s"></div>
              </div>
              <div style="font-size:11px;color:var(--hint);margin-top:2px">
                ${(t.live_rows||0).toLocaleString("ru-RU")} строк
                ${t.dead_rows > 0 ? ` · <span style="color:var(--orange)">${t.dead_rows.toLocaleString("ru-RU")} мёртвых</span>` : ""}
                · таблица ${esc(t.table_size)} + индексы ${esc(t.index_size)}
              </div>
            </div>`;
        }).join("");

        content.innerHTML = `
          <div class="card" style="margin-bottom:14px">
            <div style="font-size:13px;color:var(--hint);margin-bottom:4px">Всего занято</div>
            <div style="font-size:28px;font-weight:800">${esc(data.db_size)}</div>
          </div>
          <div class="card" style="margin-bottom:14px">
            <div style="font-weight:700;margin-bottom:12px">Таблицы</div>
            ${tableRows || '<span style="color:var(--hint)">Нет данных</span>'}
          </div>
          <div class="card">
            <div style="font-weight:700;margin-bottom:6px">Экстренная чистка</div>
            <div style="font-size:12px;color:var(--hint);margin-bottom:12px;line-height:1.5">
              Удаляет медиакеш старше 2 дней и запускает VACUUM ANALYZE.<br>
              Сообщения не затрагиваются.
            </div>
            <button id="dbCleanupBtn" class="action-btn" style="width:100%;padding:12px;font-size:14px;font-weight:700;background:rgba(255,64,64,0.12);color:var(--danger);border:1.5px solid rgba(255,64,64,0.25)"
              onclick="runDbCleanup()">🧹 Удалить старше 2 дней</button>
            <button id="dbWipeBtn" class="action-btn" style="width:100%;padding:12px;font-size:14px;font-weight:700;margin-top:8px;background:rgba(255,64,64,0.22);color:var(--danger);border:1.5px solid rgba(255,64,64,0.45)"
              onclick="runDbWipe()">🗑️ Удалить весь медиакеш</button>
            <button id="dbVacuumBtn" class="action-btn" style="width:100%;padding:12px;font-size:14px;font-weight:700;margin-top:8px;background:rgba(255,159,10,0.12);color:var(--orange);border:1.5px solid rgba(255,159,10,0.3)"
              onclick="runVacuumFull()">⚡ VACUUM FULL всей базы</button>
            <div id="dbCleanupResult" style="margin-top:10px;font-size:13px;text-align:center"></div>
          </div>`;
      } catch {
        if (currentTab !== "db") return;
        content.innerHTML = `<div class="error"><span class="big-emoji">⚠️</span>Не удалось загрузить статистику БД.</div>`;
      }

    function attachChannelHandlers() {
      // Add
      document.getElementById("chAddBtn")?.addEventListener("click", async () => {
        const btn      = document.getElementById("chAddBtn");
        const username = document.getElementById("chUsername")?.value.trim().replace(/^@/, "");
        const title    = document.getElementById("chTitle")?.value.trim() || null;
        if (!username) { showToast("Введите username канала"); return; }
        btn.disabled = true; btn.textContent = "Добавляем…";
        try {
          const res = await fetch("/app/api/admin/channels/add", {
            method: "POST", headers: {"Content-Type":"application/json"},
            body: JSON.stringify({initData, username, title}),
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || res.status);
          }
          showToast("Канал добавлен ✅");
          loadChannelsTab();
        } catch(e) {
          showToast("Ошибка: " + e.message);
          btn.disabled = false; btn.textContent = "Добавить";
        }
      });

      // Toggle active
      document.querySelectorAll(".ch-toggle-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = parseInt(btn.dataset.id);
          btn.disabled = true;
          try {
            const res = await fetch("/app/api/admin/channels/toggle", {
              method: "POST", headers: {"Content-Type":"application/json"},
              body: JSON.stringify({initData, channelId: id}),
            });
            if (!res.ok) throw new Error(res.status);
            const data = await res.json();
            btn.dataset.active = String(data.is_active);
            btn.classList.toggle("active",   data.is_active);
            btn.classList.toggle("inactive", !data.is_active);
            btn.textContent = data.is_active ? "✅ Вкл" : "⏸ Выкл";
          } catch(e) {
            showToast("Ошибка переключения");
          } finally {
            btn.disabled = false;
          }
        });
      });

      // Delete
      document.querySelectorAll(".ch-del-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("Удалить канал из списка?")) return;
          const id = parseInt(btn.dataset.id);
          try {

              method: "POST", headers: {"Content-Type":"application/json"},
              body: JSON.stringify({initData, channelId: id}),

            showToast("Ошибка удаления");
          }
        });
      });
    }

    const _gvAdminLottie = {};

    function _gvDestroyAdminLottie(idx) {

    async function _gvRenderAdminPreview(idx, tgsUrl) {
      _gvDestroyAdminLottie(idx);
      const el = document.getElementById(`gvAdminPreview_${idx}`);
      if (!el) return;
      if (!tgsUrl) { el.innerHTML = `<span style="font-size:28px">🎁</span>`; return; }
      el.innerHTML = `<span style="font-size:20px;opacity:0.5">⏳</span>`;
      try {
        const res = await fetch(tgsUrl);
        if (!res.ok) throw new Error("fetch");
        const ds = new DecompressionStream("gzip");
        const reader = res.body.pipeThrough(ds).getReader();
        const chunks = [];
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
        }
        const buf = new Uint8Array(chunks.reduce((s, c) => s + c.length, 0));
        let off = 0;
        for (const c of chunks) { buf.set(c, off); off += c.length; }
        const animData = JSON.parse(new TextDecoder().decode(buf));
        el.innerHTML = "";
        _gvAdminLottie[idx] = lottie.loadAnimation({
          container: el, renderer: "svg", loop: true, autoplay: true, animationData: animData,
        });
      } catch {
        el.innerHTML = `<span style="font-size:28px">🎁</span>`;
      }
    }

        return;
      }
      sel.innerHTML = `<option>Загружаем варианты…</option>`;
      try {
        const enc = encodeURIComponent(trimmed);
        const res = await fetch(`https://cdn.changes.tg/gifts/models/${enc}/sorted.json`);
        const variants = await res.json();
        const prevUrl = document.getElementById(`gv_prize_${idx}_image`).value;
        let prevVariant = "";
        if (prevUrl && prevUrl.includes(enc)) {
          const parts = prevUrl.split("/");
          prevVariant = decodeURIComponent(parts[parts.length - 1]).replace(".tgs", "");
        }
        sel.innerHTML = variants.map(v =>
          `<option value="${esc(v.name)}"${v.name === prevVariant ? " selected" : ""}>${esc(v.name)}` +
          `<span style="opacity:0.5"> · ${(v.rarityPermille / 10).toFixed(1)}%</span></option>`
        ).join("");
        if (!prevVariant) sel.value = "Original";
        _gvOnVariantChange(idx);
      } catch {
        sel.innerHTML = `<option value="Original">Original</option>`;
        _gvOnVariantChange(idx);
      }
    }

    function _gvOnVariantChange(idx) {
      const giftName = document.getElementById(`gvGiftName_${idx}`).value.trim();
      const variant  = document.getElementById(`gvVariantSel_${idx}`).value;
      if (!giftName || !variant) return;
      const url = `https://cdn.changes.tg/gifts/models/${encodeURIComponent(giftName)}/${encodeURIComponent(variant)}.tgs`;
      document.getElementById(`gv_prize_${idx}_image`).value = url;
      _gvRenderAdminPreview(idx, url);
      _scheduleGiveawayPreviewSync();
    }

    async function _gvInitPicker(idx, storedUrl) {
      if (!storedUrl || !storedUrl.includes("cdn.changes.tg/gifts/models/")) return;
      try {
        const path   = storedUrl.replace("https://cdn.changes.tg/gifts/models/", "");
        const parts  = path.split("/");
        const giftName   = decodeURIComponent(parts[0]);
        const variantName = decodeURIComponent(parts[1]).replace(".tgs", "");
        const nameInput = document.getElementById(`gvGiftName_${idx}`);
        if (nameInput) nameInput.value = giftName;
        await _gvOnGiftInput(idx, giftName);
        const sel = document.getElementById(`gvVariantSel_${idx}`);
        if (sel && [...sel.options].some(o => o.value === variantName)) sel.value = variantName;
        _gvOnVariantChange(idx);
      } catch {}
    }

    // ── Giveaway Preview ────────────────────────────────────────────────────
    const _gvPreviewLottie = {};
   let _gvPreviewCountdownTimer = null;
   let _gvPreviewSyncTimer = null;
   const _gvPreviewSyncListeners = []; // {el, event, fn}

    function _destroyGvPreviewLottie() {
      for (const inst of Object.values(_gvPreviewLottie)) { try { inst.destroy(); } catch {} }
      for (const k of Object.keys(_gvPreviewLottie)) delete _gvPreviewLottie[k];
    }

    function _syncGiveawayPreviewNow() {
      const overlay = document.getElementById("gvPreviewOverlay");
      if (!overlay) return;

      const prizes    = [1,2,3].map(i => (document.getElementById(`gv_prize_${i}`)?.value || "").trim());
      const prizeImgs = [1,2,3].map(i => (document.getElementById(`gv_prize_${i}_image`)?.value || "").trim());
      const desc = (document.getElementById("gvDesc")?.value || "").trim() || "Пригласи больше друзей — топ-3 получат призы!";

      // Update description
      const heroSub = overlay.querySelector(".gv-hero-sub");
      if (heroSub) heroSub.textContent = desc;

      // Rebuild prize section
      const MEDALS = ["🥇","🥈","🥉"];
      const PCLS   = ["gp1","gp2","gp3"];
      const PLACES = ["1-е место","2-е место","3-е место"];
      const anyPrize = prizes.some(Boolean) || prizeImgs.some(Boolean);

      function _prizeHtml(rank) {
        const i = rank - 1;
        const txt = prizes[i]; const img = prizeImgs[i];
        const configured = !!(txt || img);
        let mediaHtml = "";
        if (img && img.endsWith(".tgs")) {
          mediaHtml = `<div id="gvPreviewLottie_${rank}" class="gv-prize-lottie"></div>`;
        } else if (img) {
          mediaHtml = `<img src="${esc(img)}" class="gv-prize-img" alt="" onerror="this.style.display='none'">`;
        } else {
          mediaHtml = `<span class="gv-prize-empty">${txt ? "🎁" : "🔜"}</span>`;
        }
        return `<div class="gv-prize-card ${PCLS[i]}${configured ? "" : " gv-tba"}">
          <span class="gv-prize-medal">${MEDALS[i]}</span>
          ${mediaHtml}
          <div class="gv-prize-name">${txt ? esc(txt) : "TBA"}</div>
          <div class="gv-prize-place">${PLACES[i]}</div>
        </div>`;
      }

      // Destroy existing Lottie instances before replacing HTML
      _destroyGvPreviewLottie();

      const newPrizesHtml = anyPrize
        ? `<div class="gv-prizes">${_prizeHtml(1)}${_prizeHtml(2)}${_prizeHtml(3)}</div>`
        : `<div class="gv-no-prizes">Призы не заданы — секция скрыта для пользователей</div>`;

      const sheet = overlay.querySelector(".gv-preview-sheet");
      const oldPrizes = sheet.querySelector(".gv-prizes, .gv-no-prizes");
      if (oldPrizes) {
        oldPrizes.outerHTML = newPrizesHtml;
      } else {
        // Insert before the divider if no existing prizes element
        const divider = sheet.querySelector(".gv-preview-divider");
        if (divider) divider.insertAdjacentHTML("beforebegin", newPrizesHtml);
      }

      // Re-init Lottie for any TGS prize images
      prizeImgs.forEach((url, i) => {
        if (url && url.endsWith(".tgs")) _loadGvPreviewLottie(`gvPreviewLottie_${i+1}`, url);
      });
    }

    function _scheduleGiveawayPreviewSync() {
      if (_gvPreviewSyncTimer) clearTimeout(_gvPreviewSyncTimer);
      _gvPreviewSyncTimer = setTimeout(() => {
        _gvPreviewSyncTimer = null;
        _syncGiveawayPreviewNow();
      }, 500);
    }

    async function _loadGvPreviewLottie(containerId, tgsUrl) {
      const el = document.getElementById(containerId);
      if (!el) return;
      try {
        const res = await fetch(tgsUrl);
        if (!res.ok) throw new Error("fetch");
        const ds = new DecompressionStream("gzip");
        const reader = res.body.pipeThrough(ds).getReader();
        const chunks = [];
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
        }
        const buf = new Uint8Array(chunks.reduce((s, c) => s + c.length, 0));
        let off = 0; for (const c of chunks) { buf.set(c, off); off += c.length; }
        const animData = JSON.parse(new TextDecoder().decode(buf));
        el.innerHTML = "";
        _gvPreviewLottie[containerId] = lottie.loadAnimation({
          container: el, renderer: "svg", loop: true, autoplay: true, animationData: animData,
        });
      } catch {
        const el2 = document.getElementById(containerId);
        if (el2) el2.innerHTML = `<span style="font-size:26px">🎁</span>`;
      }
    }

    async function showGiveawayPreview() {
      _destroyGvPreviewLottie();
      const existing = document.getElementById("gvPreviewOverlay");
      if (existing) existing.remove();

      // Read current (unsaved) form values
      const prizes    = [1,2,3].map(i => (document.getElementById(`gv_prize_${i}`)?.value || "").trim());
      const prizeImgs = [1,2,3].map(i => (document.getElementById(`gv_prize_${i}_image`)?.value || "").trim());
      const desc = (document.getElementById("gvDesc")?.value || "").trim() || "Пригласи больше друзей — топ-3 получат призы!";
      const deadlineRaw = document.getElementById("gvDeadline")?.value || "";
      let deadline = null;
      if (deadlineRaw) { try { deadline = new Date(deadlineRaw).toISOString(); } catch {} }

      const MEDALS = ["🥇","🥈","🥉"];
      const PCLS   = ["gp1","gp2","gp3"];
      const PLACES = ["1-е место","2-е место","3-е место"];
      const anyPrize = prizes.some(Boolean) || prizeImgs.some(Boolean);

      function _prizeHtml(rank) {
        const i = rank - 1;
        const txt = prizes[i]; const img = prizeImgs[i];
        const configured = !!(txt || img);
        let mediaHtml = "";
        if (img && img.endsWith(".tgs")) {
          mediaHtml = `<div id="gvPreviewLottie_${rank}" class="gv-prize-lottie"></div>`;
        } else if (img) {
          mediaHtml = `<img src="${esc(img)}" class="gv-prize-img" alt="" onerror="this.style.display='none'">`;
        } else {
          mediaHtml = `<span class="gv-prize-empty">${txt ? "🎁" : "🔜"}</span>`;
        }
        return `<div class="gv-prize-card ${PCLS[i]}${configured ? "" : " gv-tba"}">
          <span class="gv-prize-medal">${MEDALS[i]}</span>
          ${mediaHtml}
          <div class="gv-prize-name">${txt ? esc(txt) : "TBA"}</div>
          <div class="gv-prize-place">${PLACES[i]}</div>
        </div>`;
      }

      const prizesHtml = anyPrize
        ? `<div class="gv-prizes">${_prizeHtml(1)}${_prizeHtml(2)}${_prizeHtml(3)}</div>`
        : `<div class="gv-no-prizes">Призы не заданы — секция скрыта для пользователей</div>`;

      // Countdown
      let cdHtml = "";
      if (deadline) {
        const diff = new Date(deadline).getTime() - Date.now();
        if (diff > 0) {
          const dv = Math.floor(diff / 86400000);
          const hv = Math.floor((diff % 86400000) / 3600000);
          const mv = Math.floor((diff % 3600000) / 60000);
          const sv = Math.floor((diff % 60000) / 1000);
          cdHtml = `<div class="gv-cd-wrap" id="gvPreviewCdWrap">
            <div class="gv-cd-cell"><div class="gv-cd-val" id="gvPreviewCdD">${dv}</div><div class="gv-cd-lbl">дней</div></div>
            <div class="gv-cd-cell"><div class="gv-cd-val" id="gvPreviewCdH">${String(hv).padStart(2,"0")}</div><div class="gv-cd-lbl">часов</div></div>
            <div class="gv-cd-cell"><div class="gv-cd-val" id="gvPreviewCdM">${String(mv).padStart(2,"0")}</div><div class="gv-cd-lbl">минут</div></div>
            <div class="gv-cd-cell"><div class="gv-cd-val" id="gvPreviewCdS">${String(sv).padStart(2,"0")}</div><div class="gv-cd-lbl">секунд</div></div>
          </div>`;
        } else {
          cdHtml = `<div class="gv-cd-finished">🏆 Розыгрыш завершён!</div>`;
        }
      } else {
        cdHtml = `<div class="gv-cd-finished">🎁 Розыгрыш идёт!</div>`;
      }

      // Fetch fresh leaderboard data for the preview
      let topSlots = [];
      try {
        const lbRes = await fetch("/app/api/admin/giveaway/config", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData}),
        });
        if (lbRes.ok) {
          const lbData = await lbRes.json();
          topSlots = Array.isArray(lbData.top) ? lbData.top : [];
        }
      } catch (_) { /* fall through to placeholders */ }

      function _podiumSlot(rank, entry) {
        const crown = rank === 1 ? `<span class="giveaway-ps-crown">👑</span>` : "";
        if (entry) {
          const initials = entry.display_name
            .split(" ").filter(Boolean).slice(0,2)
            .map(w => w[0].toUpperCase()).join("") || "?";
          const countLabel = entry.referral_count === 1
            ? "1 реферал"
            : `${entry.referral_count} реферала(ов)`;
          return `<div class="giveaway-ps-slot rank-${rank}">
            <div class="giveaway-ps-avatar">${crown}${esc(initials)}</div>
            <div class="giveaway-ps-name">${esc(entry.display_name)}</div>
            <div class="giveaway-ps-count">${countLabel}</div>
            <div class="giveaway-ps-base">${rank}</div>
          </div>`;
        }
        return `<div class="giveaway-ps-slot rank-${rank} empty">
          <div class="giveaway-ps-avatar">${crown}?</div>
          <div class="giveaway-ps-name">Свободно</div>
          <div class="giveaway-ps-count">Пригласи друзей</div>
          <div class="giveaway-ps-base">${rank}</div>
        </div>`;
      }

      const byRank = {};
      topSlots.forEach(e => { byRank[e.rank] = e; });
      const podiumHtml = `
        ${_podiumSlot(2, byRank[2] || null)}
        ${_podiumSlot(1, byRank[1] || null)}
        ${_podiumSlot(3, byRank[3] || null)}`;

      const overlay = document.createElement("div");
      overlay.id = "gvPreviewOverlay";
      overlay.className = "gv-preview-overlay";
      overlay.innerHTML = `
        <div class="gv-preview-sheet">
          <div class="gv-preview-header">
            <span>👁️ Предпросмотр (текущие поля)</span>
            <button class="gv-preview-close" onclick="closeGiveawayPreview()">✕</button>
          </div>
          <div class="gv-hero">
            <div class="gv-hero-body">
              <span class="gv-hero-icon">🎁</span>
              <div class="gv-hero-title">Розыгрыш</div>
              <div class="gv-hero-sub">${esc(desc)}</div>
            </div>
            ${cdHtml}
          </div>
          ${prizesHtml}
          <div class="gv-preview-divider">🏆 Таблица лидеров</div>
          <div class="giveaway-podium-stage">
            ${podiumHtml}
          </div>
        </div>`;
      overlay.addEventListener("click", e => { if (e.target === overlay) closeGiveawayPreview(); });
      document.body.appendChild(overlay);

      // Start live countdown ticker if there is a future deadline
      if (_gvPreviewCountdownTimer) { clearInterval(_gvPreviewCountdownTimer); _gvPreviewCountdownTimer = null; }
      if (deadline) {
        const deadlineMs = new Date(deadline).getTime();
        _gvPreviewCountdownTimer = setInterval(() => {
          const remaining = deadlineMs - Date.now();
          const wrap = document.getElementById("gvPreviewCdWrap");
          if (!wrap) { clearInterval(_gvPreviewCountdownTimer); _gvPreviewCountdownTimer = null; return; }
          if (remaining <= 0) {
            clearInterval(_gvPreviewCountdownTimer); _gvPreviewCountdownTimer = null;
            wrap.outerHTML = `<div class="gv-cd-finished">🏆 Розыгрыш завершён!</div>`;
            return;
          }
          const dv = Math.floor(remaining / 86400000);
          const hv = Math.floor((remaining % 86400000) / 3600000);
          const mv = Math.floor((remaining % 3600000) / 60000);
          const sv = Math.floor((remaining % 60000) / 1000);
          const dEl = document.getElementById("gvPreviewCdD");
          const hEl = document.getElementById("gvPreviewCdH");
          const mEl = document.getElementById("gvPreviewCdM");
          const sEl = document.getElementById("gvPreviewCdS");
          if (dEl) dEl.textContent = dv;
          if (hEl) hEl.textContent = String(hv).padStart(2,"0");
          if (mEl) mEl.textContent = String(mv).padStart(2,"0");
          if (sEl) sEl.textContent = String(sv).padStart(2,"0");
        }, 1000);
      }

      // Load TGS prize animations
      prizeImgs.forEach((url, i) => {
        if (url && url.endsWith(".tgs")) _loadGvPreviewLottie(`gvPreviewLottie_${i+1}`, url);
      });

      // Attach live-sync listeners to form fields (debounced 500 ms)
      const _syncFieldIds = [
        "gv_prize_1", "gv_prize_2", "gv_prize_3",
        "gv_prize_1_image", "gv_prize_2_image", "gv_prize_3_image",
        "gvDesc",
      ];
      // Clear any stale listeners first
      while (_gvPreviewSyncListeners.length) {
        const { el, event, fn } = _gvPreviewSyncListeners.pop();
        el.removeEventListener(event, fn);
      }
      for (const id of _syncFieldIds) {
        const el = document.getElementById(id);
        if (!el) continue;
        const fn = _scheduleGiveawayPreviewSync;
        el.addEventListener("input", fn);
        _gvPreviewSyncListeners.push({ el, event: "input", fn });
      }
    }

    function closeGiveawayPreview() {
      if (_gvPreviewCountdownTimer) { clearInterval(_gvPreviewCountdownTimer); _gvPreviewCountdownTimer = null; }
      if (_gvPreviewSyncTimer) { clearTimeout(_gvPreviewSyncTimer); _gvPreviewSyncTimer = null; }
      // Remove live-sync listeners
      while (_gvPreviewSyncListeners.length) {
        const { el, event, fn } = _gvPreviewSyncListeners.pop();
        el.removeEventListener(event, fn);
      }
      _destroyGvPreviewLottie();
      const el = document.getElementById("gvPreviewOverlay");
      if (el) el.remove();
    }

    async function saveGiveawayCfg(btn) {
      const result = document.getElementById("gvSaveResult");
      btn.disabled = true; btn.textContent = "⏳ Сохраняем…";
      result.textContent = "";
      try {
        const deadlineRaw = document.getElementById("gvDeadline").value;
        let deadlineISO = null;
        if (deadlineRaw) {
          // datetime-local is local time → convert to UTC ISO
          deadlineISO = new Date(deadlineRaw).toISOString();
        }
        const opensAtRaw = document.getElementById("gvOpensAt").value;
        let opensAtISO = null;
        if (opensAtRaw) {
          opensAtISO = new Date(opensAtRaw).toISOString();
        }
        const body = {
          initData,
          deadline: deadlineISO,
          opensAt: opensAtISO,
          prize1: document.getElementById("gv_prize_1").value.trim() || null,
          prize2: document.getElementById("gv_prize_2").value.trim() || null,
          prize3: document.getElementById("gv_prize_3").value.trim() || null,
          prize1Image: document.getElementById("gv_prize_1_image").value.trim() || null,
          prize2Image: document.getElementById("gv_prize_2_image").value.trim() || null,
          prize3Image: document.getElementById("gv_prize_3_image").value.trim() || null,
          description: document.getElementById("gvDesc").value.trim() || null,
          isActive: document.getElementById("gvActive").checked,
          isVisibleToAll: document.getElementById("gvVisible").checked,
        };
        const res = await fetch("/app/api/admin/giveaway/update", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error((await res.json().catch(()=>({}))).detail || "error");
        _giveawayCfg = await res.json();
        result.innerHTML = `<span style="color:var(--success,#34c759)">✅ Сохранено</span>`;
        renderGiveawayAdminTab();
      } catch(e) {
        result.innerHTML = `<span style="color:var(--danger,#ff453a)">❌ ${esc(String(e))}</span>`;
        btn.disabled = false; btn.textContent = "💾 Сохранить";
      }
    }

  </script>
