<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Админ-панель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js" defer></script>
<style>
  :root {
    --bg: #0b0b11;
    --secondary-bg: #141420;
    --card-bg: rgba(255,255,255,0.065);
    --card-border: rgba(255,255,255,0.10);
    --text: #f2f2f7;
    --hint: rgba(242,242,247,0.40);
    --link: #818cf8;
    --button: #6366f1;
    --button-text: #ffffff;
    --green: #30d158;
    --orange: #ff9f0a;
    --danger: #ff453a;
    --purple: #bf5af2;
    --accent: #6366f1;
    --card-radius: 18px;
    --shadow: 0 2px 12px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 0 14px 84px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  .header {
    margin: 0 -14px;
    padding: 18px 20px 20px;
    background: linear-gradient(145deg, #0e0b20 0%, #1b1040 48%, #0c1e52 100%);
    animation: fadeDown 0.4s ease;
    position: relative; overflow: hidden;
  }
  .header::before {
    content: ""; position: absolute; top: -50px; right: -50px;
    width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .header::after {
    content: ""; position: absolute; bottom: -20px; left: 20px;
    width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle, rgba(191,90,242,0.10) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 18px; position: relative;
  }
  .header-top-left { }
  .header-eyebrow {
    font-size: 11px; color: rgba(255,255,255,0.45);
    font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px;
  }
  .header h1 { font-size: 22px; margin: 0; font-weight: 800; letter-spacing: -0.4px; color: #fff; }
  .header p  { display: none; }
  .header-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: #fff;
    flex-shrink: 0; letter-spacing: -0.5px;
    box-shadow: 0 4px 20px rgba(99,102,241,0.55);
    border: 1.5px solid rgba(255,255,255,0.18);
  }
  .header .avatar-ring { display: none; }
  .kpi-row {
    display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; position: relative;
  }
  .kpi-card {
    background: rgba(255,255,255,0.08); border-radius: 14px;
    padding: 10px 6px; text-align: center;
    border: 1px solid rgba(255,255,255,0.10);
    transition: transform 0.15s;
  }
  .kpi-card:active { transform: scale(0.95); }
  .kpi-ico { font-size: 15px; margin-bottom: 4px; display: block; }
  .kpi-val { font-size: 19px; font-weight: 900; line-height: 1; letter-spacing: -0.5px; }
  .kpi-lbl { font-size: 9px; color: rgba(242,242,247,0.42); margin-top: 3px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
  .kpi-card.k-users  { box-shadow: inset 0 0 0 1px rgba(69,170,242,0.18), 0 0 20px rgba(69,170,242,0.07); }
  .kpi-card.k-active { box-shadow: inset 0 0 0 1px rgba(48,209,88,0.18),  0 0 20px rgba(48,209,88,0.07); }
  .kpi-card.k-block  { box-shadow: inset 0 0 0 1px rgba(255,69,58,0.18),   0 0 20px rgba(255,69,58,0.07); }
  .kpi-card.k-msgs   { box-shadow: inset 0 0 0 1px rgba(255,159,10,0.18),  0 0 20px rgba(255,159,10,0.07); }
  .kpi-card.k-users  .kpi-val { color: #45AAF2; }
  .kpi-card.k-active .kpi-val { color: var(--green); }
  .kpi-card.k-block  .kpi-val { color: var(--danger); }
  .kpi-card.k-msgs   .kpi-val { color: var(--orange); }

  /* ── Bottom nav ── */
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(10,10,16,0.97); backdrop-filter: blur(28px) saturate(1.4);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; z-index: 100; padding: 8px 0 max(20px, env(safe-area-inset-bottom));
  }
  .nav-btn {
    flex: 1; border: none; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0;
    position: relative;
    transition: transform 0.15s;
  }
  .nav-btn::before {
    content: ""; position: absolute; top: -1px; left: 50%;
    transform: translateX(-50%) scaleX(0);
    width: 28px; height: 2.5px;
    background: var(--accent); border-radius: 0 0 4px 4px;
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1);
  }
  .nav-btn.active::before { transform: translateX(-50%) scaleX(1); }
  .nav-btn:active { transform: scale(0.91); }
  .nav-ico {
    font-size: 22px; line-height: 1;
    transition: filter 0.2s, transform 0.2s cubic-bezier(.34,1.56,.64,1);
    filter: grayscale(1) opacity(0.32);
  }
  .nav-lbl {
    font-size: 10px; font-weight: 700; color: rgba(242,242,247,0.28);
    transition: color 0.18s;
  }
  .nav-btn.active .nav-ico { filter: none; transform: scale(1.1) translateY(-1px); }
  .nav-btn.active .nav-lbl { color: var(--accent); }

  /* ── Tab bar (hidden — replaced by bottom nav) ── */
  .tab-row { display: none; }
  .tab-chip { display: none; }

  /* ── Summary cards (hidden — KPIs moved to header) ── */
  .cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  .cards.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .card {
    background: var(--card-bg);
    border-radius: var(--card-radius);
    padding: 15px 14px;
    border: 1px solid var(--card-border);
    animation: riseIn 0.35s ease backwards;
    box-shadow: var(--shadow);
  }
  .card .c-icon { font-size: 16px; margin-bottom: 6px; display: block; }
  .card .c-val  { font-size: 28px; font-weight: 900; line-height: 1.05; letter-spacing: -0.8px; }
  .card .c-lbl  { font-size: 11px; color: var(--hint); margin-top: 4px; font-weight: 500; }
  .card.c-users  { border-left: 3px solid rgba(69,170,242,0.5); }
  .card.c-active { border-left: 3px solid rgba(48,209,88,0.5); }
  .card.c-block  { border-left: 3px solid rgba(255,69,58,0.5); }
  .card.c-msgs   { border-left: 3px solid rgba(255,159,10,0.5); }
  .card.c-users  .c-val { color: #45AAF2; }
  .card.c-active .c-val { color: var(--green); }
  .card.c-block  .c-val { color: var(--danger); }
  .card.c-msgs   .c-val { color: var(--orange); }
  .card:nth-child(1){animation-delay:.02s} .card:nth-child(2){animation-delay:.06s}
  .card:nth-child(3){animation-delay:.10s} .card:nth-child(4){animation-delay:.14s}

  /* ── Search & filters ── */
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.07);
    border-radius: 14px; padding: 10px 14px;
    margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,0.11);
    transition: border-color 0.2s;
  }
  .search-box:focus-within {
    border-color: rgba(99,102,241,0.55);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.10);
  }
  .search-box input {
    flex: 1; border: none; outline: none;
    background: transparent; color: var(--text); font-size: 14px;
  }
  .search-box input::placeholder { color: var(--hint); }

  .segmented {
    display: flex; background: rgba(255,255,255,0.06);
    border-radius: 12px; padding: 3px; margin-bottom: 8px; gap: 2px;
    border: 1px solid rgba(255,255,255,0.07);
  }
  .segmented button {
    flex: 1; border: none; background: transparent;
    padding: 7px 4px; font-size: 12px; font-weight: 600;
    color: var(--hint); border-radius: 9px; transition: all 0.18s ease;
  }
  .segmented button.active {
    background: rgba(99,102,241,0.22); color: var(--text);
    box-shadow: 0 1px 6px rgba(0,0,0,0.3);
  }

  .sort-row {
    display: flex; gap: 6px; margin: 8px 0 14px;
    overflow-x: auto; padding-bottom: 2px;
  }
  .sort-row::-webkit-scrollbar { display: none; }
  .sort-chip {
    flex-shrink: 0; border: none;
    background: rgba(255,255,255,0.07);
    color: var(--hint); font-size: 12px; font-weight: 600;
    padding: 7px 13px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.10);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .sort-chip.active {
    background: rgba(99,102,241,0.22); color: var(--text);
    border-color: rgba(99,102,241,0.4);
  }

  /* ── Section title ── */
  .section-title {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.7px; color: var(--hint);
    margin: 4px 2px 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .section-title .sub { font-size: 10px; font-weight: 500; color: var(--hint); text-transform: none; letter-spacing: 0; }

  /* ── User cards ── */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .user-card {
    background: var(--card-bg);
    border-radius: var(--card-radius);
    padding: 14px;
    border: 1px solid var(--card-border);
    animation: riseIn 0.35s ease backwards;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-shadow: var(--shadow);
  }
  .user-card:active { opacity: 0.92; }
  .user-card:has(.details.open) {
    border-color: rgba(99,102,241,0.5);
    box-shadow: 0 0 0 1px rgba(99,102,241,0.18), 0 4px 20px rgba(99,102,241,0.12);
  }
  .user-top { display: flex; gap: 11px; align-items: flex-start; }
  .avatar-wrap { position: relative; flex-shrink: 0; }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 16px;
  }
  .status-dot {
    position: absolute; bottom: 0; right: 0;
    width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--bg);
  }
  .status-dot.active  { background: var(--green); }
  .status-dot.blocked { background: var(--danger); }
  .status-dot.muted   { background: var(--orange); }

  .user-main { flex: 1; min-width: 0; }
  .user-name {
    font-size: 14px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .user-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .user-sub  { font-size: 11px; color: var(--hint); }
  .user-badge {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 7px;
    white-space: nowrap;
  }
  .user-badge.active  { background: rgba(52,199,89,0.18);  color: var(--green); }
  .user-badge.blocked { background: rgba(255,64,64,0.18);  color: var(--danger); }
  .user-badge.muted   { background: rgba(255,159,10,0.18); color: var(--orange); }
  .user-last { font-size: 10px; color: var(--hint); text-align: right; flex-shrink: 0; line-height: 1.5; }

  /* mini stats row */
  .user-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 6px; margin: 12px 0 0;
  }
  .stat {
    text-align: center; padding: 8px 4px;
    background: rgba(255,255,255,0.04); border-radius: 10px;
  }
  .stat .n { font-size: 15px; font-weight: 800; }
  .stat .l { font-size: 9px; color: var(--hint); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.3px; }

  /* action buttons */
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .actions + .actions { margin-top: 6px; }
  .action-btn {
    flex: 1; min-width: 0; border: none; border-radius: 10px;
    padding: 9px 6px; font-size: 11.5px; font-weight: 700;
    background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.85);
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .action-btn:active { transform: scale(0.96); opacity: 0.8; }
  .action-btn:disabled { opacity: 0.4; }
  .action-btn.on   { background: var(--accent); color: #fff; }
  .action-btn.danger { background: rgba(255,64,64,0.14); color: var(--danger); }
  .action-btn.danger.on { background: var(--danger); color: #fff; }

  /* expandable details */
  .expand-btn {
    width: 100%; border: none; background: transparent;
    color: var(--accent); font-size: 12px; font-weight: 600;
    padding: 10px 0 2px; text-align: center;
  }
  .details {
    display: none; margin-top: 10px; padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.07);
  }
  .details.open { display: block; }
  .detail-row {
    display: flex; justify-content: space-between;
    padding: 5px 0; font-size: 12.5px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .dl { color: var(--hint); }
  .detail-row .dv { font-weight: 600; text-align: right; }

  /* ── Growth chart ── */
  .growth-card {
    background: var(--card-bg);
    border-radius: var(--card-radius);
    padding: 16px 14px;
    border: 1px solid var(--card-border);
    margin-bottom: 14px;
  }
  .growth-bars {
    display: flex; align-items: flex-end; gap: 3px;
    height: 110px; margin-top: 12px;
  }
  .growth-bar-col {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end; height: 100%;
  }
  .growth-bar {
    width: 100%; border-radius: 4px 4px 0 0;
    min-height: 3px; transition: height 0.5s ease;
  }
  .growth-bar.type-conn { background: linear-gradient(to top, var(--purple), rgba(168,85,247,0.4)); }
  .growth-bar.type-msg  { background: linear-gradient(to top, var(--accent), rgba(108,92,231,0.4)); }
  .growth-legend {
    display: flex; justify-content: space-between;
    font-size: 10.5px; color: var(--hint); margin-top: 6px;
  }

  /* ── Analytics Variant B ── */
  .analytics-pills { display: flex; gap: 8px; margin-bottom: 14px; }
  .analytics-pill {
    flex: 1; background: var(--card-bg);
    border-radius: 16px;
    padding: 12px 10px;
    border: 1px solid var(--card-border);
    display: flex; align-items: center; gap: 9px;
    animation: riseIn 0.3s ease backwards;
  }
  .ap-icon { font-size: 20px; flex-shrink: 0; }
  .ap-val { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; line-height: 1.1; }
  .ap-lbl { font-size: 10px; color: var(--hint); margin-top: 1px; }
  .ap-val.c-link   { color: #45AAF2; }
  .ap-val.c-green  { color: var(--green); }
  .ap-val.c-danger { color: var(--danger); }
  .analytics-chart-card {
    background: var(--card-bg);
    border-radius: var(--card-radius);
    padding: 14px 14px 10px;
    border: 1px solid var(--card-border);
    margin-bottom: 12px;
  }
  .chart-legend { display: flex; gap: 14px; margin-top: 6px; justify-content: center; }
  .chart-legend-item { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--hint); }
  .chart-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .analytics-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .integrity-card {
    background: var(--card-bg); border-radius: var(--card-radius);
    padding: 14px 10px;
    border: 1px solid var(--card-border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .integrity-title { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .integrity-score { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
  .integrity-sub   { font-size: 10px; color: var(--hint); margin-top: 1px; }
  .media-bk-card { background: var(--card-bg); border-radius: var(--card-radius); padding: 14px; border: 1px solid var(--card-border); }
  .media-bk-title { font-size: 12px; font-weight: 700; margin-bottom: 10px; }
  .media-bk-row { display: flex; align-items: center; gap: 6px; font-size: 11.5px; margin-bottom: 7px; }
  .media-bk-row:last-child { margin-bottom: 0; }
  .media-bk-bar-track { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .media-bk-bar-fill  { height: 100%; border-radius: 3px; background: var(--accent); }
  .media-bk-count { font-weight: 700; min-width: 24px; text-align: right; }

  /* ── Broadcast ── */
  .broadcast-card {
    background: var(--card-bg);
    border-radius: var(--card-radius);
    padding: 16px;
    border: 1px solid var(--card-border);
    margin-bottom: 12px;
  }
  .broadcast-label {
    font-size: 13px; font-weight: 700; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  /* Formatting toolbar */
  .fmt-toolbar {
    display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px;
  }
  .fmt-btn {
    min-width: 34px; height: 34px; padding: 0 8px;
    border: 1px solid rgba(255,255,255,0.1); border-radius: 9px;
    background: rgba(255,255,255,0.06); color: var(--text);
    font-size: 13px; font-family: inherit; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s, border-color 0.12s;
    white-space: nowrap;
  }
  .fmt-btn:active { background: rgba(99,102,241,0.25); border-color: var(--accent); }
  .fmt-btn.fmt-b  { font-weight: 800; }
  .fmt-btn.fmt-i  { font-style: italic; }
  .fmt-btn.fmt-u  { text-decoration: underline; }
  .fmt-btn.fmt-s  { text-decoration: line-through; }
  .fmt-btn.fmt-sp { filter: blur(2.5px); letter-spacing: 1px; }
  .fmt-divider    { width: 1px; background: rgba(255,255,255,0.1); margin: 3px 2px; align-self: stretch; }
  /* Textarea */
  .broadcast-card textarea {
    width: 100%; min-height: 130px; box-sizing: border-box;
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 12px 13px;
    font-size: 14px; font-family: inherit; color: var(--text);
    background: rgba(255,255,255,0.05); resize: vertical; outline: none;
    transition: border-color 0.2s;
  }
  .broadcast-card textarea:focus { border-color: var(--accent); }
  .char-count { font-size: 11px; color: var(--hint); text-align: right; margin: 4px 2px 0; }
  /* Inline buttons builder */
  .bc-section-hdr {
    font-size: 12px; font-weight: 700; color: var(--hint);
    margin: 14px 0 8px; display: flex; align-items: center; gap: 6px;
    text-transform: uppercase; letter-spacing: .4px;
  }
  .bc-btn-rows { display: flex; flex-direction: column; gap: 8px; }
  .bc-btn-row {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 10px 10px 6px;
  }
  .bc-btn-row-header {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: var(--hint); margin-bottom: 8px; font-weight: 600;
  }
  .bc-btn-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
  .bc-btn-entry { display: flex; gap: 6px; align-items: center; }
  .bc-btn-entry input {
    flex: 1; min-width: 0; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 9px;
    padding: 8px 10px; font-size: 13px; color: var(--text); font-family: inherit; outline: none;
  }
  .bc-btn-entry input::placeholder { color: var(--hint); font-size: 12px; }
  .bc-btn-entry input:focus { border-color: var(--accent); }
  .bc-remove-btn {
    width: 28px; height: 28px; border: none; border-radius: 8px; cursor: pointer;
    background: rgba(255,60,60,0.12); color: #ff5555; font-size: 15px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .bc-add-btn-in-row, .bc-add-row-btn {
    font-size: 12px; font-weight: 700; border: none; border-radius: 9px;
    padding: 6px 12px; cursor: pointer; transition: opacity 0.15s;
  }
  .bc-add-btn-in-row { background: rgba(99,102,241,0.12); color: var(--accent); }
  .bc-add-row-btn {
    background: rgba(99,102,241,0.12); color: var(--accent);
    width: 100%; padding: 10px; border-radius: 12px; margin-top: 4px;
  }
  /* Preview */
  .bc-preview-wrap {
    margin-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 14px;
  }
  .bc-preview-hdr {
    font-size: 12px; font-weight: 700; color: var(--hint);
    margin-bottom: 8px; text-transform: uppercase; letter-spacing: .4px;
  }
  .bc-preview-bubble {
    background: rgba(99,102,241,0.15); border-radius: 16px 16px 4px 16px;
    padding: 12px 14px; font-size: 14px; line-height: 1.55; word-break: break-word;
    border: 1px solid rgba(99,102,241,0.2); min-height: 24px;
  }
  .bc-preview-bubble tg-spoiler,
  .bc-preview-bubble .tg-spoiler-preview { background: rgba(255,255,255,0.3); border-radius: 3px; color: transparent; }
  .bc-preview-bubble blockquote {
    margin: 6px 0; padding: 4px 10px;
    border-left: 3px solid rgba(255,255,255,0.35); color: rgba(255,255,255,0.75);
    font-style: normal;
  }
  .bc-preview-btns { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
  .bc-preview-btn-row { display: flex; gap: 5px; }
  .bc-preview-btn {
    flex: 1; background: rgba(99,102,241,0.18); border-radius: 10px;
    padding: 8px 10px; font-size: 13px; font-weight: 600; text-align: center;
    color: var(--accent); border: 1px solid rgba(99,102,241,0.25);
  }
  .primary-btn {
    width: 100%; border: none; border-radius: 14px; padding: 13px;
    font-size: 14px; font-weight: 700;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    color: #fff; box-shadow: 0 4px 20px rgba(99,102,241,0.45);
    transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
    margin-top: 14px;
  }
  .primary-btn:disabled { opacity: 0.45; box-shadow: none; }
  .primary-btn:active { opacity: 0.88; transform: scale(0.98); box-shadow: 0 2px 8px rgba(99,102,241,0.3); }
  .broadcast-hint {
    font-size: 11.5px; color: var(--hint); margin-top: 10px; line-height: 1.5;
  }

  /* ── Action log ── */
  .log-list { display: flex; flex-direction: column; gap: 8px; }
  .log-item {
    background: var(--card-bg);
    border-radius: 16px; padding: 12px 14px;
    border: 1px solid var(--card-border);
    display: flex; gap: 12px; align-items: flex-start;
  }
  .log-dot {
    width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    margin-top: 1px;
  }
  .log-dot.settings  { background: rgba(108,92,231,0.2); }
  .log-dot.broadcast { background: rgba(168,85,247,0.2); }
  .log-dot.other     { background: rgba(255,255,255,0.07); }
  .log-body { flex: 1; min-width: 0; }
  .log-top {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 8px; margin-bottom: 3px;
  }
  .log-action { font-size: 13px; font-weight: 700; }
  .log-time { font-size: 11px; color: var(--hint); flex-shrink: 0; }
  .log-admin { font-size: 11.5px; color: var(--accent); margin-bottom: 2px; }
  .log-details { font-size: 11.5px; color: var(--hint); word-break: break-word; }

  /* ── Messages / Pager ── */
  .message-item {
    background: var(--card-bg);
    border-radius: 16px; padding: 12px 14px; margin-bottom: 8px;
    border: 1px solid var(--card-border);
  }
  .message-top {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 12.5px; font-weight: 700; margin-bottom: 4px;
  }
  .message-time { font-size: 10.5px; color: var(--hint); font-weight: 500; }
  .message-text { font-size: 13.5px; white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
  .message-flags { margin-top: 6px; display: flex; gap: 5px; }
  .m-flag {
    font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 7px;
    background: rgba(120,120,128,0.12); color: var(--hint);
  }
  .m-flag.edited  { background: rgba(255,159,10,0.14); color: var(--orange); }
  .m-flag.deleted { background: rgba(255,59,48,0.14);  color: var(--danger); }

  .pager {
    display: flex; justify-content: space-between;
    align-items: center; margin: 14px 0 4px;
  }
  .pager-btn {
    border: none; border-radius: 12px; padding: 9px 16px;
    font-size: 13px; font-weight: 700;
    background: var(--card-bg); color: var(--accent);
    border: 1px solid var(--card-border);
  }
  .pager-btn:disabled { opacity: 0.35; }
  .pager span { font-size: 12.5px; color: var(--hint); font-weight: 500; }

  /* ── Back link ── */
  .back-link {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--accent); font-size: 13.5px; font-weight: 600;
    margin-bottom: 14px; padding: 4px 0;
  }

  /* ── Bottom sheet ── */
  .sheet-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 20; opacity: 0; pointer-events: none;
    transition: opacity 0.22s ease;
  }
  .sheet-overlay.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: 85vh;
    background: #13101f; border-radius: 24px 24px 0 0; z-index: 21;
    transform: translateY(100%); transition: transform 0.28s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column;
    box-shadow: 0 -8px 48px rgba(0,0,0,0.6);
    border-top: 1px solid rgba(255,255,255,0.10);
  }
  .sheet.show { transform: translateY(0); }
  .sheet-handle {
    width: 38px; height: 4px; background: rgba(255,255,255,0.18);
    border-radius: 3px; margin: 12px auto 0; flex-shrink: 0; cursor: pointer;
  }
  .sheet-header { padding: 14px 16px 10px; flex-shrink: 0; }
  .sheet-header h2 { margin: 0 0 3px; font-size: 17px; font-weight: 700; }
  .sheet-header p  { margin: 0; color: var(--hint); font-size: 12.5px; }
  .sheet-divider { height: 1px; background: rgba(255,255,255,0.07); flex-shrink: 0; }
  .sheet-body { overflow-y: auto; padding: 14px 14px calc(max(20px, env(safe-area-inset-bottom)) + 64px); }

  /* ── Chat cards (in sheet) ── */
  .chat-card {
    background: rgba(255,255,255,0.05);
    border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,0.07); cursor: pointer;
    transition: background 0.12s;
  }
  .chat-card:active { background: rgba(255,255,255,0.09); }
  .chat-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .chat-name { font-size: 14px; font-weight: 700; }
  .chat-sub  { font-size: 11px; color: var(--hint); margin-top: 2px; }
  .chat-chips { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .chat-chip {
    font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 7px;
    background: rgba(120,120,128,0.12); color: var(--hint); white-space: nowrap;
  }
  .chat-chip.streak { background: rgba(255,159,10,0.15); color: var(--orange); }
  .chat-chip.mutual { background: rgba(52,199,89,0.15);  color: var(--green); }
  .chat-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 6px; margin-top: 10px;
  }
  .chat-stats .stat { padding: 7px 2px; background: rgba(255,255,255,0.04); border-radius: 8px; }
  .chat-stats .stat .n { font-size: 14px; }

  /* ── Empty / Error / Toast ── */
  .empty, .error {
    text-align: center; padding: 44px 20px; color: var(--hint);
    font-size: 14px; line-height: 1.55;
    background: var(--card-bg); border-radius: var(--card-radius);
    border: 1px solid var(--card-border);
  }
  .empty .big-emoji, .error .big-emoji { font-size: 42px; display: block; margin-bottom: 12px; }

  .toast {
    position: fixed; left: 50%; bottom: 90px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(255,255,255,0.12); color: #fff;
    backdrop-filter: blur(20px);
    padding: 10px 18px; border-radius: 30px;
    font-size: 13px; font-weight: 600; border: 1px solid rgba(255,255,255,0.15);
    opacity: 0; transition: all 0.25s ease; pointer-events: none; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Skeleton ── */
  .skeleton { animation: pulse 1.2s ease-in-out infinite; }

  /* ── Keyframes ── */
  @keyframes fadeDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:none} }
  @keyframes riseIn   { from{opacity:0;transform:translateY(12px) scale(0.98)} to{opacity:1;transform:none} }
  @keyframes pulse    { 0%,100%{opacity:1} 50%{opacity:0.42} }
  @keyframes shimmer  { from{background-position:200% center} to{background-position:-200% center} }
  /* ── Balance edit modal ── */
  .balance-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 2000;
  }
  .balance-sheet {
    background: #1a1a2e;
    border-radius: 20px 20px 0 0;
    padding: 22px 18px 32px;
    width: 100%; max-width: 440px;
    box-shadow: 0 -4px 40px rgba(0,0,0,0.5);
    border-top: 1px solid rgba(255,255,255,0.08);
    animation: riseIn 0.22s ease;
  }
  .balance-sheet-title { font-size: 15px; font-weight: 700; text-align: center; margin-bottom: 12px; }
  .balance-current { text-align: center; font-size: 30px; font-weight: 900; color: var(--purple); margin-bottom: 3px; }
  .balance-current-lbl { text-align: center; font-size: 12px; color: var(--hint); margin-bottom: 16px; }
  .balance-presets { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 12px; justify-content: center; }
  .balance-preset { border: none; border-radius: 9px; padding: 5px 12px; font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.08); color: var(--text); touch-action: manipulation; }
  .balance-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .balance-number-input {
    flex: 1; border: 1.5px solid rgba(255,255,255,0.15); border-radius: 11px;
    padding: 10px 14px; font-size: 17px; font-weight: 700;
    background: rgba(255,255,255,0.06); color: var(--text); text-align: center;
  }
  .balance-set-btn {
    border: none; border-radius: 11px; padding: 10px 16px;
    font-size: 14px; font-weight: 700; background: var(--accent); color: #fff;
    touch-action: manipulation;
  }
  .balance-cancel-btn {
    display: block; width: 100%; text-align: center; padding: 10px;
    font-size: 14px; color: var(--hint); border: none; background: none;
  }
  .balance-mode-row {
    display: flex; gap: 8px; margin-bottom: 14px;
  }
  .balance-mode-btn {
    flex: 1; border: 1.5px solid rgba(255,255,255,0.12); border-radius: 11px;
    padding: 8px 4px; font-size: 12px; font-weight: 700;
    background: rgba(255,255,255,0.05); color: var(--text); touch-action: manipulation;
    transition: background 0.15s, color 0.15s;
  }
  .balance-mode-btn.active { border-color: transparent; }

  /* ── Subscription admin tab ── */
  .sub-admin-card {
    background: var(--card-bg); border-radius: var(--card-radius);
    padding: 16px; border: 1px solid var(--card-border); margin-bottom: 14px;
  }
  .sub-admin-title {
    font-size: 14px; font-weight: 700; margin-bottom: 14px;
    display: flex; align-items: center; gap: 7px;
  }
  .sub-field { margin-bottom: 12px; }
  .sub-field label { font-size: 12px; color: var(--hint); font-weight: 600; display: block; margin-bottom: 5px; }
  .sub-field input[type="text"],
  .sub-field input[type="number"],
  .sub-field textarea {
    width: 100%; border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 12px; padding: 10px 12px;
    font-size: 14px; font-family: inherit; color: var(--text);
    background: rgba(255,255,255,0.05); outline: none; transition: border-color .2s;
    box-sizing: border-box;
  }
  .sub-field input:focus,
  .sub-field textarea:focus { border-color: var(--accent); }
  .sub-toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid rgba(120,120,128,.09); margin-bottom: 12px;
  }
  .sub-toggle-lbl { font-size: 14px; font-weight: 700; }
  .sub-toggle-sub { font-size: 12px; color: var(--hint); }
  .toggle-switch {
    position: relative; width: 46px; height: 26px; flex-shrink: 0;
  }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; cursor: pointer; inset: 0;
    background: rgba(120,120,128,0.25); border-radius: 13px; transition: .3s;
  }
  .toggle-slider::before {
    content: ""; position: absolute; height: 20px; width: 20px;
    left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .3s;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .toggle-switch input:checked + .toggle-slider { background: var(--green); }
  .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }
  .benefit-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 0; border-bottom: 1px solid rgba(120,120,128,.07);
  }
  .benefit-row:last-child { border-bottom: none; }
  .benefit-name { font-size: 13px; font-weight: 600; }
  .benefit-hint { font-size: 11px; color: var(--hint); }
  .benefit-input {
    border: 1.5px solid rgba(255,255,255,0.12); border-radius: 10px;
    padding: 5px 8px; font-size: 13px; font-weight: 700;
    background: rgba(255,255,255,0.05); color: var(--text); width: 70px; text-align: center;
  }
  .sub-save-btn {
    width: 100%; border: none; border-radius: 14px; padding: 13px;
    font-size: 14px; font-weight: 700;
    background: linear-gradient(90deg, #5856d6, var(--link));
    color: #fff; box-shadow: 0 3px 10px rgba(36,129,204,.25);
    touch-action: manipulation;
  }
  .sub-save-btn:disabled { opacity: .5; }
  .sub-subscriber-card {
    background: rgba(255,255,255,0.04); border-radius: 14px;
    padding: 13px 14px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 12px;
    border: 1px solid rgba(255,255,255,.07);
  }
  .sub-stats-row {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-bottom: 14px;
  }
  .sub-stat-card {
    background: var(--card-bg); border-radius: 14px;
    padding: 11px 10px; text-align: center; border: 1px solid var(--card-border);
  }
  .sub-stat-val { font-size: 22px; font-weight: 900; line-height: 1; }
  .sub-stat-lbl { font-size: 10px; color: var(--hint); margin-top: 3px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .sub-sub-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px; font-weight: 800; flex-shrink: 0;
    letter-spacing: -0.5px;
  }
  .sub-sub-info { flex: 1; min-width: 0; }
  .sub-sub-name { font-size: 13.5px; font-weight: 700; line-height: 1.2; }
  .sub-sub-id   { font-size: 11px; color: var(--hint); font-family: monospace; margin-top: 1px; }
  .sub-sub-meta { font-size: 11.5px; color: var(--hint); margin-top: 3px; }
  .sub-revoke-btn {
    border: none; border-radius: 9px; padding: 6px 11px;
    font-size: 12px; font-weight: 700;
    background: rgba(255,59,48,.12); color: var(--danger);
    touch-action: manipulation;
  }
  .sub-grant-form {
    display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .sub-grant-form input {
    flex: 1; min-width: 120px; border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 11px; padding: 9px 12px;
    font-size: 13px; background: rgba(255,255,255,0.05); color: var(--text); outline: none;
    box-sizing: border-box;
  }
  .sub-grant-btn {
    border: none; border-radius: 11px; padding: 9px 14px;
    font-size: 13px; font-weight: 700;
    background: rgba(52,199,89,.13); color: var(--green);
    touch-action: manipulation; white-space: nowrap;
  }
  .sub-status-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 8px;
  }
  .sub-status-pill.on  { background: rgba(52,199,89,.14);  color: var(--green); }
  .sub-status-pill.off { background: rgba(255,59,48,.14);  color: var(--danger); }
  .sub-filter-row {
    display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .sub-filter-chip {
    border: 1.5px solid rgba(120,120,128,.22); border-radius: 20px;
    padding: 5px 12px; font-size: 12px; font-weight: 600;
    background: transparent; color: var(--hint); touch-action: manipulation;
    transition: background .15s, color .15s, border-color .15s;
  }
  .sub-filter-chip.active {
    background: rgba(88,86,214,.12); border-color: rgba(88,86,214,.4); color: #5856d6;
  }
  .sub-pager {
    display: flex; justify-content: center; gap: 8px; margin-top: 10px;
  }
  .sub-page-btn {
    border: 1.5px solid rgba(120,120,128,.22); border-radius: 10px;
    padding: 6px 14px; font-size: 13px; font-weight: 700;
    background: var(--bg); color: var(--text); touch-action: manipulation;
  }
  .sub-page-btn:disabled { opacity: .35; }

  /* ── Dynamic benefits editor ── */
  .dyn-benefit-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid rgba(120,120,128,.07);
  }
  .dyn-benefit-row:last-child { border-bottom: none; }
  .dyn-del-btn {
    border: none; border-radius: 8px; padding: 4px 8px;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
    background: rgba(255,59,48,.12); color: var(--danger);
    touch-action: manipulation;
  }
  .quickadd-wrap { margin-top: 12px; }
  .quickadd-label { font-size: 11px; color: var(--hint); font-weight: 600; margin-bottom: 6px; }
  .quickadd-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .quickadd-chip {
    border: 1.5px dashed rgba(120,120,128,.35);
    border-radius: 10px; padding: 5px 11px;
    font-size: 12px; font-weight: 600; color: var(--hint);
    background: transparent; touch-action: manipulation;

  .custom-ben-row { display: flex; gap: 7px; margin-top: 8px; flex-wrap: wrap; }
  .custom-ben-row input {
    flex: 1; min-width: 100px; border: 1.5px solid rgba(255,255,255,.12);
    border-radius: 10px; padding: 8px 11px;
    font-size: 13px; background: rgba(255,255,255,0.05); color: var(--text); outline: none;
  }
  .custom-ben-add-btn {
    border: none; border-radius: 10px; padding: 8px 14px;
    font-size: 13px; font-weight: 700;
    background: rgba(36,129,204,.13); color: var(--link);
    touch-action: manipulation; white-space: nowrap;
  }
  .show-custom-btn {
    border: none; background: none; color: var(--link);
    font-size: 13px; font-weight: 600; padding: 6px 0;
    touch-action: manipulation;
  }

  .shop-item-card {
    background: var(--card-bg); border-radius: var(--card-radius);
    padding: 16px; border: 1px solid var(--card-border); margin-bottom: 14px;
  }
  .shop-item-header {
    display: flex; align-items: center; justify-content: space-between;

  }
  .shop-item-title { font-size: 14px; font-weight: 700; }
  .shop-field { margin-bottom: 12px; }

  .shop-field input[type="number"], .shop-field input[type="text"] {
    width: 100%; border: 1.5px solid rgba(255,255,255,.12);
    border-radius: 12px; padding: 10px 12px;

  .shop-option-del {

  .shop-add-option-row { display: flex; gap: 7px; }
  .shop-add-option-row input {
    flex: 1; border: 1.5px solid rgba(255,255,255,.12);
    border-radius: 10px; padding: 7px 11px; font-size: 13px;
    background: rgba(255,255,255,0.05); color: var(--text); outline: none;
  }
  .shop-add-option-btn {
    border: none; border-radius: 10px; padding: 7px 14px;
    font-size: 13px; font-weight: 700;
    background: rgba(52,199,89,.13); color: var(--green);
    touch-action: manipulation; white-space: nowrap;
  }

  /* ── Giveaway Preview Modal ─────────────────────────────────────────────── */
  .gv-preview-overlay {

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const initData = tg ? tg.initData : "";

    // Set header avatar initials from Telegram user
    (function() {
      const u = tg?.initDataUnsafe?.user;
      const el = document.getElementById("headerAvatar");
      if (!el) return;
      if (u) {
        const initials = ((u.first_name||"")[0]||"") + ((u.last_name||"")[0]||"");
        el.textContent = initials.toUpperCase() || (u.username||"A")[0].toUpperCase();
      } else {
        el.textContent = "AD";
      }
    })();
    let overview = null;
    let searchQuery = "";
    let filterMode = "all";
    let sortMode = "messages";
    const expandedIds = new Set();
    let currentTab = "users";
    let growthData = null;
    let actionLogPage = 1;
    let actionLogData = null;
    let currentSheetUser = null;
    let messagesPage = 1;
    let currentChatId = null;

    // Escape HTML to prevent XSS when injecting untrusted user/message data via innerHTML
    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    const AVATAR_COLORS = ["#FF6B6B","#4ECDC4","#45AAF2","#F7B731","#A55EEA","#26DE81","#FD9644","#2BCBBA"];

    function colorFor(seed) {
      let h = 0;
      for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
      return AVATAR_COLORS[h % AVATAR_COLORS.length];
    }

    function initials(name) {
      const parts = name.trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return "?";
      if (parts.length === 1) return parts[0][0].toUpperCase();
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }

    function fmtDate(iso) {
      if (!iso) return "нет данных";
      const d = new Date(iso);
      return d.toLocaleDateString("ru-RU") + " " + d.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
    }

    function timeAgo(iso) {
      if (!iso) return "нет активности";
      const diff = Date.now() - new Date(iso).getTime();
      const min = Math.floor(diff / 60000);
      if (min < 1)  return "только что";
      if (min < 60) return `${min} мин назад`;
      const hr = Math.floor(min / 60);
      if (hr < 24)  return `${hr} ч назад`;
      const days = Math.floor(hr / 24);
      if (days < 30) return `${days} дн назад`;
      return new Date(iso).toLocaleDateString("ru-RU");
    }

    function displayName(u) {
      const name = [u.first_name, u.last_name].filter(Boolean).join(" ");
      return name || (u.username ? "@" + u.username : "ID " + u.owner_telegram_id);
    }

    function confirmAction(message) {
      return new Promise(resolve => {
        if (tg && tg.showConfirm) tg.showConfirm(message, ok => resolve(!!ok));
        else resolve(window.confirm(message));
      });
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2400);
    }

    function getFilteredSorted() {
      let list = overview.users.slice();
      if (filterMode === "active")  list = list.filter(u => !u.is_blocked);
      if (filterMode === "blocked") list = list.filter(u => u.is_blocked);
      if (filterMode === "muted")   list = list.filter(u => !u.notifications_enabled);
      if (searchQuery) {
        list = list.filter(u =>
          displayName(u).toLowerCase().includes(searchQuery) ||
          (u.username || "").toLowerCase().includes(searchQuery) ||
          String(u.owner_telegram_id).includes(searchQuery)
        );
      }
      const sorters = {
        messages: (a,b) => b.total_messages - a.total_messages,
        recent:   (a,b) => new Date(b.last_activity_at||0) - new Date(a.last_activity_at||0),
        newest:   (a,b) => new Date(b.connected_at||0) - new Date(a.connected_at||0),
        coins:    (a,b) => (b.wallet_balance||0) - (a.wallet_balance||0),
      };
      return list.sort(sorters[sortMode] || sorters.messages);
    }

    function userStatusClass(u) {
      if (u.is_blocked) return "blocked";
      if (!u.notifications_enabled) return "muted";
      return "active";
    }
    function userStatusLabel(u) {
      if (u.is_blocked) return "🚫 Заблок.";
      if (!u.notifications_enabled) return "🔕 Без увед.";
      return "✓ Активен";
    }

      return `

          <div class="user-top">
            <div class="avatar-wrap">

            <div class="stat"><div class="n">${esc(u.edited_messages)}</div><div class="l">Правки</div></div>

            <div class="stat"><div class="n" style="color:var(--link)">${(u.referrals || []).filter(r => r.status === "active").length}</div><div class="l">🔗 Реф.</div></div>
          </div>

          ${(() => {
            const hasSub = !!u.subscription_expires_at;
            const refs   = u.referrals || [];
            const active = refs.filter(r => r.status === "active").length;
            const pending = refs.filter(r => r.status === "pending").length;
            const chips = [];
            if (hasSub) {
              const exp = u.subscription_expires_at.slice(0, 10);
              chips.push(`<span style="background:rgba(255,214,10,0.18);color:#b8860b;border:1px solid rgba(255,214,10,0.35);border-radius:8px;padding:2px 9px;font-size:11px;font-weight:700">⭐ Premium до ${exp}</span>`);
            }
            if (active > 0)  chips.push(`<span style="background:rgba(52,199,89,0.15);color:var(--green);border:1px solid rgba(52,199,89,0.3);border-radius:8px;padding:2px 9px;font-size:11px;font-weight:700">🔗 ${active} акт. реф.</span>`);
            if (pending > 0) chips.push(`<span style="background:rgba(120,120,128,0.12);color:var(--hint);border:1px solid rgba(120,120,128,0.2);border-radius:8px;padding:2px 9px;font-size:11px;font-weight:600">⏳ ${pending} ожид.</span>`);
            return chips.length ? `<div style="display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px">${chips.join("")}</div>` : "";
          })()}

          <div class="actions">
            <button class="action-btn ${u.notifications_enabled ? "on" : ""}" data-action="notifications" data-value="${!u.notifications_enabled}">
              ${u.notifications_enabled ? "🔔 Увед. вкл" : "🔕 Увед. выкл"}
            </button>
            <button class="action-btn danger ${u.is_blocked ? "on" : ""}" data-action="block" data-value="${!u.is_blocked}">
              ${u.is_blocked ? "✅ Разблокировать" : "🚫 Заблокировать"}

          <div class="actions" style="margin-top:7px">

            ${u.username ? `<button class="action-btn" data-action="message" data-username="${esc(u.username)}">✉️ Написать</button>` : ""}

          <button class="expand-btn" data-toggle-details>${isOpen ? "Скрыть ▲" : "Подробнее ▼"}</button>
          <div class="details ${isOpen ? "open" : ""}">

            <div class="detail-row"><span class="dl">Подключение (TG)</span><span class="dv">${u.is_enabled ? "✓ Включено" : "— Выключено"}</span></div>
            <div class="detail-row"><span class="dl">Подписка</span><span class="dv">${u.subscription_expires_at ? "⭐ до " + u.subscription_expires_at.slice(0,10) : "— нет"}</span></div>
            ${(() => {
              const refs = u.referrals || [];
              if (!refs.length) return `<div class="detail-row"><span class="dl">Рефералы</span><span class="dv" style="color:var(--hint)">нет</span></div>`;
              const STATUS_CLS = { active: "ref-status-active", pending: "ref-status-pending", fraud: "ref-status-fraud" };
              const STATUS_LBL = { active: "акт.", pending: "ожид.", fraud: "фрод" };
              const rows = refs.map(r => {
                const name = r.referred_first_name || ("#" + r.referred_telegram_id);
                const uname = r.referred_username ? ` @${r.referred_username}` : "";
                const ini = name.replace(/^#\d+/, "?").split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase() || "?";
                const bg = colorFor(String(r.referred_telegram_id));
                return `<div style="display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px solid rgba(120,120,128,0.08)">
                  <div style="width:26px;height:26px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0">${esc(ini)}</div>
                  <div style="flex:1;min-width:0">
                    <div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(name)}${esc(uname)}</div>
                    <div style="font-size:10px;color:var(--hint)">#${r.referred_telegram_id}</div>
                  </div>
                  <span class="ref-recent-status ${STATUS_CLS[r.status] || ""}" style="font-size:10px">${STATUS_LBL[r.status] || r.status}</span>
                </div>`;
              }).join("");
              return `<div style="margin-top:6px">
                <div style="font-size:11px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Приглашённые (${refs.length})</div>
                ${rows}

            })()}
          </div>
        </div>
      `;
    }

    function closeMoreMenu() {
      document.getElementById("moreMenuSheet").classList.remove("show");
      document.getElementById("moreMenuOverlay").classList.remove("show");
    }
    document.getElementById("moreMenuOverlay").addEventListener("click", closeMoreMenu);

    function switchTab(tab) {
      currentTab = tab;
      // sync hidden top tab-row
      document.querySelectorAll("#mainTabs .tab-chip").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });
      // sync bottom nav
      document.querySelectorAll("#bottomNav .nav-btn").forEach(btn => {
        if (btn.dataset.tab === "more-menu") {
          btn.classList.remove("active");
        } else {
          btn.classList.toggle("active", btn.dataset.tab === tab);
        }
      });
      if (tab === "users")          render();
      else if (tab === "growth")    loadGrowth();
      else if (tab === "broadcast") renderBroadcastTab();
      else if (tab === "log")       loadActionLog(1);
      else if (tab === "subscription") loadSubscriptionTab();
      else if (tab === "shop")         loadShopAdminTab();
      else if (tab === "referral")     loadReferralAdminTab();
      else if (tab === "giveaway")     loadGiveawayAdminTab();
      else if (tab === "channels")      loadChannelsTab();
      else if (tab === "db")           loadDbTab();
      else if (tab === "msgsearch")    loadMsgSearchTab();
    }

    function render() {
      if (currentTab !== "users") return;
      const content  = document.getElementById("content");
      const subtitle = document.getElementById("subtitle");
      subtitle.textContent = "Все подключённые пользователи бота";

      const connectedCount = overview.active_users ?? overview.users.filter(u => u.is_enabled).length;
      const blockedCount   = overview.users.filter(u => u.is_blocked).length;
      const totalMessages  = overview.users.reduce((s, u) => s + u.total_messages, 0);

      const cards = `
        <div class="cards">
          <div class="card c-users"><span class="c-icon">👥</span><div class="c-val">${overview.total_users}</div><div class="c-lbl">Всего пользователей</div></div>
          <div class="card c-active"><span class="c-icon">🔌</span><div class="c-val">${connectedCount}</div><div class="c-lbl">С подключением</div></div>
          <div class="card c-block"><span class="c-icon">🚫</span><div class="c-val">${blockedCount}</div><div class="c-lbl">Заблокировано</div></div>
          <div class="card c-msgs"><span class="c-icon">💬</span><div class="c-val">${totalMessages}</div><div class="c-lbl">Сообщений всего</div></div>
        </div>
      `;

      if (!overview.users.length) {
        content.innerHTML = cards + `
          <div class="empty" style="gap:14px">
            <span class="big-emoji">👥</span>
            Пока никто не подключил бота.
            <a href="tg://settings/edit" style="display:inline-block;margin-top:4px;padding:11px 20px;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);border-radius:12px;font-size:14px;font-weight:600;text-decoration:none">
              ⚙️ Подключить бота
            </a>
            <div style="font-size:12px;opacity:0.55;margin-top:2px">Настройки Telegram → Бизнес → Чат-боты</div>
          </div>`;
        return;
      }

      const controls = `
        <div class="search-box">
          <span>🔍</span>
          <input id="searchInput" type="text" placeholder="Поиск по имени, юзернейму, ID…" value="${searchQuery}" />
        </div>
        <div class="segmented" id="filterTabs">
          <button data-filter="all"     class="${filterMode==="all"     ?"active":""}">Все</button>
          <button data-filter="active"  class="${filterMode==="active"  ?"active":""}">Активные</button>
          <button data-filter="blocked" class="${filterMode==="blocked" ?"active":""}">Заблок.</button>
          <button data-filter="muted"   class="${filterMode==="muted"   ?"active":""}">Без увед.</button>
        </div>
        <div class="sort-row" id="sortTabs">
          <button class="sort-chip ${sortMode==="messages"?"active":""}" data-sort="messages">По сообщениям</button>
          <button class="sort-chip ${sortMode==="recent"  ?"active":""}" data-sort="recent">По активности</button>
          <button class="sort-chip ${sortMode==="newest"  ?"active":""}" data-sort="newest">По дате</button>
          <button class="sort-chip ${sortMode==="coins"   ?"active":""}" data-sort="coins">По монетам 🪙</button>
        </div>
      `;

      const filtered = getFilteredSorted();
      const listHtml = filtered.length
        ? `<div class="section-title">Пользователи <span class="sub">${filtered.length} из ${overview.users.length}</span></div><div class="list">${filtered.map(renderUser).join("")}</div>`
        : `<div class="empty"><span class="big-emoji">🔎</span>Никого не нашлось.</div>`;

      content.innerHTML = cards + controls + listHtml;
      attachHandlers();
    }

    function attachHandlers() {
      const input = document.getElementById("searchInput");
      if (input) {
        input.addEventListener("input", (e) => {
          searchQuery = e.target.value.toLowerCase();
          const caret = e.target.selectionStart;
          render();
          const ni = document.getElementById("searchInput");
          if (ni) { ni.focus(); ni.setSelectionRange(caret, caret); }
        });
      }
      document.querySelectorAll("#filterTabs button").forEach(btn => {
        btn.addEventListener("click", () => { filterMode = btn.dataset.filter; render(); });
      });
      document.querySelectorAll("#sortTabs button").forEach(btn => {
        btn.addEventListener("click", () => { sortMode = btn.dataset.sort; render(); });
      });
      document.querySelectorAll("[data-toggle-details]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = Number(btn.closest(".user-card").dataset.owner);
          if (expandedIds.has(id)) expandedIds.delete(id);
          else expandedIds.add(id);
          render();
        });
      });
      document.querySelectorAll(".action-btn[data-action='notifications'], .action-btn[data-action='block']").forEach(btn => {
        btn.addEventListener("click", () => onToggle(btn));
      });
      document.querySelectorAll(".action-btn[data-action='message']").forEach(btn => {
        btn.addEventListener("click", () => {
          const username = btn.dataset.username;
          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
          if (tg?.openTelegramLink) tg.openTelegramLink(`https://t.me/${username}`);
          else window.open(`https://t.me/${username}`, "_blank");
        });
      });
      document.querySelectorAll(".action-btn[data-action='copy-id']").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = btn.dataset.copy;
          try {
            await navigator.clipboard.writeText(id);
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
            showToast("ID скопирован: " + id);
          } catch { if (tg) tg.showAlert("ID: " + id); }
        });
      });
      document.querySelectorAll(".action-btn[data-action='chats']").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = Number(btn.closest(".user-card").dataset.owner);
          const user = overview.users.find(u => u.owner_telegram_id === id);
          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
          openChatsSheet(user);
        });
      });
      document.querySelectorAll(".action-btn[data-action='edit-balance']").forEach(btn => {
        btn.addEventListener("click", () => {
          const ownerId  = Number(btn.dataset.ownerId);
          const curBal   = Number(btn.dataset.balance) || 0;
          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
          openBalanceEditor(ownerId, curBal, btn);
        });
      });
    }

    function openBalanceEditor(ownerId, currentBalance, triggerBtn) {
      let mode = "set"; // "set" | "add" | "sub"

      const PRESETS = {
        set: [0, 100, 500, 1000, 5000, 10000],
        add: [10, 50, 100, 500, 1000, 5000],
        sub: [10, 50, 100, 500, 1000, "всё"],
      };
      const MODE_LABELS = { set: "Задать", add: "Добавить", sub: "Вычесть" };
      const MODE_COLORS = { set: "var(--purple)", add: "#4ADE80", sub: "#EF4444" };

      const overlay = document.createElement("div");
      overlay.className = "balance-overlay";
      document.body.appendChild(overlay);

      function render() {
        const presets = PRESETS[mode];
        const defVal  = mode === "set" ? currentBalance : (mode === "add" ? 100 : 50);
        overlay.innerHTML = `
          <div class="balance-sheet">
            <div class="balance-sheet-title">💰 Баланс пользователя</div>
            <div class="balance-current" style="color:${MODE_COLORS[mode]}">${currentBalance.toLocaleString("ru-RU")} 🪙</div>
            <div class="balance-current-lbl">Текущий баланс</div>

            <div class="balance-mode-row">
              ${["set","add","sub"].map(m => `
                <button class="balance-mode-btn ${mode===m?"active":""}" data-mode="${m}"
                  style="${mode===m ? `background:${MODE_COLORS[m]};color:#fff` : ""}">
                  ${m==="set"?"✏️ Задать":m==="add"?"➕ Добавить":"➖ Вычесть"}
                </button>`).join("")}
            </div>

            <div class="balance-presets">
              ${presets.map(v =>
                `<button class="balance-preset" data-val="${v === "всё" ? currentBalance : v}">
                  ${mode==="add"?"+":""}${typeof v==="number"?v.toLocaleString("ru-RU"):v}
                </button>`
              ).join("")}
            </div>

            <div class="balance-input-row">
              <input type="number" class="balance-number-input" id="balanceInput"
                min="${mode==="set"?0:1}" max="10000000" value="${defVal}"
                placeholder="${mode==="set"?"Новый баланс":mode==="add"?"Сколько добавить":"Сколько вычесть"}" />
              <button class="balance-set-btn" id="balanceSetBtn"
                style="background:${MODE_COLORS[mode]}">${MODE_LABELS[mode]}</button>
            </div>

            <button class="balance-cancel-btn" id="balanceCancelBtn">Отмена</button>
          </div>
        `;

        overlay.querySelectorAll(".balance-mode-btn").forEach(b => {
          b.addEventListener("click", () => { mode = b.dataset.mode; render(); });
        });
        overlay.querySelectorAll(".balance-preset").forEach(b => {
          b.addEventListener("click", () => {
            const inp = overlay.querySelector("#balanceInput");
            if (inp) inp.value = b.dataset.val;
          });
        });
        overlay.querySelector("#balanceCancelBtn").addEventListener("click", () => overlay.remove());

        overlay.querySelector("#balanceSetBtn").addEventListener("click", async () => {
          const inp     = overlay.querySelector("#balanceInput");
          const rawVal  = Math.max(0, Math.min(10_000_000, Number(inp?.value) || 0));
          const setBtn  = overlay.querySelector("#balanceSetBtn");
          setBtn.disabled = true;
          setBtn.textContent = "…";

          try {
            let endpoint, body;
            if (mode === "set") {
              endpoint = "/app/api/admin/wallet/set";
              body = { initData, ownerTelegramId: ownerId, newBalance: rawVal };
            } else {
              endpoint = "/app/api/admin/wallet/adjust";
              body = { initData, ownerTelegramId: ownerId, delta: mode === "add" ? rawVal : -rawVal };
            }

            const res = await fetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });
            if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || "ошибка");
            const data = await res.json();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");

            // Update local data
            const u = overview?.users?.find(u => u.owner_telegram_id === ownerId);
            if (u) u.wallet_balance = data.new_balance;
            if (triggerBtn) triggerBtn.dataset.balance = data.new_balance;
            currentBalance = data.new_balance;

            overlay.remove();
            const sign = mode === "add" ? `+${rawVal} → ` : mode === "sub" ? `-${rawVal} → ` : "";
            showToast(`✅ ${sign}${data.new_balance.toLocaleString("ru-RU")} 🪙`);
            render();
          } catch(e) {
            setBtn.disabled = false;
            setBtn.textContent = MODE_LABELS[mode];
            showToast("Ошибка: " + e.message);
          }
        });
      }

      render();
      overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
    }

    /* ── Growth / Analytics ── */
    async function loadGrowth() {
      const content  = document.getElementById("content");
      const subtitle = document.getElementById("subtitle");
      subtitle.textContent = "Аналитика и динамика";
      content.innerHTML = `<div class="empty skeleton"><span class="big-emoji">📈</span>Загружаем аналитику…</div>`;
      try {
        const fetchOpts = { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({initData}) };
        const [growthRes, dashRes] = await Promise.all([
          fetch("/app/api/admin/growth",          fetchOpts),
          fetch("/app/api/admin/dashboard_stats", fetchOpts),
        ]);
        if (!growthRes.ok || !dashRes.ok) throw new Error();
        growthData = await growthRes.json();
        const dashData = await dashRes.json();
        if (currentTab !== "growth") return;
        content.innerHTML = renderGrowth(growthData, dashData);
      } catch {
        if (currentTab !== "growth") return;
        content.innerHTML = `<div class="error"><span class="big-emoji">⚠️</span>Не удалось загрузить аналитику.</div>`;
      }
    }

    // Variant B: hero pills + SVG activity chart + integrity gauge + media breakdown
    function renderGrowth(data, dashData) {
      dashData = dashData || {};

      // ── Hero pills ──
      const totalMsgsAll  = overview ? overview.users.reduce((s,u) => s + u.total_messages, 0) : 0;
      const totalDelAll   = overview ? overview.users.reduce((s,u) => s + u.deleted_messages, 0) : 0;
      const delRate = totalMsgsAll ? Math.round(totalDelAll / totalMsgsAll * 100) : 0;
      const pills = `
        <div class="analytics-pills">
          <div class="analytics-pill" style="animation-delay:.02s">
            <span class="ap-icon">👥</span>
            <div><div class="ap-val c-link">${overview ? overview.total_users : "—"}</div><div class="ap-lbl">Пользователей</div></div>
          </div>
          <div class="analytics-pill" style="animation-delay:.06s">
            <span class="ap-icon">💬</span>
            <div><div class="ap-val c-green">${totalMsgsAll.toLocaleString("ru-RU")}</div><div class="ap-lbl">Сообщений всего</div></div>
          </div>
          <div class="analytics-pill" style="animation-delay:.10s">
            <span class="ap-icon">🗑</span>
            <div><div class="ap-val c-danger">${delRate}%</div><div class="ap-lbl">Удалено</div></div>
          </div>
        </div>`;

      // ── SVG activity chart ──
      const connMap = data.connections_by_day || {};
      const msgMap  = data.messages_by_day   || {};
      const DAYS = 30;
      const today = new Date(); today.setHours(0,0,0,0);
      const dates = [];
      for (let i = DAYS - 1; i >= 0; i--) {
        const d = new Date(today); d.setDate(d.getDate() - i);
        dates.push(d.toISOString().slice(0,10));
      }
      const msgSeries  = dates.map(d => msgMap[d]  || 0);
      const connSeries = dates.map(d => connMap[d] || 0);
      const maxMsg  = Math.max(...msgSeries,  1);
      const maxConn = Math.max(...connSeries, 1);
      const svgW = 300, svgH = 90;
      const slotW = svgW / DAYS;           // each slot = bar + implied gap, exact integer division
      const barW  = Math.max(1, slotW - 1.5);
      const msgBars = msgSeries.map((v, i) => {
        if (!v) return "";
        const h = Math.max(2, Math.round(v / maxMsg * svgH));
        const x = (i * slotW).toFixed(2);
        return `<rect x="${x}" y="${svgH - h}" width="${barW.toFixed(2)}" height="${h}" rx="2" fill="var(--link)" opacity="0.8"><title>${dates[i]}: ${v} сообщ.</title></rect>`;
      }).join("");
      const connBars = connSeries.map((v, i) => {
        if (!v) return "";
        const h = Math.max(2, Math.round(v / maxConn * 24));
        const x = (i * slotW).toFixed(2);
        return `<rect x="${x}" y="${svgH - h}" width="${barW.toFixed(2)}" height="${h}" rx="2" fill="var(--purple)" opacity="0.9"><title>${dates[i]}: ${v} подкл.</title></rect>`;
      }).join("");
      const firstDate = dates[0]     ? new Date(dates[0]).toLocaleDateString("ru-RU",{day:"numeric",month:"short"}) : "";
      const lastDate  = dates.at(-1) ? new Date(dates.at(-1)).toLocaleDateString("ru-RU",{day:"numeric",month:"short"}) : "";
      const chart = `
        <div class="analytics-chart-card">
          <div class="section-title" style="margin-bottom:10px">📈 Активность за 30 дней</div>
          <svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%;height:auto;display:block;overflow:visible">${msgBars}${connBars}</svg>
          <div class="growth-legend" style="margin-top:4px"><span>${firstDate}</span><span>${lastDate}</span></div>
          <div class="chart-legend">
            <div class="chart-legend-item"><div class="chart-legend-dot" style="background:var(--link)"></div>Сообщения</div>
            <div class="chart-legend-item"><div class="chart-legend-dot" style="background:var(--purple)"></div>Подключения</div>
          </div>
        </div>`;

      // ── Integrity gauge ──
      const integrity = Math.max(0, Math.min(100, 100 - delRate * 3));
      const iColor = integrity > 70 ? "var(--green)" : integrity > 40 ? "var(--orange)" : "var(--danger)";
      const arcLen = 157.08;
      const filled = (integrity / 100 * arcLen).toFixed(1);
      const gauge = `
        <div class="integrity-card">
          <div class="integrity-title">🛡 Целостность</div>
          <svg viewBox="0 0 120 65" style="width:110px;height:60px">
            <path d="M10,60 A50,50 0 0,1 110,60" fill="none" stroke="rgba(120,120,128,0.15)" stroke-width="12" stroke-linecap="round"/>
            <path d="M10,60 A50,50 0 0,1 110,60" fill="none" stroke="${iColor}" stroke-width="12" stroke-linecap="round"
              stroke-dasharray="${filled} ${arcLen}" style="transition:stroke-dasharray 1s ease"/>
          </svg>
          <div class="integrity-score" style="color:${iColor}">${integrity}</div>
          <div class="integrity-sub">из 100</div>
        </div>`;

      // ── Media breakdown ──
      const ICONS  = {photo:"🖼",voice:"🎙",video:"🎬",document:"📄",sticker:"🎯",audio:"🎵",animation:"🎞",video_note:"⭕"};
      const LABELS = {photo:"Фото",voice:"Голос",video:"Видео",document:"Файлы",sticker:"Стикеры",audio:"Аудио",animation:"GIF",video_note:"Кружки"};
      let mediaBkHtml = "";
      const bk = dashData.media_breakdown;
      if (bk && bk.length) {
        const maxC = Math.max(...bk.map(r => r.count), 1);
        mediaBkHtml = bk.sort((a,b) => b.count - a.count).slice(0,6).map(r => {
          const pct = Math.round(r.count / maxC * 100);
          return `<div class="media-bk-row">
            <span>${ICONS[r.media_type] || "📁"}</span>
            <span style="color:var(--hint);min-width:46px">${LABELS[r.media_type] || r.media_type}</span>
            <div class="media-bk-bar-track"><div class="media-bk-bar-fill" style="width:${pct}%"></div></div>
            <span class="media-bk-count">${r.count}</span>
          </div>`;
        }).join("");
      } else {
        mediaBkHtml = `<div style="color:var(--hint);font-size:12px;text-align:center;padding:12px 0">Нет медиа</div>`;
      }
      const mediaCard = `<div class="media-bk-card"><div class="media-bk-title">📎 Медиа</div>${mediaBkHtml}</div>`;

      return pills + chart + `<div class="analytics-bottom">${gauge}${mediaCard}</div>`;
    }

    /* ── Broadcast ── */
    // ── Formatting helpers ────────────────────────────────────────────────────
    function _fmtWrap(tag, attrs) {
      const ta = document.getElementById("broadcastText");
      if (!ta) return;
      const s = ta.selectionStart, e = ta.selectionEnd;
      const sel = ta.value.slice(s, e);
      const open  = attrs ? `<${tag} ${attrs}>` : `<${tag}>`;
      const close = `</${tag}>`;
      ta.value = ta.value.slice(0, s) + open + (sel || "текст") + close + ta.value.slice(e);
      // Place caret inside or after inserted tag
      const newPos = s + open.length + (sel || "текст").length;
      ta.focus();
      ta.setSelectionRange(sel ? newPos + close.length : s + open.length, sel ? newPos + close.length : newPos);
      _updateBroadcastPreview();
      document.getElementById("charCount").textContent = ta.value.length + " / 4096";
    }

    function _fmtLink() {
      const url = prompt("URL ссылки:", "https://");
      if (!url) return;
      const ta = document.getElementById("broadcastText");
      if (!ta) return;
      const s = ta.selectionStart, e = ta.selectionEnd;
      const sel = ta.value.slice(s, e) || "текст";
      const ins = `<a href="${url}">${sel}</a>`;
      ta.value = ta.value.slice(0, s) + ins + ta.value.slice(e);
      ta.focus();
      ta.setSelectionRange(s + ins.length, s + ins.length);
      _updateBroadcastPreview();
    }

    // ── Inline button rows state ──────────────────────────────────────────────
    let _bcRows = [];   // [{buttons:[{text,url}]}]

    function _bcAddRow() {
      _bcRows.push({ buttons: [{ text: "", url: "" }] });
      _renderBcRows();
    }
    function _bcRemoveRow(ri) {
      _bcRows.splice(ri, 1);
      _renderBcRows();
    }
    function _bcAddBtn(ri) {
      _bcRows[ri].buttons.push({ text: "", url: "" });
      _renderBcRows();
    }
    function _bcRemoveBtn(ri, bi) {
      _bcRows[ri].buttons.splice(bi, 1);
      if (!_bcRows[ri].buttons.length) _bcRows.splice(ri, 1);
      _renderBcRows();
    }
    function _bcInput(ri, bi, field, val) {
      _bcRows[ri].buttons[bi][field] = val;
      _updateBroadcastPreview();
    }

    function _renderBcRows() {
      const wrap = document.getElementById("bcRowsWrap");
      if (!wrap) return;
      wrap.innerHTML = _bcRows.map((row, ri) => `
        <div class="bc-btn-row">
          <div class="bc-btn-row-header">
            <span>Строка ${ri + 1}</span>
            <button class="bc-remove-btn" onclick="_bcRemoveRow(${ri})">✕</button>
          </div>
          <div class="bc-btn-list">
            ${row.buttons.map((btn, bi) => `
              <div class="bc-btn-entry">
                <input placeholder="Текст кнопки" value="${esc(btn.text)}"
                  oninput="_bcInput(${ri},${bi},'text',this.value)">
                <input placeholder="https://…" value="${esc(btn.url)}"
                  oninput="_bcInput(${ri},${bi},'url',this.value)">
                <button class="bc-remove-btn" onclick="_bcRemoveBtn(${ri},${bi})">✕</button>
              </div>`).join("")}
          </div>
          <button class="bc-add-btn-in-row" onclick="_bcAddBtn(${ri})">+ Кнопка</button>
        </div>`).join("");
      _updateBroadcastPreview();
    }

    function _updateBroadcastPreview() {
      const ta      = document.getElementById("broadcastText");
      const bubble  = document.getElementById("bcPreviewBubble");
      const btnWrap = document.getElementById("bcPreviewBtns");
      if (!ta || !bubble) return;

      // Render text: replace tg-spoiler with preview span
      let html = ta.value
        .replace(/&(?!amp;|lt;|gt;|quot;)/g, "&amp;")  // don't double-encode
        .replace(/</g, v => v)    // keep tags as-is for inner render
        ;
      // Actually we want raw HTML (the textarea contains real Telegram HTML)
      // Just sanitise unknown tags and render known ones
      const preview = ta.value
        .replace(/<tg-spoiler>/gi, '<span class="tg-spoiler-preview">')
        .replace(/<\/tg-spoiler>/gi, "</span>");
      bubble.innerHTML = preview || '<span style="opacity:0.35">Текст сообщения появится здесь</span>';

      // Render buttons
      if (btnWrap) {
        btnWrap.innerHTML = _bcRows.filter(r => r.buttons.some(b => b.text)).map(row =>
          `<div class="bc-preview-btn-row">${row.buttons.filter(b => b.text).map(b =>
            `<div class="bc-preview-btn">${esc(b.text)}</div>`).join("")}</div>`
        ).join("");
      }
    }

    async function sendBroadcast() {
      const textarea = document.getElementById("broadcastText");
      const btn = document.getElementById("broadcastSendBtn");
      const text = textarea.value.trim();
      if (!text) { if (tg) tg.showAlert("Введи текст сообщения."); return; }

      // Collect valid button rows
      const buttons = _bcRows
        .map(row => row.buttons.filter(b => b.text.trim() && b.url.trim()))
        .filter(row => row.length > 0);

      const confirmed = await confirmAction(
        `Отправить это сообщение всем активным пользователям?\n\n"${text.replace(/<[^>]+>/g,"").slice(0,200)}${text.length > 200 ? "…" : ""}"`
      );
      if (!confirmed) return;
      btn.disabled = true; btn.textContent = "⏳ Отправляем…";
      try {
        const res = await fetch("/app/api/admin/broadcast", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ initData, text, buttons: buttons.length ? buttons : null })
        });
        if (!res.ok) throw new Error();
        const data = await res.json();
        showToast(`✅ Отправлено: ${data.sent} из ${data.total_recipients}`);
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        textarea.value = "";
        _bcRows = [];
        _renderBcRows();
        _updateBroadcastPreview();
        document.getElementById("charCount").textContent = "0 / 4096";
      } catch { if (tg) tg.showAlert("Не удалось отправить. Попробуй ещё раз."); }
      finally {
        btn.disabled = false;
        const activeCount = overview ? overview.users.filter(u => !u.is_blocked).length : "—";
        btn.textContent = `Отправить всем (${activeCount} польз.)`;
      }
    }

    /* ── Action log ── */
    async function loadActionLog(page) {
      actionLogPage = page;
      const content  = document.getElementById("content");
      const subtitle = document.getElementById("subtitle");
      subtitle.textContent = "История действий администратора";
      content.innerHTML = `<div class="empty skeleton"><span class="big-emoji">📜</span>Загружаем журнал…</div>`;
      try {
        const res = await fetch("/app/api/admin/action_log", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData, page})
        });
        if (!res.ok) throw new Error();
        actionLogData = await res.json();
        if (currentTab !== "log") return;
        content.innerHTML = renderActionLog(actionLogData);
        attachLogPagerHandlers();
      } catch {
        if (currentTab !== "log") return;
        content.innerHTML = `<div class="error"><span class="big-emoji">⚠️</span>Не удалось загрузить журнал.</div>`;
      }

    const ACTION_META = {
      update_settings: { label: "Изменение настроек", dot: "settings" },
      broadcast:       { label: "Рассылка",            dot: "broadcast" },
    };

    function renderActionLog(data) {
      if (!data.entries.length) {
        return `<div class="empty"><span class="big-emoji">📜</span>Журнал пока пуст.</div>`;
      }
      const items = data.entries.map(e => {
        const meta = ACTION_META[e.action] || { label: esc(e.action), dot: "other" };
        return `
          <div class="log-item">
            <div class="log-dot ${meta.dot}"></div>
            <div class="log-body">
              <div class="log-top">
                <span class="log-action">${meta.label}</span>
                <span class="log-time">${esc(fmtDate(e.created_at))}</span>
              </div>
              ${e.admin_username ? `<div class="log-admin">@${esc(e.admin_username)}</div>` : ""}
              ${e.target_owner_telegram_id ? `<div class="log-details">Пользователь ID: ${esc(e.target_owner_telegram_id)}</div>` : ""}
              ${e.details ? `<div class="log-details">${esc(e.details)}</div>` : ""}
            </div>
          </div>
        `;
      }).join("");
      const totalPages = Math.max(1, Math.ceil(data.total / data.page_size));
      return `<div class="log-list">${items}</div>` + renderPager(data.page, totalPages, "log");
    }

    function renderPager(page, totalPages, kind) {
      return `
        <div class="pager">
          <button class="pager-btn" data-pager="${kind}" data-page="${page-1}" ${page<=1?"disabled":""}>← Назад</button>
          <span>Стр. ${page} из ${totalPages}</span>
          <button class="pager-btn" data-pager="${kind}" data-page="${page+1}" ${page>=totalPages?"disabled":""}>Вперёд →</button>
        </div>
      `;
    }

    function attachLogPagerHandlers() {
      document.querySelectorAll("[data-pager='log']").forEach(btn => {
        btn.addEventListener("click", () => loadActionLog(Number(btn.dataset.page)));
      });
    }
