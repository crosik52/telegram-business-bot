    outline: none; width: 0;
  }
  .crash-auto-cashout-input::placeholder { color: var(--ci-muted); }

  /* ── Mines FOMO reveal label ── */
  .mines-fomo-label {
    text-align: center; font-size: 11px; color: var(--ci-muted);
    margin-bottom: 4px; letter-spacing: 0.3px; font-weight: 600;
    text-transform: uppercase;
  }

  /* ── Quest tab colours ── */

  /* ── Quest card ── */
  .quest-card {
    background: rgba(255,255,255,0.05); border-radius: var(--card-radius);
    padding: 14px 15px; margin-bottom: 11px;
    display: flex; align-items: center; gap: 13px;
    animation: riseIn 0.32s ease backwards;
    border: 1px solid transparent;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow:
      0 2px 14px rgba(0,0,0,0.22),
      0 0 0 0.5px rgba(255,255,255,0.12),
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 -0.5px 0 rgba(0,0,0,0.20);
  }
  .quest-card.claimed { opacity: 0.5; }
  .quest-card.ready   { border-color: rgba(52,199,89,0.4); }
  .quest-emoji  { font-size: 28px; flex-shrink: 0; }
  .quest-body   { flex: 1; min-width: 0; }
  .quest-title  { font-size: 14px; font-weight: 700; }
  .quest-desc   { font-size: 11.5px; color: var(--hint); margin-top: 2px; line-height: 1.35; }
  .quest-prog-wrap { display: flex; align-items: center; gap: 7px; margin-top: 7px; }
  .quest-prog-track { flex: 1; height: 5px; border-radius: 3px; background: rgba(120,120,128,0.13); overflow: hidden; }
  .quest-prog-fill  { height: 100%; border-radius: 3px; background: var(--green); transition: width 0.55s ease; }
  .quest-prog-lbl   { font-size: 10.5px; color: var(--hint); flex-shrink: 0; }
  .quest-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .quest-reward { font-size: 12.5px; font-weight: 700; color: var(--orange); }
  .quest-claim-btn {
    border: none; border-radius: 10px; padding: 5px 11px;
    font-size: 12px; font-weight: 700;
    background: var(--green); color: #fff;
    transition: transform 0.1s, opacity 0.2s;
    touch-action: manipulation;
  }
  .quest-claim-btn:active { transform: scale(0.93); }
  .quest-claim-btn:disabled { opacity: 0.35; background: rgba(120,120,128,0.18); color: var(--hint); }
  .quest-done-badge { font-size: 20px; }
  .quest-claim-all-btn {
    display: block; width: 100%; margin-bottom: 10px;
    border: none; border-radius: 14px; padding: 11px 16px;
    font-size: 14px; font-weight: 700;
    background: linear-gradient(135deg, var(--green), #30d158);
    color: #fff; cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    touch-action: manipulation; box-shadow: 0 2px 8px rgba(52,199,89,0.35);
  }
  .quest-claim-all-btn:active { transform: scale(0.97); }
  .quest-claim-all-btn:disabled { opacity: 0.45; box-shadow: none; }

  /* ── Leaderboard ── */
  .lb-entry {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--secondary-bg); border-radius: 16px;
    margin-bottom: 8px; box-shadow: var(--shadow);
    animation: riseIn 0.3s ease backwards;
  }
  .lb-entry.me { border: 1.5px solid rgba(36,129,204,0.38); background: rgba(36,129,204,0.05); }
  .lb-rank   { font-size: 15px; font-weight: 900; width: 26px; text-align: center; flex-shrink: 0; }
  .lb-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; flex-shrink: 0; position: relative; overflow: hidden; }
  .lb-body   { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .lb-name   { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  .lb-sub-badge { font-size: 10px; font-weight: 800; border-radius: 4px; padding: 1px 5px; letter-spacing: 0.3px; flex-shrink: 0; }
  .lb-sub-badge.premium { background: rgba(90,200,250,0.18); color: #5ac8fa; }
  .lb-sub-badge.vip     { background: rgba(255,214,10,0.18);  color: #ffd60a; }
  .lb-coins  { font-size: 12px; font-weight: 700; color: var(--orange); flex-shrink: 0; }
  .lb-my-rank-note { text-align: center; font-size: 12.5px; color: var(--hint); margin: 4px 0 12px; }

  /* ── Casino wins leaderboard ── */
  .casino-wins-period-bar {
    display: flex; gap: 6px; margin-bottom: 12px;
  }
  .casino-wins-period-btn {
    flex: 1; border: 1px solid rgba(120,120,128,0.22);
    border-radius: 10px; padding: 7px 0;
    background: transparent; color: var(--hint);
    font-family: inherit; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
  }
  .casino-wins-period-btn.active {
    background: rgba(124,108,255,0.18);
    border-color: rgba(124,108,255,0.5);
    color: #c5baff;
  }
  .casino-win-row {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; border-radius: 13px;
    background: var(--secondary-bg);
    margin-bottom: 5px;
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    box-shadow: 0 0 0 0.5px rgba(120,120,128,0.14), inset 0 1px 0 rgba(255,255,255,0.08);
    animation: riseIn 0.3s ease backwards;
  }
  .theme-dark .casino-win-row {
    background: rgba(255,255,255,0.05);
    box-shadow: 0 0 0 0.5px rgba(255,255,255,0.10), inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .casino-win-rank  { font-size: 14px; width: 24px; text-align: center; flex-shrink: 0; font-weight: 900; color: var(--hint); }
  .casino-win-game  { font-size: 18px; flex-shrink: 0; }
  .casino-win-body  { flex: 1; min-width: 0; }
  .casino-win-name  { font-size: 12.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .casino-win-meta  { font-size: 10px; color: var(--hint); margin-top: 1px; }
  .casino-win-right { text-align: right; flex-shrink: 0; }
  .casino-win-net   { font-size: 13px; font-weight: 900; color: #34c759; }
  .casino-win-mult  { font-size: 10px; color: var(--hint); margin-top: 1px; }

  /* ── Subscription card ── */
  .sub-card {
    border-radius: var(--card-radius);
    margin-bottom: 14px;
    overflow: hidden; animation: riseIn 0.3s ease backwards;
    background: var(--secondary-bg);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow:
      0 2px 12px rgba(0,0,0,0.08),
      0 0 0 0.5px rgba(120,120,128,0.18),
      inset 0 1px 0 rgba(255,255,255,0.10),
      inset 0 -0.5px 0 rgba(0,0,0,0.06);
  }
  .theme-dark .sub-card {
    background: rgba(255,255,255,0.055);
    box-shadow:
      0 2px 14px rgba(0,0,0,0.22),
      0 0 0 0.5px rgba(255,255,255,0.12),
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 -0.5px 0 rgba(0,0,0,0.20);
  }
  .sub-card.active {
    background: linear-gradient(145deg, #5856d6 0%, #2481cc 100%);
    color: #fff;
  }
  .sub-card-header {
    display: flex; align-items: center; gap: 14px;
    padding: 18px 16px 14px;
  }
  .sub-star-icon {
    font-size: 36px; line-height: 1; flex-shrink: 0;
    filter: drop-shadow(0 2px 6px rgba(88,86,214,.4));
  }
  .sub-card-title-wrap { flex: 1; min-width: 0; }
  .sub-active-badge {
    display: inline-block;
    background: rgba(255,255,255,.22); color: #fff;
    font-size: 10.5px; font-weight: 700;
    padding: 2px 9px; border-radius: 6px;
    margin-bottom: 5px; letter-spacing: .3px; text-transform: uppercase;
  }
  .sub-card-title  { font-size: 18px; font-weight: 900; line-height: 1.2; }
  .sub-card-price  { font-size: 13px; color: var(--hint); margin-top: 4px; font-weight: 600; }
  .sub-card.active .sub-card-price { color: rgba(255,255,255,.7); }
  .sub-card-desc {
    font-size: 12.5px; color: var(--hint);
    padding: 0 16px 12px; line-height: 1.55;
  }
  .sub-days-row {
    display: flex; align-items: baseline; gap: 4px;
    padding: 0 16px 8px;
  }
  .sub-days-num   { font-size: 32px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
  .sub-days-label { font-size: 15px; opacity: .75; font-weight: 600; }
  .sub-progress-track {
    height: 5px; background: rgba(255,255,255,.18);
    margin: 0 16px 14px; border-radius: 4px; overflow: hidden;
  }
  .sub-progress-fill {
    height: 100%; background: rgba(255,255,255,.9); border-radius: 4px;
    transition: width .6s cubic-bezier(.4,0,.2,1);
  }
  .sub-divider       { height: 1px; background: rgba(255,255,255,.12); margin: 0 16px 14px; }
  .sub-divider.light { background: rgba(120,120,128,.12); }
  .sub-benefit-list  { padding: 2px 16px 16px; display: flex; flex-direction: column; gap: 9px; }
  .sub-benefit-row {
    display: flex; align-items: center; gap: 11px;
    font-size: 13.5px; font-weight: 500; line-height: 1.35;
  }
  .sub-card.active .sub-benefit-row { color: rgba(255,255,255,.88); }
  .sub-benefit-ico { font-size: 17px; flex-shrink: 0; width: 24px; text-align: center; }
  .sub-buy-btn {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    width: calc(100% - 32px); margin: 6px 16px 10px; padding: 14px;
    border: none; border-radius: 13px;
    background: linear-gradient(135deg, #5856d6 0%, #2481cc 100%);
    color: #fff; font-size: 15px; font-weight: 800;
    touch-action: manipulation; transition: transform .12s, opacity .2s; cursor: pointer;
    box-shadow: 0 4px 16px rgba(88,86,214,.38);

  .sub-buy-btn:active   { transform: scale(0.97); }
  .sub-buy-btn:disabled { opacity: .5; box-shadow: none; }
  .sub-buy-star { font-size: 18px; }
  .sub-buy-note {
    text-align: center; font-size: 11.5px; color: var(--hint);
    padding: 0 16px 16px; line-height: 1.5;
  }

  /* ── Subscription purchase redesign ───────────────────────────────────── */
  .sub-purchase-wrap { animation: riseIn 0.3s ease backwards; }

  .sub-hero-card {
    border-radius: var(--card-radius); margin-bottom: 12px;
    background: linear-gradient(140deg, #3a3399 0%, #1c63b0 100%);

    box-shadow: 0 6px 28px rgba(88,86,214,.32);

  .sub-hero-card::before {
    content: ''; position: absolute; top: -40px; right: -40px;

    background: rgba(255,255,255,.06); border-radius: 50%; pointer-events: none;
  }
  .sub-hero-card::after {
    content: ''; position: absolute; bottom: -30px; left: -30px;
    width: 100px; height: 100px;
    background: rgba(255,255,255,.04); border-radius: 50%; pointer-events: none;
  }
  .sub-hero-emoji { font-size: 48px; line-height: 1; display: block; margin-bottom: 10px;
    filter: drop-shadow(0 4px 12px rgba(255,215,0,.4)); }
  .sub-hero-title { font-size: 26px; font-weight: 900; color: #fff; letter-spacing: -0.5px; }
  .sub-hero-desc  { font-size: 13px; color: rgba(255,255,255,.72);
    margin-top: 6px; line-height: 1.55; max-width: 280px; margin-left: auto; margin-right: auto; }

  /* Plan picker row */
  .sub-plans-row {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-bottom: 12px; padding-top: 14px; /* room for badges */
  }
  .sub-plan-card {
    border: 1.5px solid transparent;
    border-radius: 14px; padding: 14px 6px 12px;
    text-align: center; cursor: pointer; position: relative;
    background: var(--secondary-bg);
    transition: border-color .16s, background .16s, box-shadow .16s;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow:
      0 2px 12px rgba(0,0,0,0.08),
      0 0 0 0.5px rgba(120,120,128,0.18),
      inset 0 1px 0 rgba(255,255,255,0.10),
      inset 0 -0.5px 0 rgba(0,0,0,0.06);
  }
  .theme-dark .sub-plan-card {
    background: rgba(255,255,255,0.055);
    box-shadow:
      0 2px 14px rgba(0,0,0,0.22),
      0 0 0 0.5px rgba(255,255,255,0.12),
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 -0.5px 0 rgba(0,0,0,0.20);

  .sub-plan-badge {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);

    color: #fff; font-size: 9px; font-weight: 800;
    padding: 3px 9px; border-radius: 20px; white-space: nowrap;
    letter-spacing: .3px; z-index: 1; line-height: 1.4;

  .sub-plan-name {
    font-size: 10px; font-weight: 700; color: var(--hint);
    text-transform: uppercase; letter-spacing: .7px;
    margin-bottom: 8px; line-height: 1;

  .sub-plan-stars {
    font-size: 20px; font-weight: 900; line-height: 1;
    display: flex; align-items: center; justify-content: center; gap: 3px;
  }
  .sub-plan-stars-ico { font-size: 13px; }
  .sub-plan-perday { font-size: 10px; color: var(--hint); margin-top: 5px; font-weight: 500; }
  .sub-plan-save {
    display: inline-block; margin-top: 6px;
    background: rgba(52,199,89,.15); border: 1px solid rgba(52,199,89,.35);
    color: #34c759; font-size: 9.5px; font-weight: 800;
    padding: 2px 7px; border-radius: 6px; line-height: 1.4;

  /* Benefits section */
  .sub-bene-section {
    background: var(--secondary-bg); border-radius: var(--card-radius);
    overflow: hidden; margin-bottom: 12px;
  }
  .sub-bene-header {
    padding: 13px 16px 10px; border-bottom: 1px solid var(--ci-border, rgba(120,120,128,.14));
  }
  .sub-bene-title {
    font-size: 11px; font-weight: 700; color: var(--hint);

  .sub-bene-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 1px; background: var(--ci-border, rgba(120,120,128,.14));

    background: var(--secondary-bg); border-radius: var(--card-radius);
    padding: 14px 16px 16px; margin-bottom: 10px;

  .sub-tier-row {
    display: grid; grid-template-columns: 1fr 1fr;

    display: flex; gap: 7px; padding: 10px 16px 8px;

    background: var(--bg); border-bottom: 1px solid rgba(255,255,255,.055);

    flex: 1; padding: 8px 4px; border-radius: 20px; border: none;

  /* VIP hero card — gold/purple gradient */
  .sub-vip-hero {
    border-radius: var(--card-radius); margin-bottom: 12px;
    background: linear-gradient(140deg, #4a1a8f 0%, #9c4f00 60%, #c47800 100%);

    box-shadow: 0 6px 28px rgba(180,120,0,.35);

  .sub-vip-hero::before {
    content: ''; position: absolute; top: -40px; right: -40px;

  /* VIP plan card gold selection */
  .sub-plan-card.vip-selected {
    border-color: #c47800;
    background: rgba(196,120,0,.11);
    box-shadow: 0 0 0 1px #c47800 inset, 0 4px 14px rgba(196,120,0,.22);
  }
  .sub-plan-card.vip-featured { border-color: rgba(196,120,0,.45); }
  .sub-plan-badge.vip { background: linear-gradient(135deg, #9c4f00, #c47800); }
  .sub-plan-save.vip  {
    background: rgba(196,120,0,.15); border-color: rgba(196,120,0,.35); color: #c47800;
  }

  /* VIP buy button — gold */
  .sub-buy-btn.vip {
    background: linear-gradient(135deg, #9c4f00, #c47800);
    box-shadow: 0 4px 16px rgba(180,120,0,.42);
  }

  /* VIP active card */
  .sub-card.vip-active {
    background: linear-gradient(140deg, #2a0f55, #5a2e00);
    border: 1.5px solid rgba(196,120,0,.3);
  }
  .sub-active-badge.vip {
    background: linear-gradient(135deg, #9c4f00, #c47800);
  }

  /* VIP benefits grid */
  .vip-bene-header { border-bottom: 1px solid rgba(196,120,0,.2); }
  .vip-bene-title { color: #c47800; }

  /* AI analysis teaser card */
  .ai-teaser-card {
    border-radius: var(--card-radius); overflow: hidden;
    background: var(--secondary-bg); box-shadow: var(--shadow);
    margin-bottom: 12px; border: 1.5px solid rgba(88,86,214,.2);
  }
  .ai-teaser-header {
    background: linear-gradient(135deg, rgba(88,86,214,.15), rgba(52,199,89,.08));
    padding: 14px 16px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .ai-teaser-ico { font-size: 28px; }
  .ai-teaser-title { font-size: 15px; font-weight: 800; }
  .ai-teaser-sub   { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .ai-sections-preview {
    padding: 10px 14px 14px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  }
  .ai-sec-chip {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: var(--hint);
    background: rgba(120,120,128,.08); border-radius: 9px;
    padding: 6px 10px;
  }
  .ai-teaser-btn {
    width: calc(100% - 28px); margin: 0 14px 14px;
    border: none; border-radius: 13px; padding: 12px;
    font-size: 14px; font-weight: 800;
    background: linear-gradient(135deg, #5856d6, #2481cc);
    color: #fff; touch-action: manipulation; cursor: pointer;
  }
  .ai-remaining-hint {
    font-size: 11px; color: var(--hint); text-align: center;
    padding: 0 14px 12px; margin-top: -4px;
  }

  /* ── Pet section ── */
  /* ── Pet system — redesigned ─────────────────────────────── */
  @keyframes petFloat {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  @keyframes bubblePop {
    0%   { opacity:0; transform: scale(0.7) translateY(6px); }
    100% { opacity:1; transform: scale(1) translateY(0); }
  }
  @keyframes statPulse {
    0%,100% { opacity:1; }
    50%      { opacity:0.55; }
  }

  .pet-section { margin-bottom: 16px; }
  .pet-section-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 2px 10px; gap: 8px;
  }
  .pet-section-left { display: flex; flex-direction: column; gap: 2px; }
  .pet-section-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.7px; color: var(--hint);
    display: flex; align-items: center; gap: 5px;
  }
  .pet-section-age {
    font-size: 10.5px; color: var(--hint); opacity: 0.65; min-height: 14px;
  }
  .pet-refresh-btn {
    border: none; background: rgba(120,120,128,0.12); border-radius: 50%;
    width: 32px; height: 32px; font-size: 15px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.15s;
  }
  .pet-refresh-btn:active { transform: rotate(180deg) scale(0.9); background: rgba(120,120,128,0.22); }
  .pet-adopt-card {
    display: flex; align-items: center; gap: 10px;
    width: 100%; border: 1.5px dashed rgba(52,199,89,0.35);
    background: rgba(52,199,89,0.06); border-radius: 16px;
    padding: 13px 16px; margin-bottom: 10px; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    flex-direction: row; text-align: left;
  }
  .pet-adopt-card:active { background: rgba(52,199,89,0.12); border-color: rgba(52,199,89,0.55); }
  .pet-card {
    background: var(--secondary-bg); border-radius: var(--card-radius);
    padding: 16px 14px 14px; margin-bottom: 10px;
    animation: riseIn 0.3s ease backwards;
    position: relative; overflow: hidden;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow:
      0 2px 12px rgba(0,0,0,0.08),
      0 0 0 0.5px rgba(120,120,128,0.18),
      inset 0 1px 0 rgba(255,255,255,0.10),
      inset 0 -0.5px 0 rgba(0,0,0,0.06);
  }
  .theme-dark .pet-card {
    background: rgba(255,255,255,0.055);
    box-shadow:
      0 2px 14px rgba(0,0,0,0.22),
      0 0 0 0.5px rgba(255,255,255,0.12),
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 -0.5px 0 rgba(0,0,0,0.20);
  }
  .pet-card::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,149,0,0.04) 0%, rgba(52,199,89,0.03) 100%);
    pointer-events: none;
  }
  .pet-card.dead { opacity: 0.55; }
 .pet-revive-btn {
   margin-top: 8px; width: 100%; padding: 7px 12px;
   background: linear-gradient(135deg, #7c3aed, #a855f7);
   color: #fff; border: none; border-radius: 10px;
   font-size: 13px; font-weight: 700; cursor: pointer;
   display: flex; align-items: center; justify-content: center; gap: 6px;
 }
 .pet-revive-btn:active { opacity: 0.85; transform: scale(0.98); }
 .pet-revive-btn small { font-size: 11px; font-weight: 400; opacity: 0.8; }
 .pet-revive-exhausted {
   margin-top: 6px; font-size: 11px; color: var(--hint); text-align: left;
 }

  /* hero section — centered avatar + speech bubble */
  .pet-hero { display: flex; flex-direction: column; align-items: center; padding: 8px 0 14px; }
  .pet-bubble-wrap { position: relative; margin-bottom: 4px; }
  .pet-speech-bubble {
    background: var(--secondary-bg);
    border: 1.5px solid rgba(120,120,128,0.18);
    border-radius: 14px; padding: 6px 12px;
    font-size: 12.5px; color: var(--text); white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    animation: bubblePop 0.3s cubic-bezier(.34,1.56,.64,1) backwards;
  }
  .pet-speech-bubble::after {
    content: ""; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: rgba(120,120,128,0.18);
  }
  .pet-speech-bubble::before {
    content: ""; position: absolute; bottom: -5.5px; left: 50%; transform: translateX(-50%);
    border: 4.5px solid transparent;
    border-top-color: var(--secondary-bg);
    z-index: 1;
  }

  .pet-avatar-circle {
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(255,149,0,0.09);
    display: flex; align-items: center; justify-content: center;
    animation: petFloat 3s ease-in-out infinite;
    margin: 10px 0 8px; position: relative;
  }
  .pet-avatar  { font-size: 48px; line-height: 1; display: block; }
  .pet-level-badge {
    position: absolute; bottom: -2px; right: -4px;
    background: var(--link); color: #fff;
    font-size: 9px; font-weight: 800; border-radius: 8px; padding: 2px 6px;
    border: 2px solid var(--secondary-bg);
    white-space: nowrap;
  }

  .pet-name-centered { font-size: 17px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.2px; }
  .pet-badges-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .pet-personality {
    font-size: 11px; background: rgba(120,120,128,0.12);
    border-radius: 7px; padding: 2px 7px;
  }
  .pet-stage-badge {
    font-size: 11px; background: rgba(255,149,0,0.12); color: var(--orange);
    border-radius: 7px; padding: 2px 7px;
  }
  .pet-with-lbl {
    font-size: 11.5px; color: var(--hint); margin-top: 5px;
  }

  /* stat bars — taller and more expressive */
  .pet-stats { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .pet-stat-row { display: flex; align-items: center; gap: 8px; }
  .pet-stat-icon { font-size: 13px; width: 16px; flex-shrink: 0; }
  .pet-stat-label { font-size: 11.5px; color: var(--hint); width: 54px; flex-shrink: 0; }
  .pet-stat-track { flex: 1; height: 8px; border-radius: 6px; background: rgba(120,120,128,0.12); overflow: hidden; }
  .pet-stat-fill  { height: 100%; border-radius: 6px; transition: width 0.7s cubic-bezier(.4,0,.2,1); }
  .pet-stat-fill.pulsing { animation: statPulse 1.8s ease-in-out infinite; }
  .pet-stat-lbl   { font-size: 11px; font-weight: 700; flex-shrink: 0; width: 32px; text-align: right; }

  /* xp bar */
  .pet-xp-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .pet-xp-label { font-size: 11px; color: var(--hint); flex-shrink: 0; }
  .pet-xp-track { flex: 1; height: 6px; border-radius: 4px; background: rgba(120,120,128,0.12); overflow: hidden; }
  .pet-xp-fill  { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #f59e0b, #f97316); transition: width 0.7s cubic-bezier(.4,0,.2,1); }
  .pet-xp-lbl   { font-size: 10.5px; color: var(--hint); flex-shrink: 0; }

  /* action buttons — 2×2 grid */
  .pet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pet-action-btn {
    border: none; border-radius: 13px; padding: 10px 8px;
    font-size: 12.5px; font-weight: 700; line-height: 1.3;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: transform 0.1s, opacity 0.2s; touch-action: manipulation;
    min-height: 52px; justify-content: center;
  }
  .pet-action-btn:active   { transform: scale(0.93); }
  .pet-action-btn:disabled { opacity: 0.32; background: rgba(120,120,128,0.09) !important; color: var(--hint) !important; }
  .pet-btn-icon  { font-size: 18px; }
  .pet-btn-label { font-size: 11.5px; font-weight: 700; }
  .pet-btn-sub   { font-size: 10px; opacity: 0.75; font-weight: 600; }
  .pet-btn-feed   { background: rgba(255,149,0,0.13); color: var(--orange); }
  .pet-btn-play   { background: rgba(52,199,89,0.12); color: var(--green); }
  .pet-btn-cuddle { background: rgba(191,90,242,0.12); color: #bf5af2; }
  .pet-btn-rename { background: rgba(36,129,204,0.12); color: var(--link); }

  .pet-empty       { text-align: center; padding: 18px 8px 22px; }
  .pet-empty-emoji { font-size: 46px; margin-bottom: 10px; }
  .pet-empty-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .pet-empty-sub   { font-size: 13px; color: var(--hint); margin-bottom: 18px; line-height: 1.45; }
  .pet-adopt-cta {
    border: none; border-radius: 14px; padding: 11px 24px;
    font-size: 14px; font-weight: 700;
    background: var(--green); color: #fff; touch-action: manipulation;
  }
  .pet-add-more {
    border: none; border-radius: 10px; padding: 3px 10px;
    font-size: 12px; font-weight: 600; margin-left: auto;
    background: rgba(52,199,89,0.13); color: var(--green); touch-action: manipulation;
  }
  /* death card */
  .pet-dead-row { display: flex; align-items: center; gap: 12px; }
  .pet-dead-body { flex: 1; min-width: 0; }
  .pet-dead-cause { font-size: 11.5px; color: var(--hint); margin-top: 2px; }

  /* ── Pet tabs (v3) ── */
  .pet-tabs-row {
    display: flex; gap: 3px; margin-bottom: 12px;
    background: rgba(0,0,0,0.14); border-radius: 11px; padding: 3px;
  }
  .pet-tab-btn {
    flex: 1; padding: 6px 2px; border-radius: 8px; border: none;
    font-size: 11px; font-weight: 700; color: var(--hint);
    background: transparent; cursor: pointer; touch-action: manipulation;
    transition: all 0.15s; font-family: 'Geist', system-ui, sans-serif;
    white-space: nowrap; overflow: hidden;
  }
  .pet-tab-btn.active { background: var(--secondary-bg); color: var(--text); box-shadow: 0 1px 5px rgba(0,0,0,0.14); }
  .pet-tab-btn:active { transform: scale(0.94); }

  /* achievements */
  .pet-rel-bonus-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 8px;
    background: rgba(255,200,60,0.15); color: #c8960a;
    margin-bottom: 7px;
  }
  [data-theme="dark"] .pet-rel-bonus-badge { color: #f5c842; background: rgba(245,200,66,0.18); }
  .pet-rel-bonus-label { font-weight: 400; opacity: 0.75; }

  .pet-last-fed-lbl {
   font-size: 12px; color: var(--hint); margin: 6px 0 8px;
   padding: 5px 10px; background: rgba(120,120,128,0.07);
   border-radius: 8px; line-height: 1.4;
 }
 .pet-last-fed-lbl b { color: var(--text); font-weight: 600; }
 .pet-care-log {
   font-size: 11.5px; color: var(--hint); margin-top: 8px;
   padding: 5px 10px; background: rgba(120,120,128,0.06);
   border-radius: 8px; line-height: 1.5;
 }
 .pet-care-log b { color: var(--text); font-weight: 600; }
 .pet-achievements-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .pet-achievement {
    font-size: 10px; font-weight: 700; padding: 2px 7px;
    border-radius: 7px; background: rgba(124,108,255,0.10); color: var(--ci-accent);
  }

  /* food shop tab */
  .pet-food-intro { font-size: 11px; color: var(--hint); margin-bottom: 8px; text-align: center; }
  .pet-food-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pet-food-grid > .pet-food-item:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .pet-food-item {
    background: var(--secondary-bg); border-radius: 12px;
    padding: 10px 8px 8px; text-align: center;
    border: 1.5px solid var(--ci-border); position: relative;
  }
  .pet-food-item.on-cd { opacity: 0.55; }
  .pet-food-emoji { font-size: 28px; line-height: 1.2; margin-bottom: 2px; }
  .pet-food-name { font-size: 12px; font-weight: 700; }
  .pet-food-bonus { font-size: 10px; color: var(--ci-accent); font-weight: 600; margin-top: 1px; }
  .pet-food-buy {
    margin-top: 6px; width: 100%; border: none; border-radius: 8px; padding: 6px 2px;
    font-size: 11.5px; font-weight: 800;
    background: rgba(255,149,0,0.13); color: var(--orange);
    cursor: pointer; transition: transform 0.12s, opacity 0.18s;
    font-family: 'Geist', system-ui, sans-serif; touch-action: manipulation;
  }
  .pet-food-buy:active:not(:disabled) { transform: scale(0.92); }
  .pet-food-buy:disabled { opacity: 0.32; cursor: default; }

  /* skills tab */
  .pet-skill-intro { font-size: 11px; color: var(--hint); margin-bottom: 8px; text-align: center; }
  .pet-skill-list { display: flex; flex-direction: column; gap: 8px; }
  .pet-skill-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--secondary-bg); border-radius: 12px; padding: 10px 12px;
  }
  .pet-skill-emoji { font-size: 22px; flex-shrink: 0; }
  .pet-skill-body { flex: 1; min-width: 0; }
  .pet-skill-name { font-size: 12.5px; font-weight: 700; }
  .pet-skill-desc { font-size: 10.5px; color: var(--hint); margin-top: 1px; line-height: 1.3; }
  .pet-skill-dots { display: flex; gap: 4px; margin-top: 5px; }
  .pet-skill-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(120,120,128,0.2); }
  .pet-skill-dot.filled { background: var(--ci-accent); }
  .pet-skill-upg-btn {
    border: none; border-radius: 9px; padding: 7px 10px;
    font-size: 11px; font-weight: 800; flex-shrink: 0;
    background: rgba(124,108,255,0.14); color: var(--ci-accent);
    cursor: pointer; transition: all 0.14s; white-space: nowrap;
    font-family: 'Geist', system-ui, sans-serif; touch-action: manipulation;
  }
  .pet-skill-upg-btn:active:not(:disabled):not(.maxed) { transform: scale(0.92); }
  .pet-skill-upg-btn:disabled { opacity: 0.32; cursor: default; }
  .pet-skill-upg-btn.maxed { background: rgba(52,199,89,0.12); color: var(--green); cursor: default; opacity: 1; }

  /* leaderboard tab */
  .pet-top-intro { font-size: 11px; color: var(--hint); margin-bottom: 8px; text-align: center; }
  .pet-lb-list { display: flex; flex-direction: column; gap: 5px; }
  .pet-lb-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 10px; background: var(--secondary-bg);
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    box-shadow: 0 0 0 0.5px rgba(120,120,128,0.14), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .theme-dark .pet-lb-row {
    background: rgba(255,255,255,0.05);
    box-shadow: 0 0 0 0.5px rgba(255,255,255,0.10), inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .pet-lb-rank { font-size: 14px; width: 24px; flex-shrink: 0; text-align: center; font-weight: 900; color: var(--hint); }
  .pet-lb-emoji { font-size: 22px; flex-shrink: 0; }
  .pet-lb-body { flex: 1; min-width: 0; }
  .pet-lb-name { font-size: 12.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pet-lb-meta { font-size: 10px; color: var(--hint); margin-top: 1px; }
  .pet-lb-level { font-size: 15px; font-weight: 900; color: var(--ci-accent); flex-shrink: 0; }

  /* ── Shop tab ────────────────────────────────────────────── */
  #shopContent { padding-bottom: 20px; }
  /* ── Shop: balance bar ── */
  .shop-balance-bar {
    background: linear-gradient(135deg, rgba(15,23,42,0.82) 0%, rgba(30,27,75,0.82) 100%);
    border-radius: var(--card-radius); padding: 18px 16px 14px;
    margin-bottom: 14px; text-align: center;
    position: relative; overflow: hidden;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow:
      0 2px 14px rgba(0,0,0,0.22),
      0 0 0 0.5px rgba(255,255,255,0.12),
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 -0.5px 0 rgba(0,0,0,0.20);
  }
  .shop-coin-amount {
    font-size: 32px; font-weight: 900; letter-spacing: -1px;
    color: #f59e0b; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .shop-coin-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 3px; }
  .shop-earn-chips { display: flex; gap: 6px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .shop-earn-chip {
    background: rgba(255,255,255,0.07); border-radius: 20px;
    padding: 4px 10px; font-size: 11px; color: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* ── Shop: section title ── */
  .shop-section-title {
    font-size: 10px; font-weight: 800; margin: 16px 0 8px;
    letter-spacing: 0.8px; text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    display: flex; align-items: center; gap: 6px;
  }

  /* ── Coin packages (Stars → Coins) ── */
  .coin-pkg-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-bottom: 4px;
  }
  .coin-pkg-card {
    border-radius: 16px; padding: 14px 12px 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid transparent;
    display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
    position: relative; overflow: hidden;
    animation: riseIn 0.25s ease backwards;
    transition: border-color 0.15s;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow:
      0 2px 14px rgba(0,0,0,0.22),
      0 0 0 0.5px rgba(255,255,255,0.12),
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 -0.5px 0 rgba(0,0,0,0.20);
  }
  .coin-pkg-card.featured {
    border-color: rgba(245,158,11,0.4);
    background: linear-gradient(145deg,rgba(245,158,11,0.08),rgba(234,88,12,0.06));
  }
  .coin-pkg-card.top {
    border-color: rgba(168,85,247,0.4);
    background: linear-gradient(145deg,rgba(168,85,247,0.08),rgba(108,92,231,0.06));
  }
  .coin-pkg-bonus {
    position: absolute; top: 8px; right: 8px;
    font-size: 9px; font-weight: 900; letter-spacing: 0.3px;
    padding: 2px 6px; border-radius: 6px;
    background: rgba(245,158,11,0.22); color: #f59e0b;
  }
  .coin-pkg-card.top .coin-pkg-bonus { background: rgba(168,85,247,0.25); color: #c084fc; }
  .coin-pkg-ico { font-size: 28px; line-height: 1; margin-bottom: 2px; }
  .coin-pkg-amount { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; color: #f59e0b; }
  .coin-pkg-label { font-size: 10.5px; color: rgba(255,255,255,0.45); font-weight: 600; }
  .coin-pkg-btn {
    margin-top: 8px; border: none; border-radius: 10px; padding: 8px 0; width: 100%;
    font-size: 12px; font-weight: 800; cursor: pointer;
    touch-action: manipulation; transition: transform 0.1s, opacity 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    background: rgba(255,255,255,0.1); color: #fff;
  }
  .coin-pkg-card.featured .coin-pkg-btn { background: rgba(245,158,11,0.25); color: #f59e0b; }
  .coin-pkg-card.top .coin-pkg-btn { background: rgba(168,85,247,0.25); color: #c084fc; }
  .coin-pkg-btn:active { transform: scale(0.94); }
  .coin-pkg-btn:disabled { opacity: 0.35; }
  .coin-pkg-stars { font-size: 13px; }

  /* ── Shop: items grid ── */
  .shop-items-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-bottom: 4px;
  }
  .shop-item-wide { grid-column: 1 / -1; }
  .shop-item {
    background: rgba(255,255,255,0.05); border-radius: 14px;
    border: none;
    padding: 13px 10px 11px; display: flex; flex-direction: column;
    align-items: center; gap: 4px; text-align: center; position: relative;
    animation: riseIn 0.25s ease backwards;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow:
      0 2px 14px rgba(0,0,0,0.22),
      0 0 0 0.5px rgba(255,255,255,0.12),
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 -0.5px 0 rgba(0,0,0,0.20);
  }
  .shop-item-wide .shop-item {
    flex-direction: row; text-align: left; gap: 12px; padding: 12px 14px;
  }
  .shop-item-icon { font-size: 28px; line-height: 1; }
  .shop-item-wide .shop-item-icon { font-size: 30px; flex-shrink: 0; }
  .shop-item-body { flex: 1; min-width: 0; }
  .shop-item-name { font-size: 12.5px; font-weight: 700; line-height: 1.3; }
  .shop-item-desc { font-size: 11px; color: var(--hint); margin-top: 2px; line-height: 1.35; }
  .shop-item-price {
    font-size: 11.5px; font-weight: 800; margin-top: 5px;
    background: rgba(245,158,11,0.12); color: #d97706;
    border-radius: 6px; padding: 2px 8px; display: inline-block;
  }
  .shop-buy-btn {
    border: none; border-radius: 9px; padding: 8px 10px;
    font-size: 11.5px; font-weight: 800; margin-top: 6px;
    touch-action: manipulation; transition: transform 0.1s, opacity 0.18s;
    width: 100%; cursor: pointer;
  }
  .shop-item-wide .shop-buy-btn { width: auto; flex-shrink: 0; margin-top: 0; padding: 9px 16px; }
  .shop-buy-btn:active { transform: scale(0.93); }
  .shop-buy-btn:disabled { opacity: 0.35; }
  .shop-buy-amber  { background: rgba(245,158,11,0.16); color: #d97706; }
  .shop-buy-purple { background: rgba(124,58,237,0.15); color: #8b5cf6; }
  .shop-buy-teal   { background: rgba(20,184,166,0.15); color: #14b8a6; }
  .shop-buy-pink   { background: rgba(225,29,72,0.15);  color: #f43f5e; }
  .shop-buy-blue   { background: rgba(59,130,246,0.15); color: #60a5fa; }

  /* ── Active boost banner ── */
  .shop-active-boost {
    background: rgba(20,184,166,0.1); border: 1px solid rgba(20,184,166,0.3);
    border-radius: 14px; padding: 10px 14px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 10px;
    animation: riseIn 0.25s ease;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.12),
      inset 0 -0.5px 0 rgba(0,0,0,0.15);
  }
  .shop-boost-text { font-size: 12.5px; font-weight: 700; color: #2dd4bf; }
  .shop-boost-sub  { font-size: 11px; color: var(--hint); }
  .theme-picker { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 6px; margin-bottom: 4px; }
  .theme-btn {
    border: 2px solid transparent; border-radius: 10px; padding: 7px 12px;
    font-size: 12px; font-weight: 700; background: var(--secondary-bg);
    touch-action: manipulation; transition: border-color 0.15s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  }
  .theme-btn.active { border-color: var(--link); }
  .frame-picker { display: grid; grid-template-columns: repeat(5,1fr); gap: 6px; margin-top: 6px; }
  .frame-btn {
    border: 2px solid transparent; border-radius: 9px; padding: 8px 4px;
    font-size: 11px; font-weight: 700; background: var(--secondary-bg);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    touch-action: manipulation; transition: border-color 0.15s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  }
  .frame-btn.active { border-color: var(--link); }
  .frame-btn-icon { font-size: 18px; }

  /* ── Bottom-sheet overlay (used by adopt modal) ── */
  .balance-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 2000;
  }
  .balance-sheet {
    background: var(--secondary-bg);
    border-radius: 20px 20px 0 0;
    padding: 22px 18px 32px;
    width: 100%; max-width: 440px;
    box-shadow: 0 -4px 28px rgba(0,0,0,0.2);
    animation: riseIn 0.22s ease;
  }
  .balance-sheet-title { font-size: 15px; font-weight: 700; text-align: center; margin-bottom: 14px; }
  .balance-number-input {
    width: 100%; box-sizing: border-box;
    border: 1.5px solid rgba(120,120,128,0.28); border-radius: 11px;
    padding: 10px 14px; font-size: 16px; font-weight: 600;
    background: var(--bg); color: var(--text);
  }
  .balance-set-btn {
    border: none; border-radius: 11px; padding: 11px 16px;
    font-size: 14px; font-weight: 700; background: var(--link); color: #fff;
    touch-action: manipulation; width: 100%;
  }
  .balance-cancel-btn {
    display: block; width: 100%; text-align: center; padding: 10px;
    font-size: 14px; color: var(--hint); border: none; background: none;
  }

  /* ── Contact Profile Card ────────────────────────────────────────────── */
  .cp-overlay {
    position: fixed; inset: 0;
    background: var(--cp-bg, var(--bg));
    z-index: 3000;
    display: flex; flex-direction: column;
    overflow-y: auto;
    animation: sFadeIn 0.18s ease;
    transition: background 0.25s ease;
  }
  .cp-close-btn {
    position: sticky; top: 0; z-index: 1;
    align-self: flex-start;
    margin: 14px 16px 0;
    border: none; background: rgba(120,120,128,0.15);
    color: var(--cp-hint, var(--hint)); border-radius: 50%;
    width: 34px; height: 34px; font-size: 18px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation; flex-shrink: 0;
  }
  .cp-sheet {
    flex: 1;
    padding: 16px 20px 60px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .cp-avatar-wrap {
    width: 100px; height: 100px; border-radius: 50%;
    padding: 3px;
    display: flex; align-items: center; justify-content: center;
    margin: 12px 0 12px;
    box-shadow: 0 6px 28px rgba(0,0,0,0.28);
    transition: background 0.3s ease;
  }
  .cp-avatar {
    width: 94px; height: 94px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 800; color: #fff;
    position: relative; overflow: hidden;
  }
  .cp-name {
    font-size: 22px; font-weight: 800; text-align: center;
    letter-spacing: -0.4px; margin-top: 2px;
    color: var(--cp-text, var(--text));
  }
  .cp-sub-line {
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    justify-content: center; margin-bottom: 4px;
  }
  .cp-username { font-size: 14px; color: var(--cp-hint, var(--hint)); }
  .cp-badge {
    font-size: 12px; font-weight: 700; padding: 3px 9px;
    border-radius: 10px; white-space: nowrap;
  }
  .cp-badge-vip     { background: linear-gradient(135deg,#9c4f00,#c47800); color:#fff; }
  .cp-badge-premium { background: rgba(255,200,60,0.18); color:#d4962a; }
  .cp-stats-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; width: 100%; margin-top: 20px;
  }
  .cp-stat-card {
    background: var(--cp-stat-bg, rgba(120,120,128,0.08)); border-radius: 16px;
    padding: 16px 10px; text-align: center;
  }
  .cp-stat-val { font-size: 22px; font-weight: 800; color: var(--cp-text, var(--text)); }
  .cp-stat-lbl { font-size: 12px; color: var(--cp-hint, var(--hint)); margin-top: 4px; }
  .cp-mutual { margin-top: 10px; }
  .cp-actions {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; margin-top: 24px; width: 100%;
  }
  .cp-action-btn {
    border: none; border-radius: 22px; padding: 12px 18px;
    font-size: 14px; font-weight: 600;
    background: rgba(120,120,128,0.12); color: var(--text);
    touch-action: manipulation; flex: 1; min-width: 90px;
  }
  .cp-action-tg { background: rgba(0,136,204,0.15); color: #0088cc; }
  .cp-streak-toggle { width: 100%; margin-top: 12px; }
  .cp-streak-mute-btn {
    width: 100%; border: none; border-radius: 22px; padding: 11px 18px;
    font-size: 13px; font-weight: 600;
    background: rgba(120,120,128,0.08); color: var(--text);
    touch-action: manipulation; transition: background 0.2s, color 0.2s;
  }
  .cp-streak-mute-btn.cp-streak-muted {
    background: rgba(255,69,58,0.12); color: #ff453a;
  }

  /* Adopt modal */
  .adopt-chats { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; margin-bottom: 12px; }
  .adopt-chat-btn {
    display: flex; align-items: center; gap: 10px;
    border: none; border-radius: 13px; padding: 10px 12px;
    background: rgba(120,120,128,0.1); text-align: left; touch-action: manipulation;
  }
  .adopt-chat-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .adopt-chat-name { flex: 1; font-size: 14px; font-weight: 600; text-align: left; }
  .adopt-chat-msgs { font-size: 12px; color: var(--hint); flex-shrink: 0; }
  .adopt-species-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 14px; }
  .adopt-species-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    border: 2px solid transparent; border-radius: 12px; padding: 9px 4px;
    background: rgba(120,120,128,0.09); touch-action: manipulation;
    transition: border-color 0.15s, background 0.15s;
  }
  .adopt-species-btn.selected { border-color: var(--green); background: rgba(52,199,89,0.1); }
  .adopt-species-emoji { font-size: 24px; }
  .adopt-species-lbl   { font-size: 10px; color: var(--hint); }

  /* ══════════════════════════════════════════
     INTERACTIONS TAB — certificate-style cards
  ══════════════════════════════════════════ */
  .interact-section-bg {
    background: rgba(253,232,240,0.72);
    border-radius: var(--card-radius);
    padding: 14px 0 6px;
    margin-bottom: 14px;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow:
      0 2px 12px rgba(224,54,90,0.08),
      0 0 0 0.5px rgba(224,54,90,0.14),
      inset 0 1px 0 rgba(255,255,255,0.55),
      inset 0 -0.5px 0 rgba(224,54,90,0.10);
  }
  .theme-dark .interact-section-bg {
    background: rgba(244,114,168,0.10);
    box-shadow:
      0 2px 14px rgba(0,0,0,0.22),
      0 0 0 0.5px rgba(244,114,168,0.22),
      inset 0 1px 0 rgba(255,255,255,0.10),
      inset 0 -0.5px 0 rgba(0,0,0,0.20);
  }
  .theme-dark .interact-section-title { color: #f472a8; }
  .interact-section-title {
    font-size: 11px; font-weight: 800; color: #c0557a;
    text-transform: uppercase; letter-spacing: 0.8px;
    padding: 0 14px 10px;
    display: flex; align-items: center; gap: 6px;
  }
  /* Certificate card */
  .cert-card {
    background: var(--secondary-bg);
    border-radius: 18px;
    margin: 0 10px 10px;
    overflow: hidden;
    border: none;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow:
      0 2px 14px rgba(224,54,90,0.12),
      0 0 0 0.5px rgba(224,54,90,0.18),
      inset 0 1px 0 rgba(255,255,255,0.30),
      inset 0 -0.5px 0 rgba(224,54,90,0.08);
  }
  .theme-dark .cert-card {
    background: rgba(255,255,255,0.055);
    box-shadow:
      0 2px 14px rgba(0,0,0,0.22),
      0 0 0 0.5px rgba(244,114,168,0.22),
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 -0.5px 0 rgba(0,0,0,0.20);
  }
  .cert-card-header {
    padding: 12px 16px;
    text-align: center;
    border-bottom: 1px solid rgba(224,54,90,0.12);
    font-size: 9.5px; font-weight: 800; letter-spacing: 1.4px;
    color: #e06090; text-transform: uppercase;
    background: rgba(224,54,90,0.07);
  }
  .cert-avatars {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; padding: 16px 16px 8px;
  }
  .cert-avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; }
  .cert-avatar {
    width: 68px; height: 68px; border-radius: 50%;
    border: 2.5px solid #f472a8;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800; color: #fff;
    overflow: hidden; flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(244,114,168,0.28);
  }
  .cert-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
  .cert-avatar-name {
    font-size: 12px; font-weight: 700; color: var(--text);
    text-align: center; max-width: 88px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cert-avatar-user { font-size: 10px; color: #e06090; text-align: center; }
  .cert-heart-mid {
    display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0;
    animation: certHeartPulse 1.8s ease-in-out infinite;
  }
  @keyframes certHeartPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }
  .cert-heart-icon { font-size: 24px; line-height: 1; }
  .cert-tier-badge-wrap { text-align: center; padding: 0 16px 12px; }
  .cert-tier-badge {
    display: inline-block;
    background: linear-gradient(135deg, #f5a0c0, #e0365a);
    color: #fff; font-size: 11.5px; font-weight: 700;
    padding: 5px 18px; border-radius: 99px;
    box-shadow: 0 2px 8px rgba(224,54,90,0.22);
  }
  .cert-tier-married { background: linear-gradient(135deg, #c77dff, #9c4cc4); }
  .cert-tier-friends { background: linear-gradient(135deg, #ffd166, #d4962a); }
  /* XP section */
  .cert-xp-section { padding: 0 16px 12px; }
  .cert-xp-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .cert-xp-track {
    flex: 1; height: 7px; border-radius: 4px;
    background: rgba(224,54,90,0.12); overflow: hidden;
  }
  .cert-xp-fill {
    height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, #f472a8, #e0365a);
    transition: width 0.65s ease;
  }
  .cert-xp-label { font-size: 11px; color: #e06090; text-align: center; margin-bottom: 4px; }
  .cert-xp-sub { font-size: 10px; color: #e06090; text-align: center; opacity: 0.65; }
  /* Stats footer */
  .cert-stats-footer {
    display: flex; border-top: 1px solid rgba(224,54,90,0.08);
    padding: 10px 0 12px;
  }
  .cert-stat-cell {
    flex: 1; text-align: center; padding: 2px 4px;
    border-right: 1px solid rgba(224,54,90,0.08);
  }
  .cert-stat-cell:last-child { border-right: none; }
  .cert-stat-val { font-size: 13px; font-weight: 800; color: var(--text); }
  .cert-stat-lbl { font-size: 9px; color: #e06090; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; font-weight: 600; }
  /* Second stats row for couple activity history */
  .cert-stats-footer2 {
    display: flex; border-top: 1px solid rgba(224,54,90,0.06);
    padding: 8px 0 10px; background: rgba(255,255,255,0.02);
  }
  .cert-card--friendship .cert-stats-footer2 { border-top-color: rgba(212,150,42,0.06); }
  /* Pet battle tab */
  .pet-battle-wrap { padding: 14px 16px 10px; }
  .pet-battle-power-row { text-align: center; margin-bottom: 14px; padding: 10px 12px;
    background: rgba(124,108,255,0.07); border-radius: 14px; }
  .pet-battle-power-num { font-size: 22px; font-weight: 900; color: var(--ci-accent); }
  .pet-battle-power-lbl { font-size: 11px; color: var(--hint); margin-top: 2px; }
  .pet-battle-pending { background: rgba(124,108,255,0.09); border: 1px solid rgba(124,108,255,0.22);
    border-radius: 14px; padding: 14px 16px; text-align: center; font-size: 13.5px;
    font-weight: 600; margin-bottom: 12px; }
  .pet-battle-result { border-radius: 14px; padding: 16px; text-align: center;
    font-size: 20px; font-weight: 900; margin-bottom: 12px; line-height: 1.3; }
  .pet-battle-result.win  { background: rgba(52,199,89,0.13);  color: #34c759; }
  .pet-battle-result.lose { background: rgba(255,69,58,0.11);  color: #ff453a; }
  .pet-battle-result-sub  { font-size: 11px; color: var(--hint); font-weight: 500; margin-top: 6px; }
  .pet-battle-wager-label { font-size: 10px; font-weight: 800; color: var(--hint);
    letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px; }
  .pet-battle-presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  /* Pending actions */
  .cert-pending-text { text-align: center; font-size: 13px; color: #e06090; padding: 0 16px 10px; }
  .cert-actions { display: flex; gap: 8px; padding: 0 16px 14px; }
  .cert-action-btn {
    flex: 1; border: none; border-radius: 12px; padding: 10px 0;
    font-size: 12.5px; font-weight: 700; cursor: pointer;
    background: rgba(224,54,90,0.10); color: #e0365a;
    touch-action: manipulation;
  }
  .cert-action-btn:active { opacity: 0.72; }
  .cert-action-btn.accept  { background: rgba(52,199,89,0.14);  color: #34c759; }
  .cert-action-btn.decline { background: rgba(255,59,48,0.10);  color: #ff453a; }
  .cert-open-hint { text-align: center; padding-bottom: 12px; font-size: 11px; color: #e06090; opacity: 0.65; }
  /* Quick-action buttons on active relationship cards */
  .cert-quick-actions { display: flex; gap: 8px; padding: 10px 16px 14px; }
  .cert-quick-btn {
    flex: 1; border: none; border-radius: 12px; padding: 10px 0;
    font-size: 12.5px; font-weight: 700; cursor: pointer;
    touch-action: manipulation; transition: opacity 0.15s;
  }
  .cert-quick-btn:active { opacity: 0.72; }
  .cert-quick-btn:disabled { opacity: 0.38; cursor: default; }
  .cert-quick-btn.gift { background: rgba(245,166,35,0.14); color: #d4962a; }
  .cert-quick-btn.more { background: rgba(224,54,90,0.10); color: #e06090; }
  /* ── Friendship-category card theme (golden/amber instead of romantic pink) ── */
  .cert-card--friendship {
    box-shadow:
      0 2px 14px rgba(212,150,42,0.13),
      0 0 0 0.5px rgba(212,150,42,0.22),
      inset 0 1px 0 rgba(255,255,255,0.30),
      inset 0 -0.5px 0 rgba(212,150,42,0.08);
  }
  .theme-dark .cert-card--friendship {
    box-shadow:
      0 2px 14px rgba(0,0,0,0.22),
      0 0 0 0.5px rgba(212,150,42,0.28),
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 -0.5px 0 rgba(0,0,0,0.20);
  }
  .cert-card--friendship .cert-card-header {
    border-bottom-color: rgba(212,150,42,0.18);
    color: #b87c1a;
    background: rgba(212,150,42,0.08);
  }
  .cert-card--friendship .cert-avatar {
    border-color: #f5a623;
    box-shadow: 0 2px 10px rgba(245,166,35,0.28);
  }
  .cert-card--friendship .cert-avatar-user { color: #c08020; }
  .cert-card--friendship .cert-xp-track    { background: rgba(212,150,42,0.14); }
  .cert-card--friendship .cert-xp-fill     { background: linear-gradient(90deg, #ffd166, #d4962a); }
  .cert-card--friendship .cert-xp-label,
  .cert-card--friendship .cert-xp-sub      { color: #b87c1a; }
  .cert-card--friendship .cert-stats-footer{ border-top-color: rgba(212,150,42,0.10); }

  .cert-card--friendship .cert-stat-lbl    { color: #b87c1a; }
  .cert-card--friendship .cert-pending-text{ color: #b87c1a; }
  .cert-card--friendship .cert-open-hint   { color: #b87c1a; }
  .cert-card--friendship .cert-quick-btn.more { background: rgba(212,150,42,0.12); color: #b87c1a; }
