    // ── Liquid-glass tab bar: tap + drag-to-slide ────────────────────────
    (function initTabDrag() {
      const bar       = document.getElementById("mainTabBar");
      const slider    = document.getElementById("tabSlider");
      const limelight = document.getElementById("tabLimelight");
      const llBeam    = document.getElementById("tabLimelightBeam");
      const tabItems  = Array.from(bar.querySelectorAll(".tab-item"));

      /* Single neutral style for all tabs — no per-tab rainbow */
      const NEUTRAL = { bg: "rgba(255,255,255,0.18)", shadow: "rgba(255,255,255,0.18)", rgb: "255,255,255" };
      const SLIDER_STYLES = {
        stats: NEUTRAL, casino: NEUTRAL, shop: NEUTRAL, interact: NEUTRAL, giveaway: NEUTRAL,
      };

      /* Place slider + limelight under/above a given tab element */
      function snapSliderTo(tabEl, instant) {
        if (!tabEl) return;
        const barRect = bar.getBoundingClientRect();
        const tabRect = tabEl.getBoundingClientRect();
        const tab = tabEl.dataset.tab;
        const s   = SLIDER_STYLES[tab] || SLIDER_STYLES.stats;

        // ── Slider pill ──
        const sl   = slider.offsetWidth || 46;
        const left = tabRect.left - barRect.left + (tabRect.width - sl) / 2;
        if (instant) slider.style.transition = "none";
        slider.style.left = left + "px";
        if (instant) { slider.offsetHeight; slider.style.transition = ""; }
        slider.style.background = s.bg;
        slider.style.boxShadow  =
          `0 3px 14px ${s.shadow}, inset 0 1px 0 rgba(255,255,255,0.72),` +
          `inset 0 0 14px rgba(255,255,255,0.24)`;

        // ── Limelight beacon ──
        if (limelight) {
          const llW  = 44;
          const llLeft = tabRect.left - barRect.left + (tabRect.width - llW) / 2;
          if (instant) limelight.style.transition = "none";
          limelight.style.left = llLeft + "px";
          if (instant) { limelight.offsetHeight; limelight.style.transition = ""; }
          limelight.style.background = `rgba(${s.rgb},0.92)`;
          limelight.style.boxShadow  =
            `0 0 10px 1px rgba(${s.rgb},0.75), 0 0 4px rgba(${s.rgb},1)`;
          if (llBeam) {
            llBeam.style.background =
              `linear-gradient(to bottom, rgba(${s.rgb},0.30) 0%, transparent 100%)`;
          }
        }
      }

      /* Initial placement — find active tab */
      const initialActive = bar.querySelector(".tab-item.active") || tabItems[0];
      snapSliderTo(initialActive, true);

      /* Get tab element whose rect contains clientX */
      function tabAtX(x) {
        for (const t of tabItems) {
          const r = t.getBoundingClientRect();
          if (x >= r.left && x <= r.right) return t;
        }
        const barRect = bar.getBoundingClientRect();
        if (x <= barRect.left)  return tabItems[0];
        if (x >= barRect.right) return tabItems[tabItems.length - 1];
        return null;
      }

      let dragging    = false;
      let hoveredTab  = null;
      let startX      = 0;
      let dragStarted = false;

      function clearDragPreviews() {
        tabItems.forEach(t => t.classList.remove("drag-preview"));
      }

      bar.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 && e.pointerType === "mouse") return;
        dragging    = true;
        dragStarted = false;
        startX      = e.clientX;
        hoveredTab  = tabAtX(e.clientX);
        bar.setPointerCapture(e.pointerId);
        /* Slider pulses on touch */
        slider.classList.add("slider-pressed");
      }, { passive: true });

      bar.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const dx = Math.abs(e.clientX - startX);

        if (!dragStarted && dx > 6) {
          dragStarted = true;
          slider.classList.remove("slider-pressed");
          slider.classList.add("dragging");
          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
        }

        if (!dragStarted) return;

        const t = tabAtX(e.clientX);
        if (t && t !== hoveredTab) {
          hoveredTab = t;
          clearDragPreviews();
          t.classList.add("drag-preview");
          snapSliderTo(t, true);
          if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }
      });

      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        slider.classList.remove("slider-pressed", "dragging");
        clearDragPreviews();

        const finalTab = dragStarted ? hoveredTab : tabAtX(e ? e.clientX : startX);
        if (finalTab) {
          switchMainTab(finalTab.dataset.tab);
          snapSliderTo(finalTab, false);
        }
        dragStarted = false;
        hoveredTab  = null;
      }

      bar.addEventListener("pointerup",     endDrag);
      bar.addEventListener("pointercancel", endCancel);

      // Safety net: capture pointerup/cancel at window level so the drag
      // state is always reset even when Telegram WebView swallows the bar event
      window.addEventListener("pointerup",     endDrag,    { passive: true });
      window.addEventListener("pointercancel", endCancel,  { passive: true });

      function endCancel() {
        dragging    = false;
        dragStarted = false;
        slider.classList.remove("slider-pressed", "dragging");
        clearDragPreviews();
        const active = bar.querySelector(".tab-item.active");
        if (active) snapSliderTo(active, false);
      }

      // Click fallback — fires reliably even when pointer events misbehave
      tabItems.forEach(btn => {
        btn.addEventListener("click", () => {
          if (dragStarted) return; // was a real drag, not a tap
          switchMainTab(btn.dataset.tab);
          snapSliderTo(btn, false);
        });
      });

      /* Keep slider in sync when tab is switched from outside (if ever) */
      const _origSwitch = switchMainTab;
      window._tabSwitchHook = (tab) => {
        const el = tabItems.find(t => t.dataset.tab === tab);
        if (el) snapSliderTo(el, false);
      };
    })();

    async function loadWallet() {

      try {

          fetch("/app/api/wallet/info", opts),

        if (!wRes.ok) throw new Error();
        walletData = await wRes.json();
        _casinoWalletVersion = walletData.wallet_version || null; // store for background version checks

        petData    = freshPet;
        casinoLoaded = true;
        renderCasino();
      } catch {
        el.innerHTML = `<div class="error"><span class="big-emoji">⚠️</span>Не удалось загрузить.<br>Попробуй обновить.</div>`;

    /** Background wallet-version check for the casino tab.  Called after every
     *  cache-hit render (casinoLoaded already true).  Hits the lightweight
     *  /api/wallet/version endpoint and, if the hash differs from the one stored
     *  during the last loadWallet() fill, silently re-fetches the full wallet so
     *  server-side coin grants/adjustments are reflected within one round-trip. */
    async function _casinoCheckWalletVersion() {
      if (!_casinoWalletVersion) return; // nothing to compare against yet
      try {
        const opts = { method: "POST", headers: { "Content-Type": "application/json" },
                       body: JSON.stringify({ initData: currentInitData }) };
        const res = await fetch("/app/api/wallet/version", opts);
        if (!res.ok) return;
        const { wallet_version } = await res.json();
        if (wallet_version && wallet_version !== _casinoWalletVersion) {
          // Balance changed on the server — bust shop cache and reload wallet
          _shopInvalidateCache();
          await loadWallet();
        }
      } catch {
        // Network hiccup — ignore; next tab-switch will refresh.
      }
    }

    // ── Shared plan card builder ───────────────────────────────────────────────
    function _renderPlanCards(plans, selectedKey, monthlyStars, isVip) {
      return plans.map(p => {
        const months    = p.days / 30;
        const perMonth  = p.stars / months;
        const savePerMo = Math.round(monthlyStars - perMonth);
        const isSelected = p.key === selectedKey;
        const cls = ["sub-plan-card",
          isVip ? (p.key.endsWith("quarter") ? "vip-featured" : "") : (p.key === "quarter" ? "featured" : ""),
          isSelected ? (isVip ? "vip-selected" : "selected") : "",
        ].filter(Boolean).join(" ");
        const subLabel = savePerMo <= 0
          ? `${Math.round(perMonth)} ⭐/мес`
          : `−${savePerMo} ⭐/мес vs месяца`;
        const clickFn = isVip ? `selectVipPlan('${p.key}')` : `selectSubPlan('${p.key}')`;
        const badgeCls = isVip ? "sub-plan-badge vip" : "sub-plan-badge";
        const saveCls  = isVip ? "sub-plan-save vip"  : "sub-plan-save";
        return `
          <div class="${cls}" data-plan="${p.key}" data-tier="${isVip ? 'vip' : 'premium'}" onclick="${clickFn}">
            ${p.badge ? `<div class="${badgeCls}">${p.badge}</div>` : ""}
            <div class="sub-plan-name">${p.label}</div>
            <div class="sub-plan-stars">
              <span class="sub-plan-stars-ico">${isVip ? "💎" : "⭐"}</span>

    async function _refreshWalletAfterSub(tierLabel) {
      const wRes = await fetch("/app/api/wallet/info", {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({initData: currentInitData}),
      });
      if (wRes.ok) {
        walletData = await wRes.json();
        subData = walletData?.subscription || null;
        renderCasino();
        // Subscription is now in shop tab — refresh it if we're on the subscription sub-tab
        if (shopLoaded) renderShop();
      }
      toastMessage(`${tierLabel} оформлен! Бонусы уже активны.`);
    }

    function _makeInvoiceHandler({ endpoint, planFn, resetFn, tierLabel }) {
      return async () => {
        const plan = planFn();
        resetFn("loading");
        try {
          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
          const res = await fetch(endpoint, {
            method: "POST", headers: {"Content-Type":"application/json"},
            body: JSON.stringify({
              initData:   currentInitData,
              plan_stars: plan.stars,
              plan_days:  plan.days,
            }),
          });
          if (!res.ok) {
            const err = await res.json().catch(()=>({}));
            const MSG = {
              subscription_disabled: "Подписка временно недоступна.",
              already_subscribed:    "У тебя уже есть активная подписка!",
              invoice_send_failed:   "Не удалось создать счёт. Попробуй позже.",
            };
            toastMessage(MSG[err.detail] || "Ошибка. Попробуй ещё раз.");
            resetFn("ready");
            return;
          }
          const data = await res.json();
          const _onResult = async (status) => {
            if (status === "paid") {
              if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
              await _refreshWalletAfterSub(tierLabel);
            } else if (status === "cancelled") {
              toastMessage("Оплата отменена.");
              resetFn("ready");
            } else {
              toastMessage("Ошибка оплаты. Попробуй ещё раз.");
              resetFn("ready");
            }
          };
          if (tg?.openInvoice) {
            tg.openInvoice(data.invoice_link, _onResult);
          } else {
            window.open(data.invoice_link, "_blank");
            resetFn("ready");
          }
        } catch {
          toastMessage("Ошибка. Попробуй ещё раз.");
          resetFn("ready");
        }
      };
    }

    function _renderLivePlayers(data) {
      const el = document.getElementById("livePlayersBody");
      if (!el) return;
      const game   = currentCasinoGame;  // "mines" | "crash"
      const active = (data.active || []).filter(p => p.game === game);
      const recent = (data.recent || []).filter(p => p.game === game).slice(0, 6);
      if (!active.length && !recent.length) {
        el.innerHTML = `<span style="font-size:12px;color:var(--hint)">Пока никого нет — будь первым!</span>`;
        return;
      }
      let html = "";
      for (const p of active) {
        const detail = game === "mines"
          ? `${p.bet} 🪙 · открыто ${p.revealed}`
          : `${p.bet} 🪙 летит…`;
        html += `<div class="live-row">
          <span class="live-lname">👤 ${esc2(p.name)}</span>
          <span class="live-detail">${detail}</span>

          html += `<div class="live-row">

            <span class="live-won">${e.mult}× · +${e.payout} 🪙</span>
          </div>`;
        } else if (e.type === "mine") {
          html += `<div class="live-row">
            <span class="live-lname">💥 ${esc2(e.name)}</span>
            <span class="live-lost">мина · −${e.bet} 🪙</span>
          </div>`;
        } else if (e.type === "crash_won") {
          html += `<div class="live-row">
            <span class="live-lname">✅ ${esc2(e.name)}</span>
            <span class="live-won">${e.mult}× · +${e.payout} 🪙</span>

          html += `<div class="live-row">
            <span class="live-lname">💥 ${esc2(e.name)}</span>
            <span class="live-lost">сгорел · −${e.bet} 🪙</span>
          </div>`;
        }
      }
      el.innerHTML = html;

    function attachCasinoHandlers() {
      // Daily claim
      const claimBtn = document.getElementById("claimDailyBtn");
      if (claimBtn && !claimBtn.disabled) {
        claimBtn.addEventListener("click", claimDaily);
      }
      // Slots spin
      const spinBtn = document.getElementById("spinBtn");
      if (spinBtn) spinBtn.addEventListener("click", spinSlots);
      // Flip presets
      document.querySelectorAll(".flip-preset-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const inp = document.getElementById("flipBet");
          if (inp && btn.dataset.preset) { inp.value = btn.dataset.preset; updateFlipOdds(); }
        });
      });
      // Dynamic odds update when bet changes
      const flipBetInp = document.getElementById("flipBet");
      if (flipBetInp) flipBetInp.addEventListener("input", updateFlipOdds);
      updateFlipOdds();
      // Flip buttons
      ["flipHeadsBtn","flipTailsBtn"].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.addEventListener("click", () => doFlip(btn.dataset.choice));
      });

      // Mines + Crash buttons now use inline onclick — no listeners needed here
      // Fetch crash history when crash tab is active
      if (currentCasinoGame === "crash") fetchCrashHistory();
      // Live players polling for mines / crash tabs
      clearInterval(livePlayersTimer); livePlayersTimer = null;
      if (currentCasinoGame === "mines" || currentCasinoGame === "crash") {
        fetchLivePlayers();
        livePlayersTimer = setInterval(fetchLivePlayers, 3000);
      }
    }

    async function claimDaily() {
      const btn = document.getElementById("claimDailyBtn");
      if (!btn || btn.disabled) return;
      btn.disabled = true; btn.textContent = "⏳ Получаем…";
      try {
        const res = await fetch("/app/api/wallet/claim_daily", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData: currentInitData}),
        });
        if (!res.ok) throw new Error();
        const data = await res.json();
        walletData.can_claim_daily = false;
        walletData.seconds_until_next_claim = 20 * 3600;
        walletData.total_earned += data.earned;
        updateBalanceDisplay(data.new_balance);
        btn.textContent = `✅ Получено ${data.earned} монет!`;
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        const _parts = [`🎁 +${data.earned} монет`];
        if (data.streak_bonus > 0) _parts.push(`+${data.streak_bonus} за серию 🔥`);
        if (data.marriage_bonus > 0) _parts.push(`+${data.marriage_bonus} от брака 💍`);
        toastMessage(_parts.length > 1 ? `${_parts[0]} (${_parts.slice(1).join(", ")})!` : `${_parts[0]}!`);
      } catch {
        btn.disabled = false;
        btn.textContent = "🎁 Получить награду";
        toastMessage("Не удалось получить награду.");
      }
    }

    async function spinSlots() {
      const btn       = document.getElementById("spinBtn");
      const resultWrap = document.getElementById("slotsResultWrap");
      const winLine   = document.getElementById("slotsWinLine");
      if (!btn || btn.disabled) return;

      const bet = slotsBet;
      if ((walletData?.balance || 0) < bet) {
        toastMessage("Недостаточно монет! Получи ежедневную награду 🎁");
        return;
      }

      btn.disabled = true;
      btn.textContent = "⏳";
      if (resultWrap) resultWrap.innerHTML = "";
      if (winLine) winLine.className = "slots-win-line";

      // Clear win classes
      [0,1,2].forEach(i => {
        const w = document.getElementById(`reelWrap${i}`);
        if (w) w.className = "slot-reel-wrap";
      });
      document.querySelectorAll('.slots-bet-chip').forEach(c => c.disabled = true);

      // ── Start all reels spinning (rapid random shuffles) ──────────────────
      const spinIntervals = [0,1,2].map(i => setInterval(() => {
        const s = document.getElementById(`strip${i}`);
        if (!s) return;
        s.style.transition = "none";
        s.innerHTML = [_randSym(),_randSym(),_randSym(),_randSym(),_randSym()]
          .map(x=>`<div class="slot-sym">${x}</div>`).join("");
        s.style.transform = "translateY(-60px)";
      }, 80));

      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");

      try {
        const res = await fetch("/app/api/wallet/slots", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData: currentInitData, bet}),
        });
        if (!res.ok) throw new Error();
        const data = await res.json();

        // ── Stop reels one by one, left → middle → right ───────────────────
        const stopReel = (idx, delay) => setTimeout(() => {
          clearInterval(spinIntervals[idx]);
          const s = document.getElementById(`strip${idx}`);
          if (!s) return;
          // Place result at center (index 2 of 5), start shifted up
          s.style.transition = "none";
          s.innerHTML = _strip5(data.reels[idx]);
          s.style.transform = "translateY(-120px)"; // result at top of window
          // Bounce-settle to center
          requestAnimationFrame(() => requestAnimationFrame(() => {
            s.style.transition = "transform 0.42s cubic-bezier(0.22,1.28,0.36,1)";
            s.style.transform  = "translateY(-60px)"; // result in center
          }));
          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
        }, delay);

        stopReel(0, 380);
        stopReel(1, 760);
        stopReel(2, 1140);

        // ── Show result after last reel settles ────────────────────────────
        setTimeout(() => {
          walletData.total_spent = (walletData.total_spent || 0) + bet;
          if (data.payout > 0) walletData.total_earned = (walletData.total_earned || 0) + data.payout;
          updateBalanceDisplay(data.new_balance);

          if (data.payout > 0) {
            // Determine which reels to light up
            const r = data.reels;
            const allSame = r[0]===r[1] && r[1]===r[2];
            const cls = data.is_jackpot ? "jackpot-reel" : "win-reel";
            const lineClass = data.is_jackpot ? "jackpot-lit" : "lit";
            const toLight = allSame ? [0,1,2] : [];
            if (!allSame) {
              if (r[0]===r[1]) toLight.push(0,1);
              if (r[1]===r[2]) toLight.push(1,2);
              if (r[0]===r[2]) toLight.push(0,2);
            }
            [...new Set(toLight)].forEach(i => {
              const w = document.getElementById(`reelWrap${i}`);
              if (w) w.classList.add(cls);
            });
            if (winLine) winLine.classList.add(lineClass);

            if (data.is_jackpot) {
              if (resultWrap) resultWrap.innerHTML =

    function updateFlipOdds() {
      const inp = document.getElementById("flipBet");

      if (!lbl) return;
      const bet     = Math.max(10, Math.min(Number(inp?.value) || 10, 5000));

    async function doFlip(choice) {
      const betInput = document.getElementById("flipBet");
      const coinEl   = document.getElementById("flipCoin");
      const resultEl = document.getElementById("flipResult");
      const headsBtn = document.getElementById("flipHeadsBtn");
      const tailsBtn = document.getElementById("flipTailsBtn");
      const bet = Math.max(10, Math.min(Number(betInput?.value) || 50, walletData?.balance || 0));

      if ((walletData?.balance || 0) < bet) {
        toastMessage("Недостаточно монет!");
        return;
      }

      [headsBtn, tailsBtn].forEach(b => { if (b) b.disabled = true; });
      if (resultEl) resultEl.innerHTML = "";
      if (coinEl) { coinEl.classList.add("flipping"); coinEl.textContent = "🪙"; }

      try {
        const res = await fetch("/app/api/wallet/flip", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData: currentInitData, bet, choice}),
        });
        if (!res.ok) throw new Error();
        const data = await res.json();

        setTimeout(() => {
          if (coinEl) {
            coinEl.classList.remove("flipping");
            coinEl.textContent = data.server_side === "heads" ? "🦅" : "🪙";
          }
          if (data.won) {
            walletData.total_earned = (walletData.total_earned || 0) + bet;
            resultEl.innerHTML = `<span class="flip-won">🎉 Угадал! +${bet} 🪙</span>`;
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
          } else {
            walletData.total_spent = (walletData.total_spent || 0) + bet;
            resultEl.innerHTML = `<span class="flip-lost">😔 Не угадал. -${bet} 🪙</span>`;
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
          }
          updateBalanceDisplay(data.new_balance);
          [headsBtn, tailsBtn].forEach(b => { if (b) b.disabled = false; });
          // Update max bet in input
          const maxBet = Math.min(5000, data.new_balance);
          if (betInput) {
            betInput.max = maxBet;
            if (Number(betInput.value) > maxBet) betInput.value = maxBet;
          }
        }, 750);
      } catch {
        if (coinEl) { coinEl.classList.remove("flipping"); coinEl.textContent = "🪙"; }
        if (resultEl) resultEl.textContent = "Ошибка. Попробуй ещё раз.";
        [headsBtn, tailsBtn].forEach(b => { if (b) b.disabled = false; });
      }
    }

    async function revealMinesCell(index) {
      if (!minesGameActive) return;
      const cell = document.getElementById(`mCell${index}`);
      if (!cell || cell.classList.contains("safe") || cell.classList.contains("mine")) return;

      // Disable grid during request
      const grid = document.getElementById("minesGrid");
      if (grid) grid.style.pointerEvents = "none";

      try {
        const res = await fetch("/app/api/wallet/mines/reveal", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData: currentInitData, cellIndex: index}),
        });
        if (!res.ok) throw new Error();
        const data = await res.json();

        if (data.is_mine) {
          minesGameActive = false;
          if (grid) grid.style.pointerEvents = "none";  // keep disabled during reveal animation
          cell.classList.add("mine");
          cell.textContent = "💣";
          // Cascade reveal of other mines with staggered delay
          (data.mines_indices || []).forEach((idx, i) => {
            if (idx === index) return;
            setTimeout(() => {
              const mc = document.getElementById(`mCell${idx}`);
              if (mc) { mc.classList.add("mine-end"); mc.textContent = "💣"; }
            }, 60 + i * 35);
          });
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
          const statusEl = document.getElementById("minesStatus");
          if (statusEl) statusEl.style.display = "none";
          const resultEl = document.getElementById("minesResult");
          if (resultEl) resultEl.innerHTML = `<span class="flip-lost">💥 Взрыв! Ставка потеряна.</span>`;
          setTimeout(_minesShowRestart, 900);
        } else {
          cell.classList.add("safe");
          cell.textContent = "💎";
          minesRevealedCount = data.revealed_count;
          const multEl    = document.getElementById("minesMultEl");
          const payoutEl  = document.getElementById("minesPayoutEl");
          const cashoutBtn= document.getElementById("minesCashoutBtn");

          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
          if (grid) grid.style.pointerEvents = "";
        }

        if (grid) grid.style.pointerEvents = "";
        toastMessage("Ошибка. Попробуй ещё раз.");

    function _crashTick(bet, now) {
      if (!crashGameActive) return;
      const elapsed = (now - crashStartTime) / 1000;
      crashMultiplier = parseFloat(Math.exp(0.055 * elapsed).toFixed(2));

      // ── 1. Auto-cashout check ─────────────────────────────────────────────
      if (!crashCashedOut && crashAutoCashoutAt > 1 && crashMultiplier >= crashAutoCashoutAt) {
        doCrashCashout();
        // Don't return — animation continues in FOMO mode
      }

      // ── 2. Crash point check ──────────────────────────────────────────────
      if (crashMultiplier >= crashPointAt) {
        crashGameActive = false;
        cancelAnimationFrame(crashAnimFrame); crashAnimFrame = null;
        const rocketEl  = document.getElementById("crashRocket");
        const cashoutEl = document.getElementById("crashCashoutBtn");
        if (rocketEl) {
          rocketEl.innerHTML   = '<span style="font-size:28px;line-height:1;display:block">💥</span>';
          rocketEl.style.width  = "32px";
          rocketEl.style.height = "32px";
          rocketEl.style.transform = "none";
          rocketEl.style.filter = "drop-shadow(0 0 16px rgba(255,69,58,0.9))";
        }
        if (cashoutEl) { cashoutEl.disabled = true; cashoutEl.classList.remove("live"); }
        if (tg?.HapticFeedback && !crashCashedOut) tg.HapticFeedback.notificationOccurred("error");
        _finalizeCrashEnd(bet);
        return;
      }

      // ── 3. Text + colour ──────────────────────────────────────────────────
      const multD   = document.getElementById("crashMultDisplay");
      const cashout = document.getElementById("crashCashoutBtn");
      if (multD && multD.classList.contains("flying")) {
        multD.textContent = `${crashMultiplier.toFixed(2)}×`;
        if      (crashMultiplier >= 10)  multD.style.color = "#c5baff";
        else if (crashMultiplier >= 5)   multD.style.color = "#f97316";
        else if (crashMultiplier >= 2.5) multD.style.color = "#fbbf24";
        else                             multD.style.color = "#c5baff";
      }
      // Update cashout button: if already cashed out — show status, else show potential payout
      if (cashout && !crashCashedOut) {
        cashout.textContent = `🚀 Забрать ${Math.floor(bet * crashMultiplier)} 🪙`;
      } else if (cashout && crashCashedOut) {
        cashout.textContent = `✅ Забрал ×${crashCashedOutMult.toFixed(2)} — летим…`;
      }

      // ── 4. Rocket position + curve ────────────────────────────────────────
      const display = document.getElementById("crashDisplay");
      if (!display) { crashAnimFrame = requestAnimationFrame(_crashTick.bind(null, bet)); return; }
      const W = display.clientWidth  || 300;
      const H = display.clientHeight || 148;

      const T     = 35;
      const xFrac = Math.min(elapsed / T, 0.93);
      const yFrac = Math.min(1 - 1 / Math.max(crashMultiplier, 1.001), 0.93);

      const svgX = 4   + xFrac * 290;
      const svgY = 138 - yFrac * 128;

      const rocket = document.getElementById("crashRocket");
      if (rocket) {
        const pxX = (svgX / 300) * W;
        const pxY = (svgY / 148) * H;
        rocket.style.left   = `${(pxX - 24).toFixed(0)}px`;
        rocket.style.top    = `${(pxY - 13).toFixed(0)}px`;
        rocket.style.bottom = "";

        // Compute tangent angle from trajectory
        if (crashPrevSvgX !== null) {
          const dx = svgX - crashPrevSvgX;
          const dy = svgY - crashPrevSvgY; // SVG Y: positive = down
          if (dx * dx + dy * dy > 0.2) {
            const targetAngle = Math.atan2(-dy, dx) * 180 / Math.PI; // standard coords (up = +90)
            let diff = targetAngle - crashRocketAngle;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            crashRocketAngle += diff * 0.18; // smooth lerp
          }
        }
        crashPrevSvgX = svgX;
        crashPrevSvgY = svgY;

        // SVG rocket points RIGHT at 0°; negate to convert math angle → CSS rotation
        rocket.style.transform = `rotate(${(-crashRocketAngle).toFixed(1)}deg)`;
      }

      // SVG path update (throttled to 80 ms)
      if (now - crashLastPathT > 80) {
        crashLastPathT = now;
        const poly = document.getElementById("crashPolyline");
        const fill = document.getElementById("crashFill");
        if (poly) {
          const pts    = poly.getAttribute("points") || "";
          const newPts = `${pts} ${svgX.toFixed(1)},${svgY.toFixed(1)}`;
          poly.setAttribute("points", newPts);
          fill?.setAttribute("points", `${newPts} ${svgX.toFixed(1)},143 4,143`);
        }
      }

      crashAnimFrame = requestAnimationFrame(_crashTick.bind(null, bet));
    }

    // Called when rocket explodes (either player lost or player already cashed out = FOMO)
    async function _finalizeCrashEnd(bet) {
      const multD    = document.getElementById("crashMultDisplay");
      const resultEl = document.getElementById("crashResult");
      const startBtn = document.getElementById("crashStartBtn");
      const cashAt   = crashPointAt;

      if (crashCashedOut) {
        // Player already cashed out — show FOMO result
        if (multD) {
          multD.classList.remove("flying");
          multD.style.color = "";
          multD.className = "crash-mult-display lost";
          multD.textContent = `💥 ${cashAt.toFixed(2)}×`;
        }
        const fomoMsg = crashCashedOutPayout > 0
          ? `<span class="flip-won">✅ Ты забрал ×${crashCashedOutMult.toFixed(2)} (+${crashCashedOutPayout} 🪙)</span><br><span style="font-size:12px;color:var(--ci-muted)">Краш произошёл на ×${cashAt.toFixed(2)}</span>`
          : `<span class="flip-won">✅ Ты забрал на ×${crashCashedOutMult.toFixed(2)}</span><br><span style="font-size:12px;color:var(--ci-muted)">Краш на ×${cashAt.toFixed(2)}</span>`;
        if (resultEl) resultEl.innerHTML = fomoMsg;
        // Update local history and bar
        crashHistory.push(cashAt);
        if (crashHistory.length > 10) crashHistory.shift();
        renderCrashHistoryBar();
        _scheduleAutoBet(bet);
        if (startBtn) { startBtn.style.display = ""; startBtn.disabled = false; startBtn.textContent = "🚀 Запустить"; }
        return;
      }

      // Player did NOT cash out — notify server and show loss
      if (multD) {
        multD.classList.remove("flying");
        multD.style.color = "";
        multD.className = "crash-mult-display lost";
        multD.textContent = `💥 ${cashAt.toFixed(2)}×`;
      }

      try {
        const res = await fetch("/app/api/wallet/crash/cashout", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData: currentInitData, multiplier: cashAt}),
        });
        if (res.ok) {
          const data = await res.json();
          const at = (data.crash_at || cashAt).toFixed(2);
          if (multD) { multD.className = "crash-mult-display lost"; multD.textContent = `💥 ${at}×`; }
          if (resultEl) resultEl.innerHTML = `<span class="flip-lost">💥 Краш на ${at}× — ставка потеряна!</span>`;
          updateBalanceDisplay(data.new_balance);
          crashHistory.push(parseFloat(at));
        } else {
          if (resultEl) resultEl.innerHTML = `<span class="flip-lost">💥 Краш на ${cashAt.toFixed(2)}×!</span>`;
          crashHistory.push(cashAt);
        }
      } catch {
        if (resultEl) resultEl.innerHTML = `<span class="flip-lost">💥 Краш на ${cashAt.toFixed(2)}×!</span>`;
        crashHistory.push(cashAt);
      }
      if (crashHistory.length > 10) crashHistory.shift();
      renderCrashHistoryBar();
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
      _scheduleAutoBet(bet);
      if (startBtn) { startBtn.style.display = ""; startBtn.disabled = false; startBtn.textContent = "🚀 Запустить"; }
      // Reset rocket to launch pad after short delay (so 💥 is visible briefly)
      setTimeout(_placeCrashRocketAtStart, 1800);
    }

    function _scheduleAutoBet(bet) {
      if (!crashAutoBet) return;
      if (crashAutoBetTimer) clearTimeout(crashAutoBetTimer);
      crashAutoBetTimer = setTimeout(() => {
        crashAutoBetTimer = null;
        const betInput = document.getElementById("crashBet");
        if (betInput) betInput.value = bet;
        startCrash();
      }, 2000);
    }

    async function doCrashCashout() {
      // Prevent double-cashout
      if (!crashGameActive || crashCashedOut) return;
      crashCashedOut = true;
      crashCashedOutMult = crashMultiplier;

      const cashout = document.getElementById("crashCashoutBtn");
      if (cashout) {
        cashout.disabled = true;
        cashout.classList.remove("live");
        cashout.textContent = `✅ Забрал ×${crashCashedOutMult.toFixed(2)} — летим…`;
      }

      // Animation continues — rocket flies to crashPointAt (FOMO)
      try {
        const res = await fetch("/app/api/wallet/crash/cashout", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData: currentInitData, multiplier: crashCashedOutMult}),
        });
        if (!res.ok) throw new Error();
        const data = await res.json();

        if (data.won) {
          crashCashedOutPayout = data.payout;
          updateBalanceDisplay(data.new_balance);
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
          toastMessage(`🚀 +${data.payout} монет!`);
        } else {
          // Server says crash already happened (race condition) — end immediately
          crashGameActive = false;
          if (crashAnimFrame) { cancelAnimationFrame(crashAnimFrame); crashAnimFrame = null; }
          const rocketEl = document.getElementById("crashRocket");
          if (rocketEl) { rocketEl.textContent = "💥"; rocketEl.style.filter = "drop-shadow(0 0 16px rgba(255,69,58,0.9))"; }
          crashCashedOutPayout = 0;
          updateBalanceDisplay(data.new_balance);
          const resultEl = document.getElementById("crashResult");
          if (resultEl) resultEl.innerHTML = `<span class="flip-lost">💥 Краш на ${data.crash_at.toFixed(2)}× — ставка потеряна!</span>`;
          const multD = document.getElementById("crashMultDisplay");
          if (multD) { multD.classList.remove("flying"); multD.style.color = ""; multD.className = "crash-mult-display lost"; multD.textContent = `💥 ${data.crash_at.toFixed(2)}×`; }
          crashHistory.push(data.crash_at);
          if (crashHistory.length > 10) crashHistory.shift();
          renderCrashHistoryBar();
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
          _scheduleAutoBet(crashCurrentBet); // auto-bet with same bet
          const startBtn = document.getElementById("crashStartBtn");
          if (startBtn) { startBtn.style.display = ""; startBtn.disabled = false; startBtn.textContent = "🚀 Запустить"; }
        }
      } catch {
        // If request fails, still keep animation going; result shown at explosion
        cashout && (cashout.textContent = `✅ Забрал ×${crashCashedOutMult.toFixed(2)} — летим…`);
      }
    }

    const FEED_XP_BASE = 15;
    function calcFoodXP(foodType, p) {
      const f = FOOD_CATALOG_JS[foodType];
      if (!f) return 0;
      const skillMult  = 1.0 + ((p.upgrades && p.upgrades.xp_boost) || 0) * 0.30;
      // xp_multiplier from pet/list already combines subscription + double_xp boost
      const xpMult     = Math.max(1.0, parseFloat((petData && petData.xp_multiplier) || 1));
      const relMult    = parseFloat(p.rel_bonus || 1.0);
      return Math.round(FEED_XP_BASE * f.xp_mult * skillMult * xpMult * relMult);
    }

      xp_boost:      { name:"Умник",    emoji:"🧠", maxLevel:3, desc:"+30% к XP за каждый уровень",              costs:[100,250,500] },

    async function loadBattleStatus(petId) {
      const el     = document.getElementById(`petBattleStatus${petId}`);
      const formEl = document.getElementById(`petBattleForm${petId}`);
      if (!el) return;
      try {
        const res = await fetch("/app/api/pet/battle/status", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData: currentInitData, petId}),
        });
        if (!res.ok) throw new Error();
        const r = await res.json();
        if (!r.pending) {
          el.innerHTML = "";
          if (formEl) formEl.style.display = "";
          return;
        }
        if (formEl) formEl.style.display = "none";
        if (r.is_challenger) {
          el.innerHTML = `
            <div class="pet-battle-pending">
              ⏳ Ждём ответа партнёра…<br>Ставка: <b>${r.wager} 🪙</b>
              <div style="margin-top:10px">
                <button class="cert-action-btn decline" onclick="cancelBattleChallenge(${petId})">Отменить вызов</button>
              </div>
            </div>`;
        } else {
          el.innerHTML = `
            <div class="pet-battle-pending">
              ⚔️ <b>Партнёр вызывает тебя на бой!</b><br>Ставка: <b>${r.wager} 🪙</b>
              <div class="cert-actions" style="margin-top:10px">
                <button class="cert-action-btn accept" onclick="respondBattle(${petId},true)">⚔️ Принять</button>
                <button class="cert-action-btn decline" onclick="respondBattle(${petId},false)">✗ Отказать</button>
              </div>
            </div>`;
        }
      } catch {
        el.innerHTML = "";
        if (formEl) formEl.style.display = "";
      }
    }

    function selectBattleWager(petId, v) {
      const inp = document.getElementById(`battleWager${petId}`);
      if (inp) inp.value = v;
    }

    async function sendBattleChallenge(petId) {
      const inp    = document.getElementById(`battleWager${petId}`);
      const bal    = walletData?.balance || 0;
      const wager  = Math.max(50, Math.min(Number(inp?.value)||100, 5000, bal));
      if (bal < 50) { toastMessage("Недостаточно монет!"); return; }
      const formEl = document.getElementById(`petBattleForm${petId}`);
      if (formEl) formEl.style.display = "none";
      try {
        await fetch("/app/api/pet/battle/challenge", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData: currentInitData, petId, wager}),
        });
        await loadBattleStatus(petId);
        toastMessage("⚔️ Вызов отправлен партнёру!");
      } catch(e) {
        if (formEl) formEl.style.display = "";
        toastMessage("Ошибка — попробуй ещё раз");
      }
    }

    async function respondBattle(petId, accept) {
      const el     = document.getElementById(`petBattleStatus${petId}`);
      const formEl = document.getElementById(`petBattleForm${petId}`);
      try {
        const res = await fetch("/app/api/pet/battle/respond", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData: currentInitData, petId, accept}),
        });
        const r = await res.json();
        if (!accept) {
          if (el) el.innerHTML = "";
          if (formEl) formEl.style.display = "";
          toastMessage("Вызов отклонён.");
          return;
        }
        if (!r.accepted) { if (el) el.innerHTML = ""; if (formEl) formEl.style.display = ""; return; }
        const myId   = walletData?.owner_id || 0;
        const iWon   = r.winner_id == myId;
        const myBal  = iWon ? r.winner_balance : r.loser_balance;
        if (el) el.innerHTML = `
          <div class="pet-battle-result ${iWon?"win":"lose"}">
            ${iWon ? "🏆 Ты победил!" : "😔 Ты проиграл."}
            <span style="font-size:14px"> ${iWon?"+":"−"}${r.wager} 🪙</span>
            <div class="pet-battle-result-sub">
              Мощь: ${r.challenger_power} vs ${r.responder_power} (база: ${r.base_power})
            </div>
          </div>`;
        if (formEl) formEl.style.display = "";
        updateBalanceDisplay(myBal);
        if (walletData) walletData.balance = myBal;
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred(iWon?"success":"error");
      } catch {
        toastMessage("Ошибка — попробуй ещё раз");
      }
    }

    async function cancelBattleChallenge(petId) {
      try {
        await fetch("/app/api/pet/battle/respond", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData: currentInitData, petId, accept: false}),
        });
      } catch { /* expired — fine */ }
      const el     = document.getElementById(`petBattleStatus${petId}`);
      const formEl = document.getElementById(`petBattleForm${petId}`);
      if (el)     el.innerHTML = "";
      if (formEl) formEl.style.display = "";
    }

      const foods = Object.entries(FOOD_CATALOG_JS).map(([type, f]) => {
        const dis = feedCd || bal < f.cost;
        const xpGain = calcFoodXP(type, p);
        const moodHint = f.mood > 0 ? ` · +${f.mood} 😊` : "";
        return `<div class="pet-food-item${feedCd?' on-cd':''}">
          <div class="pet-food-emoji">${f.emoji}</div>
          <div class="pet-food-name">${f.name}</div>
          <div class="pet-food-bonus">${xpGain} XP${moodHint}</div>
          <button class="pet-food-buy" data-pet-id="${p.id}" data-food-type="${type}" ${dis?"disabled":""}>
            ${f.cost} 🪙${feedCd?` · ${feedCd}`:""}
          </button>
        </div>`;
      }).join("");
      return `<div class="pet-food-intro">🍽️ Вкуснее еда = больше XP и настрой!</div><div class="pet-food-grid">${foods}</div>`;
    }

    function renderPetSkillsPane(p) {
      const ups = p.upgrades || {};
      const rows = Object.entries(SKILL_CATALOG_JS).map(([key, sk]) => {
        const cur  = ups[key] || 0;
        const isMax = cur >= sk.maxLevel;
        const cost  = isMax ? 0 : sk.costs[cur];
        const canAff = !isMax && (walletData?.balance||0) >= cost;
        const dots  = Array.from({length:sk.maxLevel},(_,i)=>
          `<div class="pet-skill-dot${i<cur?' filled':''}"></div>`).join("");
        return `<div class="pet-skill-row">
          <div class="pet-skill-emoji">${sk.emoji}</div>
          <div class="pet-skill-body">
            <div class="pet-skill-name">${sk.name} <span style="font-size:9.5px;opacity:.55">${cur}/${sk.maxLevel}</span></div>
            <div class="pet-skill-desc">${sk.desc}</div>
            <div class="pet-skill-dots">${dots}</div>
          </div>
          <button class="pet-skill-upg-btn${isMax?' maxed':''}" data-pet-id="${p.id}" data-skill="${key}"
            ${isMax||!canAff?"disabled":""}>
            ${isMax?"MAX ✓":`${cost} 🪙`}
          </button>
        </div>`;
      }).join("");
      return `<div class="pet-skill-intro">⚡ Прокачай питомца навсегда!</div><div class="pet-skill-list">${rows}</div>`;
    }

    function petEmoji(pet) {
      if (!pet.is_alive) return "💀";
      const sp = PET_SPECIES[pet.species];
      return sp ? sp.stages[Math.max(0, Math.min(pet.stage - 1, 4))] : "🐾";
    }
    function statColor(v) {
      return v >= 60 ? "var(--green)" : v >= 30 ? "#f59e0b" : "var(--red)";
    }
    function moodEmoji(m) {
      return m >= 70 ? "😊" : m >= 40 ? "😐" : "😢";
    }
    function hungerEmoji(h) {
      return h >= 70 ? "🍖" : h >= 30 ? "🍽️" : "😰";
    }
    function daysLabel(n) {
      if (n === 0) return "только родился";
      if (n === 1) return "1 день";
      if (n < 5)   return `${n} дня`;
      return `${n} дней`;
    }
    function fmtCooldown(secs) {
      if (secs <= 0) return null;
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      if (h > 0) return `${h}ч ${m}м`;
      return `${m}м`;
    }

    function petSpeech(p) {
      if (p.hunger < 30) return p.hunger < 15
        ? `Я очень голодна… 😿 Покорми меня!`
        : `Хочу кушать ${hungerEmoji(p.hunger)} покорми меня?`;
      if (p.mood < 30) return `Мне скучно… поиграй со мной! 🎾`;
      if (p.mood >= 90) return `Я счастлива! ❤️ Спасибо!`;
      if (p.hunger >= 90) return `Сытая и довольная~ 😸`;
      const phrases = [
        `Мяу! Привет! 👋`, `Всё хорошо~ 😊`, `Поиграй со мной! 🎮`,
        `Я тебя люблю! 💕`, `Сегодня отличный день! ✨`,
      ];
      return phrases[Math.abs(p.id * 7 + p.mood) % phrases.length];
    }

    function attachPetHandlers() {
      // Main tab action buttons (feed quick/play/cuddle/rename)
      document.querySelectorAll(".pet-action-btn:not([disabled])").forEach(btn => {
        btn.addEventListener("click", () => {
          const petId  = Number(btn.dataset.petId);
          const action = btn.dataset.action;
          if (action === "rename") { openRenameModal(petId, btn); return; }
          if (action === "feed")   { doPetFeed(petId, "kibble", btn); return; }
          doPetAction(petId, action, btn);
        });
      });
      // Food shop buttons
      document.querySelectorAll(".pet-food-buy:not([disabled])").forEach(btn => {
        btn.addEventListener("click", () => {
          doPetFeed(Number(btn.dataset.petId), btn.dataset.foodType, btn);
        });
      });
      // Skill upgrade buttons
      document.querySelectorAll(".pet-skill-upg-btn:not([disabled]):not(.maxed)").forEach(btn => {
        btn.addEventListener("click", () => {
          doPetUpgrade(Number(btn.dataset.petId), btn.dataset.skill, btn);
        });
      });
      // Adopt
      document.querySelectorAll("#openAdoptBtn").forEach(b => b.addEventListener("click", openAdoptModal));
    }

    async function revivePet(petId) {
      const btn = document.querySelector(`.pet-revive-btn[data-pet-id="${petId}"]`);
      if (btn) { btn.disabled = true; btn.textContent = "⏳ Создаём счёт…"; }
      try {
        const res = await fetchApi("/app/api/pet/revive/invoice", { petId });
        if (!res.ok || !res.invoice_link) throw new Error(res.detail || "invoice_failed");
        // Open Telegram native Stars payment sheet
        if (window.Telegram?.WebApp?.openInvoice) {
          Telegram.WebApp.openInvoice(res.invoice_link, status => {
            if (status === "paid") {
              toastMessage("🌟 Оплачено! Питомец скоро возродится.");
              setTimeout(() => refreshPetSection(), 2000);
            } else if (status === "cancelled") {
              toastMessage("Оплата отменена.");
              if (btn) { btn.disabled = false; btn.innerHTML = "⭐ Возродить за 10"; }
            } else {
              toastMessage("Платёж не завершён.");
              if (btn) { btn.disabled = false; btn.innerHTML = "⭐ Возродить за 10"; }
            }
          });
        } else {
          // Fallback: open link in browser (dev/desktop)
          window.open(res.invoice_link, "_blank");
          if (btn) { btn.disabled = false; btn.innerHTML = "⭐ Возродить за 10"; }
        }
      } catch (e) {
        toastMessage("Не удалось создать счёт: " + (e.message || "ошибка"));
        if (btn) { btn.disabled = false; btn.innerHTML = "⭐ Возродить за 10"; }
      }
    }

    async function doPetFeed(petId, foodType, btn) {
      const food = FOOD_CATALOG_JS[foodType] || FOOD_CATALOG_JS.kibble;
      if ((walletData?.balance||0) < food.cost) { toastMessage("Недостаточно монет 🪙"); return; }
      const origHtml = btn?.innerHTML;
      if (btn) { btn.disabled = true; btn.textContent = "⏳"; }
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
      try {
        const res = await fetch("/app/api/pet/feed", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData: currentInitData, petId, foodType}),
        });
        if (!res.ok) {
          const err = await res.json().catch(()=>({}));
          const MSGS = { already_fed:"Питомец уже сыт 😊", insufficient_coins:"Недостаточно монет 🪙", pet_is_dead:"Питомец умер 💀" };
          toastMessage(MSGS[err.detail]||"Ошибка. Попробуй ещё раз.");
          if (btn) { btn.disabled=false; btn.innerHTML=origHtml; }
          return;
        }
        const data = await res.json();
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        updateBalanceDisplay(data.new_balance);
        const xpMsg = data.xp_gained ? ` +${data.xp_gained} XP` : "";
        const REL_FEED_LABEL = { friends: " 💛", dating: " 💕", married: " 💍" };
        const relSuffix = data.rel_tier ? (REL_FEED_LABEL[data.rel_tier] || "") : "";
        toastMessage(`${food.emoji} Накормлен!${xpMsg}${relSuffix}`);
        await _refreshPets();
      } catch {
        if (btn) { btn.disabled=false; btn.innerHTML=origHtml||""; }
        toastMessage("Ошибка. Попробуй ещё раз.");
      }
    }

    async function doPetAction(petId, action, btn) {
      const origHtml = btn.innerHTML;
      btn.disabled = true; btn.textContent = "⏳";
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
      try {
        const res = await fetch(`/app/api/pet/${action}`, {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData: currentInitData, petId}),
        });
        if (!res.ok) {
          const err = await res.json().catch(()=>({}));
          const MSGS = { play_cooldown:"Питомец устал 😴", cuddle_cooldown:"Слишком часто — подожди час 🌸", pet_is_dead:"Питомец умер 💀" };
          toastMessage(MSGS[err.detail]||"Ошибка. Попробуй ещё раз.");
          btn.disabled=false; btn.innerHTML=origHtml; return;
        }
        const data = await res.json();
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        const REL_ACTION_ICON = { friends: " 💛", dating: " 💕", married: " 💍" };
        const relIcon = data.rel_tier ? (REL_ACTION_ICON[data.rel_tier] || "") : "";
        if (data.coins_found > 0 && data.new_balance != null) {
          updateBalanceDisplay(data.new_balance);
          toastMessage(`🍀 Удача! +${data.coins_found} 🪙 нашёл питомец!`);
        } else {
          const TOASTS = {
            play:   (data.play_msg || `🎮 Поиграли! +${data.xp_gained||0} XP`) + relIcon,
            cuddle: `🤗 Обнял питомца! ❤️ +${data.xp_gained||0} XP${relIcon}`,

          toastMessage(TOASTS[action]||"✅ Готово!");

        await _refreshPets();
      } catch {
        btn.disabled=false; btn.innerHTML=origHtml;
        toastMessage("Ошибка. Попробуй ещё раз.");
      }
    }

      const overlay = document.createElement("div");

        <div class="balance-sheet">
          <div class="balance-sheet-title">✏️ Переименовать питомца</div>

          <button class="balance-set-btn" id="renameConfirm" style="width:100%">Переименовать</button>
          <button class="balance-cancel-btn" id="renameCancel">Отмена</button>

          });

    // ── Pet-list cache helpers ────────────────────────────────────────────────
    const _PET_CACHE_TTL  = 45_000; // 45 seconds
    const _SHOP_CACHE_TTL = 45_000; // 45 seconds

    async function _fetchPetListCached() {
      const now = Date.now();
      if (_petCache.ts && (now - _petCache.ts < _PET_CACHE_TTL) && _petCache.data) {
        return _petCache.data;
      }
      const res = await fetch("/app/api/pet/list", {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ initData: currentInitData }),
      });
      const data = res.ok ? await res.json() : { pets: [], available_chats: [], feed_cost: 20 };
      _petCache = { ts: Date.now(), data };
      return data;
    }

    async function refreshPetSection() {
      _petCache.ts = 0; // invalidate
      petData = await _fetchPetListCached().catch(() => petData);
      _renderPetOnly();
    }

    // Re-render only the pet section in-place (no casino flash)
    function _renderPetOnly() {
      const wrap = document.getElementById("petSectionWrap");
      if (!wrap) { renderCasino(); return; }
      const tmp = document.createElement("div");
      tmp.innerHTML = renderPetsSection();
      wrap.replaceWith(tmp.firstElementChild);
      attachPetHandlers();
      _startPetAgeTicker();
    }

    async function _refreshPets() {
      try {
        const res = await fetch("/app/api/pet/list", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({initData: currentInitData}),
        });
        if (res.ok) {
          const freshData = await res.json();
          _petCache = { ts: Date.now(), data: freshData };
          petData = freshData;
        }
        _renderPetOnly();
      } catch {}
    }

    async function loadShop(forceRefresh = false) {
      const now = Date.now();
      const cacheHit = !forceRefresh
        && _shopCache.ts && (now - _shopCache.ts < _SHOP_CACHE_TTL)
        && _shopCache.walletData;
      if (cacheHit) {
        walletData = _shopCache.walletData;
        shopData   = _shopCache.shopData;
        renderShop();
        // Background version check: if prices changed on the server, bust cache
        // and silently re-render so users never see stale prices for more than
        // one network round-trip (~100–500 ms) even within the 45 s TTL.
        _shopCheckPricesVersion();
        return;
      }

      const el = document.getElementById("shopContent");
      if (!_shopCache.ts) {
        // First load — show skeleton
        el.innerHTML = `<div class="empty skeleton"><span class="big-emoji">🛒</span>Загружаем…</div>`;
      }
      try {
        const opts = { method: "POST", headers: { "Content-Type": "application/json" },
                       body: JSON.stringify({ initData: currentInitData }) };
        const [wRes, sRes, freshPet] = await Promise.all([
          fetch("/app/api/wallet/info", opts),
          fetch("/app/api/shop/status", opts),
          _fetchPetListCached(),
        ]);
        if (!wRes.ok) throw new Error();
        // Capture the in-memory balance before overwriting walletData.  If a
        // coin-spend (e.g. pet food purchase) completed while this wallet fetch
        // was in-flight, the server response may still carry the pre-deduction
        // balance.  Keep the lower (more recent) client value so the casino
        // wallet card never shows a stale balance after a concurrent spend.
        const _prevBalance = walletData?.balance;
        walletData = await wRes.json();
        if (_prevBalance !== undefined && _prevBalance < walletData.balance) {
          walletData.balance = _prevBalance;
        }
        shopData   = sRes.ok ? await sRes.json() : { active_boosts: [], settings: {}, prices: {} };
        if (shopData.settings) _userCardSettings = { theme: shopData.settings.theme || "default", frame: shopData.settings.frame || "none" };
        petData    = freshPet;
        _shopCache = { ts: Date.now(), walletData, shopData, pricesVersion: shopData.prices_version || null, walletVersion: walletData.wallet_version || null };
        shopLoaded = true;
        renderShop();
      } catch {
        el.innerHTML = `<div class="error"><span class="big-emoji">⚠️</span>Не удалось загрузить.<br>Попробуй обновить.</div>`;
      }
    }

    /** Fetch the prices_version and wallet_version hashes in parallel and, if
     *  either differs from the cached value, bust the shop cache and trigger a
     *  silent full re-fetch.  Called in the background after every cache-hit
     *  render so users see fresh data within one network round-trip even inside
     *  the 45 s TTL. */
    async function _shopCheckPricesVersion() {
      if (!_shopCache.pricesVersion && !_shopCache.walletVersion) return; // nothing to compare yet
      try {
        const opts = { method: "POST", headers: { "Content-Type": "application/json" },
                       body: JSON.stringify({ initData: currentInitData }) };
        const [pricesRes, walletVerRes] = await Promise.all([
          fetch("/app/api/shop/prices-version", opts),
          fetch("/app/api/wallet/version", opts),
        ]);
        let stale = false;
        if (pricesRes.ok) {
          const { prices_version } = await pricesRes.json();
          if (prices_version && prices_version !== _shopCache.pricesVersion) stale = true;
        }
        if (!stale && walletVerRes.ok) {
          const { wallet_version } = await walletVerRes.json();
          if (wallet_version && wallet_version !== _shopCache.walletVersion) stale = true;
        }
        if (stale) {
          // Something changed on the server — bust the cache and reload silently.
          _shopInvalidateCache();
          await loadShop(true);
        }
      } catch {
        // Network hiccup — ignore; the next manual tab-switch will refresh.
      }
    }

    function _shopInvalidateCache() { _shopCache.ts = 0; }

    async function refreshShopSection() {
      _shopInvalidateCache();
      await loadShop(true);
    }

    async function buyCoinPackage(pkgId, btn) {
      const orig = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = "⏳";
      try {
        const res = await fetch("/app/api/shop/coins/invoice", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData: currentInitData, packageId: pkgId }),
        });
        if (!res.ok) throw new Error("Ошибка создания счёта");
        const data = await res.json();

        if (!tg?.openInvoice) {
          // Fallback: open invoice link in browser
          window.open(data.invoice_link, "_blank");
          btn.disabled = false; btn.innerHTML = orig;
          return;
        }

        tg.openInvoice(data.invoice_link, (status) => {
          btn.disabled = false; btn.innerHTML = orig;
          if (status === "paid") {
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
            toastMessage(`🪙 ${data.coins.toLocaleString("ru-RU")} монет зачислено!`);
            // Reload shop after a moment for the DB to commit
            setTimeout(async () => {
              try {
                _shopInvalidateCache();
                await loadShop(true);
              } catch {}
            }, 1500);
          } else if (status === "failed") {
            toastMessage("❌ Платёж не прошёл");
          }
          // "cancelled" — silent
        });
      } catch (e) {
        btn.disabled = false; btn.innerHTML = orig;
        toastMessage(e.message || "Ошибка");
      }
    }

    function attachShopHandlers(prices, settings, chats, bal) {
      // Coin package buttons
      document.querySelectorAll(".coin-pkg-btn[data-pkg]").forEach(btn => {
        btn.addEventListener("click", () => buyCoinPackage(btn.dataset.pkg, btn));
      });

      // Double XP boost
      document.getElementById("buyDxpBtn")?.addEventListener("click", async () => {
        const btn = document.getElementById("buyDxpBtn");
        const cost = prices.double_xp ?? 200;
        btn.disabled = true; btn.textContent = "⏳";
        // Optimistic deduction: track the actual deducted amount (may be < cost at low
        // balance due to clamping) so the revert is exactly symmetric.
        const _balBefore = walletData.balance ?? 0;
        const _actualDelta = Math.min(cost, _balBefore); // what was truly subtracted
        walletData.balance = _balBefore - _actualDelta;
        updateBalanceDisplay(walletData.balance);
        let _settled = false;
        const _revert = () => { if (!_settled) { _settled = true; walletData.balance += _actualDelta; updateBalanceDisplay(walletData.balance); } };
        try {
          const res = await fetch("/app/api/shop/boost", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ initData: currentInitData, boostType: "double_xp" }),
          });
          if (!res.ok) {
            const e = await res.json().catch(() => ({}));
            _revert();
            throw new Error({ insufficient_coins: "Недостаточно монет 🪙" }[e.detail] || "Ошибка");
          }
          const data = await res.json();
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
          _settled = true; // success — reconcile with server truth, don't revert
          updateBalanceDisplay(data.new_balance);
          toastMessage("⚡ Двойной XP активирован на 24 часа!");
          _shopInvalidateCache();
          await loadShop(true);
        } catch (e) { _revert(); btn.disabled = false; btn.textContent = "Купить"; toastMessage(e.message); }

          // balance due to clamping) so the revert is exactly symmetric.
          const _balBefore = walletData.balance ?? 0;
          const _actualDelta = Math.min(cost, _balBefore);
          walletData.balance = _balBefore - _actualDelta;
          updateBalanceDisplay(walletData.balance);
          let _settled = false;
          const _revert = () => { if (!_settled) { _settled = true; walletData.balance += _actualDelta; updateBalanceDisplay(walletData.balance); } };
          try {
            const res = await fetch("/app/api/shop/pin-chat", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ initData: currentInitData, chatId }),

              const e = await res.json().catch(() => ({}));

              throw new Error({ insufficient_coins: "Недостаточно монет 🪙" }[e.detail] || "Ошибка");

            const data = await res.json();
            _settled = true; // success — reconcile with server truth, don't revert

            await loadShop(true);

      });

      // Theme card buttons
      document.querySelectorAll(".theme-card-btn[data-theme]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const theme   = btn.dataset.theme;
          const isOwned = btn.dataset.owned === "true";
          btn.disabled = true; btn.textContent = "⏳";
          // Optimistic deduction only for purchases (not activating an already-owned theme).
          // Subtract only this request's delta so concurrent requests don't clobber each
          // other when one fails and one succeeds.
          const themeCost = isOwned ? 0 : ((prices.theme_prices || {})[theme] ?? (THEMES.find(t => t.id === theme)?.price ?? 100));
          // Optimistic deduction only for purchases (not activating an already-owned theme).
          // Track the actual deducted amount (may be < cost at low balance) so the revert is symmetric.
          let _actualDelta = 0;
          if (!isOwned && themeCost > 0) {
            const _balBefore = walletData.balance ?? 0;
            _actualDelta = Math.min(themeCost, _balBefore);
            walletData.balance = _balBefore - _actualDelta;
            updateBalanceDisplay(walletData.balance);
          }
          let _settled = false;
          const _revert = () => {
            if (!_settled && _actualDelta > 0) {
              _settled = true; walletData.balance += _actualDelta; updateBalanceDisplay(walletData.balance);
            }
          };
          try {
            const endpoint = isOwned ? "/app/api/shop/theme/activate" : "/app/api/shop/theme";
            const res = await fetch(endpoint, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ initData: currentInitData, theme }),

            if (!res.ok) {
              const e = await res.json().catch(() => ({}));
              _revert();
              throw new Error({ insufficient_coins: "Недостаточно монет 🪙", not_owned: "Тема не куплена" }[e.detail] || "Ошибка");
            }
            const data = await res.json();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
            _settled = true; // success — reconcile with server truth, don't revert
            if (data.new_balance != null) updateBalanceDisplay(data.new_balance);
            // Update in-memory shopData immediately so openMyCard() gets the
            // new theme even if the user opens the card before loadShop() returns.
            if (shopData?.settings) shopData.settings.theme = theme;
            const label = THEMES.find(t => t.id === theme)?.label ?? theme;
            toastMessage(isOwned ? `🎨 Тема «${label}» применена на карточку!` : `🎨 Тема «${label}» куплена и применена на карточку!`);
            _shopInvalidateCache();
            await loadShop(true);
          } catch (e) {
            _revert();
            btn.disabled = false;
            btn.textContent = isOwned ? "Применить" : btn.textContent;
            toastMessage(e.message);
          }
        });
      });

      // Frame buttons
      document.querySelectorAll(".frame-btn[data-frame]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const frame = btn.dataset.frame;
          const cost = prices.frame ?? 150;
          btn.disabled = true;
          // Optimistic deduction: track the actual deducted amount (may be < cost at low
          // balance due to clamping) so the revert is exactly symmetric.
          const _balBefore = walletData.balance ?? 0;
          const _actualDelta = Math.min(cost, _balBefore);
          walletData.balance = _balBefore - _actualDelta;
          updateBalanceDisplay(walletData.balance);
          let _settled = false;
          const _revert = () => { if (!_settled) { _settled = true; walletData.balance += _actualDelta; updateBalanceDisplay(walletData.balance); } };
          try {
            const res = await fetch("/app/api/shop/frame", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ initData: currentInitData, frame }),
            });
            if (!res.ok) {
              const e = await res.json().catch(() => ({}));
              _revert();
              throw new Error({ insufficient_coins: "Недостаточно монет 🪙" }[e.detail] || "Ошибка");
            }
            const data = await res.json();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
            _settled = true; // success — reconcile with server truth, don't revert
            updateBalanceDisplay(data.new_balance);
            toastMessage(`🖼 Рамка «${FRAMES.find(f => f.id === frame)?.label}» применена!`);
            _shopInvalidateCache();
            await loadShop(true);
          } catch (e) { _revert(); btn.disabled = false; toastMessage(e.message); }
        });
      });

      // Gift coins
      document.getElementById("giftCoinsBtn")?.addEventListener("click", () => {
        if (!chats.length) return;
        openChatPickerModal("🎁 Подарить монеты", chats, async (chatId, chatName) => {
          const cost = prices.gift ?? 30;
          // Optimistic deduction: track the actual deducted amount (may be < cost at low
          // balance due to clamping) so the revert is exactly symmetric.
          const _balBefore = walletData.balance ?? 0;
          const _actualDelta = Math.min(cost, _balBefore);
          walletData.balance = _balBefore - _actualDelta;
          updateBalanceDisplay(walletData.balance);
          let _settled = false;
          const _revert = () => { if (!_settled) { _settled = true; walletData.balance += _actualDelta; updateBalanceDisplay(walletData.balance); } };
          try {
            const res = await fetch("/app/api/shop/gift", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ initData: currentInitData, chatId }),
            });
            if (!res.ok) {
              const e = await res.json().catch(() => ({}));
              _revert();
              throw new Error({ insufficient_coins: "Недостаточно монет 🪙", cannot_gift_self: "Нельзя подарить себе!" }[e.detail] || "Ошибка");
            }
            const data = await res.json();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
            _settled = true; // success — reconcile with server truth, don't revert
            updateBalanceDisplay(data.new_balance);
            toastMessage(`🎁 Подарок отправлен в чат с ${chatName}! Получит ${prices.gift_amount ?? 50} 🪙`);
            _shopInvalidateCache();
            await loadShop(true);
          } catch (e) { _revert(); toastMessage(e.message); }
        });
      });
    }

    function openChatPickerModal(title, chats, onSelect) {
      const overlay = document.createElement("div");
      overlay.className = "balance-overlay";
      overlay.innerHTML = `
        <div class="balance-sheet">
          <div class="balance-sheet-title">${esc(title)}</div>
          <div class="adopt-chats">
            ${chats.map(c => `
              <button class="adopt-chat-btn" data-chat-id="${c.chat_id}" data-name="${esc(c.display_name)}">
                <div class="adopt-chat-avatar" style="background:${colorFor(c.display_name)}">${initials(c.display_name)}</div>
                <div class="adopt-chat-name">${esc(c.display_name)}</div>
                <div class="adopt-chat-msgs">${c.message_count} сообщ.</div>
              </button>`).join("")}
          </div>
          <button class="balance-cancel-btn" id="chatPickerClose">Отмена</button>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector("#chatPickerClose").addEventListener("click", () => overlay.remove());
      overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
      overlay.querySelectorAll(".adopt-chat-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          overlay.remove();
          await onSelect(Number(btn.dataset.chatId), btn.dataset.name);
        });
      });
    }

    let referralLoaded = false;

    function renderReferralSection() {
      if (!referralData) return "";
      const d = referralData;
      if (!d.enabled) return `<div class="ref-empty" style="margin-top:16px">🔗 Реферальная программа сейчас на паузе — загляни позже</div>`;

      const lvl    = d.level    || { name: "Bronze", emoji: "🥉", color: "#CD7F32" };
      const nextLv = d.next_level;
      const nextMs = d.next_milestone;
      const active = d.active_count || 0;

      let progPct = 100, progLabel = "Максимальный уровень!";
      if (nextLv) {
        const span = nextLv.min - lvl.min;
        progPct  = Math.min(100, Math.round((active - lvl.min) / span * 100));
        const need = nextLv.min - active;
        progLabel = `ещё ${need} ${need===1?"друг":need<5?"друга":"друзей"} — и ты ${nextLv.emoji} ${nextLv.name}`;
      }

      const milestonesHtml = (d.milestones || []).map(m => {
        const done   = active >= m.count;
        const isNext = !done && (!nextMs || m.count === nextMs.count);
        const pct    = Math.min(100, Math.round(active / m.count * 100));
        const icon   = m.type === "premium_days" ? "⭐" : "🏅";
        return `
          <div class="ref-milestone${done ? " done" : ""}${isNext ? " next" : ""}">
            <div class="ref-m-icon">${icon}</div>
            <div class="ref-m-body">
              <div class="ref-m-label">${esc(m.label)}</div>
              <div class="ref-m-sub">${done ? "Выполнено 🎉" : `нужно ${m.count} ${m.count===1?"друга":m.count<5?"друга":"друзей"}${isNext ? ` · осталось ${m.count - active}` : ""}`}</div>
              ${!done ? `<div class="ref-m-prog">
                <div class="ref-m-track"><div class="ref-m-fill" style="width:${pct}%"></div></div>
                <div class="ref-m-count">${active}/${m.count}</div>
              </div>` : ""}
            </div>
            ${done ? `<div class="ref-m-done">✅</div>` : ""}
          </div>`;
      }).join("");

      const recentHtml = d.recent_referrals?.length
        ? d.recent_referrals.map(r => {
            const name    = r.referred_first_name || ("ID " + r.referred_telegram_id);
            const sub     = r.referred_username ? "@" + r.referred_username : ("#" + r.referred_telegram_id);
            const initials = name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
            const bg      = colorFor(String(r.referred_telegram_id));
            const statusLabel = r.status === "active" ? "✓ Активен" : "⏳ Не запустил";
            const statusCls   = r.status === "active" ? "ref-status-active" : "ref-status-pending";
            return `
              <div class="ref-recent-row">
                <div class="ref-recent-avatar" style="background:${bg}">${esc(initials)}</div>
                <div style="flex:1;min-width:0">
                  <div class="ref-recent-name">${esc(name)}</div>
                  <div style="font-size:10.5px;color:var(--hint);margin-top:1px">${esc(sub)}</div>
                </div>
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0">
                  <span class="ref-recent-status ${statusCls}">${statusLabel}</span>
                  <span style="font-size:10px;color:var(--hint)">${r.created_at?.slice(0,10) || ""}</span>
                </div>

          }).join("")
        : `<div class="ref-empty">👥 Ещё никого нет — поделись ссылкой первым!</div>`;

      const REWARD_ICONS = { welcome: "🎁", per_activation: "⭐", milestone: "🏆" };
      const rewardHtml = d.reward_logs?.length
        ? d.reward_logs.map(r => `
            <div class="ref-reward-row">
              <div class="ref-reward-icon">${REWARD_ICONS[r.reward_type] || "🎁"}</div>
